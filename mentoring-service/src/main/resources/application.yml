server:
  port: 8083

spring:
  application:
    name: mentoring-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:mentoring_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: ""
  services:
    profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  timezone: Asia/Ho_Chi_Minh
  booking:
    min-lead-time: PT1H           # phải đặt trước giờ bắt đầu ít nhất 1 giờ
    max-advance: P60D             # chỉ đặt lịch trong vòng 60 ngày tới
    payment-hold: PT30M           # phiên chưa thanh toán sau 30 phút sẽ tự huỷ để giải phóng khung giờ
  reminder:
    before: ${REMINDER_BEFORE:PT24H}   # FR-5.5 — nhắc lịch trước giờ bắt đầu
  intro:                               # buổi làm quen trước khi chốt quan hệ mentoring
    duration-minutes: ${INTRO_DURATION_MINUTES:15}
    max-open-per-mentor: ${INTRO_MAX_OPEN_PER_MENTOR:5}   # số yêu cầu đang ở giai đoạn làm quen tối đa của 1 mentor
  reschedule:
    free-window: ${RESCHEDULE_FREE_WINDOW:PT24H}   # mentee đổi lịch trước giờ hẹn ít nhất bằng khoảng này thì tự áp dụng
    max-per-session: ${RESCHEDULE_MAX_PER_SESSION:2}
  packages:                            # gói buổi (combo)
    tiers: ${PACKAGE_TIERS:4:10,8:15}  # "số buổi:phần trăm giảm giá", phân tách bằng dấu phẩy
    validity: ${PACKAGE_VALIDITY:P90D} # thời hạn sử dụng kể từ lúc thanh toán
    refund-fee-percent: ${PACKAGE_REFUND_FEE_PERCENT:0}   # phí giữ lại khi hoàn tiền các buổi chưa dùng
