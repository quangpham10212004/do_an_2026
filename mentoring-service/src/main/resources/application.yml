server:
  port: 8083

spring:
  application:
    name: mentoring-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:mentoring_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  # US-11 — Flyway quản lý schema. V1__baseline.sql = db/init/<service>.sql (CSDL đã khởi tạo bằng
  # docker-entrypoint-initdb.d được baseline ở version 1); mọi thay đổi schema là V2+.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # Sprint 3 — hai nhóm cùng thêm migration cho service này (Team A: V10–V12, Team B: V13–V14) và triển khai song
    # song lên cùng CSDL: cho phép áp version nhỏ hơn version đã có, và không lỗi khi CSDL có migration của nhánh kia.
    out-of-order: true
    ignore-migration-patterns: "*:missing"

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: ""
  services:
    profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
    matching-url: ${MATCHING_SERVICE_URL:http://localhost:8090}   # US-15 — gợi ý mentor tương tự (best-effort)
    matching-timeout: PT3S
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}     # US-30 — POST /internal/audit (bắn-rồi-quên)
  timezone: Asia/Ho_Chi_Minh
  booking:
    min-lead-time: PT1H           # phải đặt trước giờ bắt đầu ít nhất 1 giờ
    max-advance: P60D             # chỉ đặt lịch trong vòng 60 ngày tới
    payment-hold: PT30M           # phiên chưa thanh toán sau 30 phút sẽ tự huỷ để giải phóng khung giờ
  cancellation:                    # US-01 — chính sách huỷ phiên
    full-refund-before: PT72H       # mentee huỷ trước ≥ 72 giờ → hoàn 100%, muộn hơn → 0%
    free-late-window: PT2H          # phiên miễn phí huỷ < 2 giờ trước giờ bắt đầu = huỷ muộn
    mentor-apology-points: 20       # mentor huỷ → mentee được cộng điểm thưởng (reward_ledger MENTOR_CANCEL_APOLOGY)
    free-block-threshold: 3         # 3 lần huỷ muộn ...
    free-block-window: P30D         # ... trong 30 ngày ...
    free-block-duration: P14D       # ... → chặn đặt phiên miễn phí 14 ngày (409 FREE_BOOKING_BLOCKED)
  strikes:                         # US-02 — strike thứ 3 trong 30 ngày → PAUSED (profile-service) + báo admin
    threshold: 3
    window: P30D
  reschedule:                      # US-06 — dời lịch phiên CONFIRMED
    max-per-session: 2              # tối đa 2 lần dời / phiên (409 RESCHEDULE_LIMIT)
    min-before-start: PT2H          # đề xuất trước giờ bắt đầu ≥ 2 giờ
    proposal-ttl: PT24H             # đề xuất hết hạn sau 24 giờ ...
    expire-before-start: PT1H       # ... hoặc 1 giờ trước giờ bắt đầu gốc (lấy mốc sớm hơn)
    expire-interval: PT1M
  requests:                        # US-14 / US-15 — yêu cầu mentoring
    max-pending: 3                  # mỗi mentee tối đa 3 yêu cầu PENDING (409 TOO_MANY_PENDING_REQUESTS)
    expire-after: PT72H             # US-15 — PENDING không được phản hồi sau 72 giờ → EXPIRED
    expire-interval: PT5M           # chu kỳ job hết hạn yêu cầu
    inactivity-warn-after: P30D     # US-31 — ACCEPTED không có phiên 30 ngày → nhắc "Bạn có muốn tiếp tục?"
    inactivity-end-after: P7D       # ... thêm 7 ngày vẫn không có phiên mới → ENDED (INACTIVE, SYSTEM)
    inactivity-interval: PT1H       # chu kỳ job không hoạt động
  attendance:                      # US-12 — xác nhận tham dự (thay tự hoàn thành sau 2 giờ)
    window: PT48H                   # hai bên trả lời trong [giờ kết thúc, giờ kết thúc + 48h); hết hạn → job kết luận
    interval: PT1M                  # job CONFIRMED → AWAITING_ATTENDANCE và kết luận phiên quá hạn
  disputes:                        # US-32 — tranh chấp
    open-window: P7D                # mở trong 7 ngày sau giờ kết thúc phiên (409 DISPUTE_WINDOW_CLOSED)
    first-response-sla: PT48H       # admin phản hồi đầu tiên trong 48 giờ (cờ overdue ở danh sách admin)
  outbox:
    interval: PT1M                  # gửi lại lời gọi payment-service (điểm thưởng) chưa thành công
  reminder:
    before: ${REMINDER_BEFORE:PT24H}   # FR-5.5 — nhắc lịch trước giờ bắt đầu
