server:
  port: 8085

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:learning_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý (src/main/resources/db/migration), không để Hibernate tự sinh
      ddl-auto: none
  flyway:
    # V1__baseline.sql = db/init/<service>.sql. Volume tạo bằng db/init đã có bảng nhưng chưa có
    # flyway_schema_history => Flyway đánh dấu baseline V1 rồi chạy tiếp V2+ (deployment-guide.md §8).
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

management:
  # US-46: nhãn service trên mọi metric của GET /metrics
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: "/api/learning/blog/covers/*"
  profile-service:
    url: ${PROFILE_SERVICE_URL:http://localhost:8082}   # lấy tên hiển thị tác giả blog
  blog:
    posts-per-hour: ${BLOG_POSTS_PER_HOUR:10}           # giới hạn tạo bài / người / giờ
    comments-per-hour: ${BLOG_COMMENTS_PER_HOUR:30}     # giới hạn bình luận / người / giờ
  storage:                         # Object storage S3 (MinIO trong docker compose). Trống S3_ENDPOINT_URL và S3_ENABLED => ảnh bìa lưu trong CSDL như cũ
    endpoint: ${S3_ENDPOINT_URL:}
    enabled: ${S3_ENABLED:false}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:mmp-files}
    region: ${S3_REGION:us-east-1}
