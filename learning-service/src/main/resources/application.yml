server:
  port: 8085

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:learning_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý (src/main/resources/db/migration), không để Hibernate tự sinh
      ddl-auto: none
  flyway:
    # V1__baseline.sql = db/init/<service>.sql. Volume tạo bằng db/init đã có bảng nhưng chưa có
    # flyway_schema_history => Flyway đánh dấu baseline V1 rồi chạy tiếp V2+ (deployment-guide.md §8).
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: ""
