server:
  port: 8082

spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:profile_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  # US-11 — schema do Flyway quản lý (src/main/resources/db/migration). CSDL đã tạo bằng
  # db/init/profile-service.sql được baseline ở V1, sau đó chạy V2+ lúc khởi động.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: ""
  services:
    # Chỉ dùng để báo matching-service lập lại chỉ mục sau khi hồ sơ thay đổi
    # (POST /internal/embeddings/reindex, bắn rồi quên).
    matching-url: ${MATCHING_SERVICE_URL:http://localhost:8090}
    # US-27 — sau khi admin đình chỉ mentor: báo mentoring-service huỷ phiên tương lai
    # (POST /internal/mentors/{id}/suspend, Team A) và ghi audit log (POST /internal/audit, auth-service).
    mentoring-url: ${MENTORING_SERVICE_URL:http://localhost:8083}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
