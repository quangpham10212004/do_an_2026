openapi: 3.0.3
info:
  title: mentoring-service
  version: 1.0.0
  description: >
    Mentoring workflow — yêu cầu, đặt lịch, đánh giá, thông báo (Thắng).
    Các tính năng AI (AI Interview, CV Parsing + Chatbot enrichment) thuộc ai-service,
    xem contracts/ai-service.yaml — service này không còn logic AI nào.
    mentoring-service sở hữu bảng notifications; ai-service tạo thông báo qua POST /internal/notifications.
servers:
  - url: http://localhost:8083
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Request:
      type: object
      properties:
        id: { type: string, format: uuid }
        menteeId: { type: string, format: uuid }
        menteeName: { type: string }
        mentorId: { type: string, format: uuid }
        mentorName: { type: string }
        message: { type: string, nullable: true }
        goal: { type: string, description: "US-14 — mục tiêu (50–1000 ký tự với yêu cầu mới; yêu cầu cũ được migrate từ message)" }
        sessionType: { $ref: "#/components/schemas/SessionType" }
        frequency: { $ref: "#/components/schemas/RequestFrequency" }
        expectedDurationMonths: { type: integer, enum: [1, 3, 6] }
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED, ENDED]
          description: >
            US-31: ACCEPTED → ENDED (thay COMPLETED cũ; migration V12 đổi COMPLETED → ENDED, giá trị COMPLETED còn sót được
            trả về là ENDED).
            US-15: PENDING không được mentor phản hồi sau 72 giờ (app.requests.expire-after) → EXPIRED (job mỗi 5 phút).
            active_mentee_count của mentor không đổi. Mentee nhận thông báo REQUEST_EXPIRED (link /matching) kèm tối đa 3
            mentor tương tự lấy từ matching-service GET /internal/matching/similar-mentors (best-effort: lỗi/404 → không gợi ý).
        expiredAt: { type: string, format: date-time, nullable: true, description: "US-15 — thời điểm hết hạn" }
        endedBy: { type: string, nullable: true, enum: [MENTEE, MENTOR, ADMIN, SYSTEM], description: "US-31 — null với dữ liệu cũ" }
        endReason: { type: string, nullable: true, enum: [GOAL_REACHED, NO_LONGER_NEEDED, NOT_A_FIT, OTHER, INACTIVE] }
        endNote: { type: string, nullable: true, maxLength: 500 }
        endedAt: { type: string, format: date-time, nullable: true }
        inactivityWarnedAt: { type: string, format: date-time, nullable: true, description: "US-31 — đã nhắc 'Bạn có muốn tiếp tục?' (30 ngày không có phiên); đặt phiên mới xoá" }
        rejectReason: { allOf: [{ $ref: "#/components/schemas/RejectReason" }], nullable: true, description: "US-14 — có khi REJECTED" }
        responseNote: { type: string, nullable: true, description: "Ghi chú tuỳ chọn của mentor khi phản hồi" }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
        menteeProfile:
          type: object
          nullable: true
          description: >
            US-14 — tóm tắt hồ sơ mentee cho mentor/admin xét yêu cầu (chỉ với yêu cầu PENDING/ACCEPTED; lấy best-effort
            từ profile-service GET /api/profile/mentee/{id} bằng X-Internal-Token). Mentee xem danh sách của mình → null.
          properties:
            displayName: { type: string }
            domain: { type: string }
            currentLevel: { type: string, nullable: true, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
            goal: { type: string, description: "Goal hiện tại trong hồ sơ (có thể khác goal của yêu cầu)" }
            skills: { type: array, items: { type: string } }
    RequestFrequency:
      type: string
      enum: [WEEKLY, BIWEEKLY, MONTHLY, ONE_OFF]
    RejectReason:
      type: string
      enum: [FULL, NOT_MY_EXPERTISE, SCHEDULE, OTHER]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        menteeId: { type: string, format: uuid }
        menteeName: { type: string }
        mentorId: { type: string, format: uuid }
        mentorName: { type: string }
        scheduledAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: "scheduledAt + durationMinutes" }
        durationMinutes: { type: integer, enum: [30, 45, 60, 90, 120] }
        price: { type: number, description: "hourlyRate × duration/60, làm tròn 1.000đ" }
        topic: { type: string, nullable: true, description: "Tiêu đề ngắn (tuỳ chọn, client cũ)" }
        sessionType: { $ref: "#/components/schemas/SessionType" }
        agenda: { type: string, nullable: true, description: "US-03 — nội dung muốn trao đổi (phiên tạo trước US-03 có thể null)" }
        preReadLink: { type: string, nullable: true }
        meetingLink:
          type: string
          nullable: true
          description: >
            US-04 — link phòng họp (sao chép từ meetingLink của hồ sơ mentor lúc đặt lịch, mentor có thể đổi).
            Chỉ trả khi status là CONFIRMED hoặc trạng thái sau đó (AWAITING_ATTENDANCE, COMPLETED, NO_SHOW_*, DISPUTED);
            PENDING/EXPIRED/CANCELLED luôn null.
        status: { $ref: "#/components/schemas/SessionStatus" }
        cancelledBy: { type: string, nullable: true, enum: [MENTEE, MENTOR, SYSTEM] }
        cancelReason: { type: string, nullable: true, description: "Lý do người huỷ nhập; EXPIRED do quá hạn thanh toán = PAYMENT_TIMEOUT; huỷ trong buổi gọi (US-12) = CANCELLED_ON_CALL" }
        refundPercent: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        rescheduleCount: { type: integer, description: "US-06 — số lần đã dời lịch (tối đa 2)" }
        menteeAttendance: { allOf: [{ $ref: "#/components/schemas/AttendanceAnswer" }], nullable: true, description: "US-12 — câu trả lời của mentee (null = chưa trả lời)" }
        mentorAttendance: { allOf: [{ $ref: "#/components/schemas/AttendanceAnswer" }], nullable: true, description: "US-12 — câu trả lời của mentor" }
        attendanceDeadline: { type: string, format: date-time, description: "US-12 — endsAt + 48 giờ (app.attendance.window): hạn xác nhận tham dự" }
        attendanceResolution:
          type: string
          nullable: true
          enum: [BOTH_HELD, HELD_ONE_SIDE, NO_ANSWER, MENTEE_NO_SHOW_REPORTED, MENTOR_NO_SHOW_REPORTED, CONFLICT, CANCELLED_ON_CALL, DISPUTE_RESOLVED]
          description: >
            US-12 — cách phiên được kết luận (null với phiên chưa kết luận hoặc hoàn thành trước US-12). DISPUTE_RESOLVED
            (US-32) — phiên DISPUTED / AWAITING_ATTENDANCE thành COMPLETED do tranh chấp kết luận NO_REFUND / WARNING.
        pendingReschedule:
          allOf: [{ $ref: "#/components/schemas/RescheduleProposal" }]
          nullable: true
          description: Đề xuất dời lịch đang chờ phản hồi (nếu có)
        reviewed: { type: boolean }
        reviewRating: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        dispute:
          type: object
          nullable: true
          description: US-32 — tranh chấp gần nhất của phiên (null nếu chưa có)
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED] }
            outcome: { type: string, nullable: true, enum: [FULL_REFUND, PARTIAL_REFUND, NO_REFUND, WARNING, SUSPEND] }
            refundPercent: { type: integer, nullable: true }
    Dispute:
      type: object
      description: >
        US-32 (PRD-ADM-1) — tranh chấp. Mở → giao dịch ON_HOLD (chặn giải phóng thu nhập US-25). Kết luận: FULL_REFUND
        → hoàn 100%; PARTIAL_REFUND → hoàn refundPercent% và giải phóng ngay phần thu nhập còn lại của mentor; NO_REFUND /
        WARNING → giải phóng thu nhập (phiên DISPUTED / AWAITING_ATTENDANCE thành COMPLETED); SUSPEND → hoàn 100% + mentor
        SUSPENDED (profile-service) + huỷ & hoàn các phiên sắp tới. Các kết luận có hoàn tiền giữ nguyên trạng thái phiên
        (vd. DISPUTED) và ghi Session.refundPercent.
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        openedBy: { type: string, format: uuid, nullable: true, description: "null = hệ thống (phiên DISPUTED)" }
        openedByRole: { type: string, enum: [MENTEE, MENTOR, SYSTEM] }
        openedByName: { type: string, nullable: true }
        type: { type: string, enum: [NO_SHOW, QUALITY, BEHAVIOR, PAYMENT, OTHER] }
        description: { type: string, minLength: 20, maxLength: 2000 }
        evidenceLinks: { type: array, maxItems: 5, items: { type: string, format: uri, description: https } }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED] }
        outcome: { type: string, nullable: true, enum: [FULL_REFUND, PARTIAL_REFUND, NO_REFUND, WARNING, SUSPEND] }
        refundPercent: { type: integer, nullable: true, description: "% đã hoàn cho mentee (FULL/SUSPEND 100, PARTIAL 1–99, còn lại 0)" }
        resolutionNote: { type: string, nullable: true }
        resolvedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        firstResponseAt: { type: string, format: date-time, nullable: true, description: "start-review hoặc resolve đầu tiên" }
        firstResponseDueAt: { type: string, format: date-time, description: "SLA — createdAt + 48h (app.disputes.first-response-sla)" }
        overdue: { type: boolean, description: "Chưa phản hồi mà đã quá firstResponseDueAt (hoặc phản hồi trễ)" }
        resolvedAt: { type: string, format: date-time, nullable: true }
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            menteeId: { type: string, format: uuid }
            menteeName: { type: string }
            mentorId: { type: string, format: uuid }
            mentorName: { type: string }
            scheduledAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            price: { type: number }
            status: { $ref: "#/components/schemas/SessionStatus" }
            menteeAttendance: { type: string, nullable: true }
            mentorAttendance: { type: string, nullable: true }
            refundPercent: { type: integer, nullable: true }
    RescheduleProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        proposedBy: { type: string, format: uuid }
        newStart: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "min(tạo + 24 giờ, giờ bắt đầu gốc − 1 giờ)" }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        createdAt: { type: string, format: date-time }
    SessionStatus:
      type: string
      enum: [PENDING, CONFIRMED, AWAITING_ATTENDANCE, COMPLETED, EXPIRED, CANCELLED, NO_SHOW_MENTEE, NO_SHOW_MENTOR, DISPUTED]
      description: >
        PENDING = chờ thanh toán → CONFIRMED (đã thanh toán / miễn phí) | EXPIRED (quá 30 phút chưa thanh toán — trước
        US-12 là CANCELLED + PAYMENT_TIMEOUT, đã migrate); PENDING/CONFIRMED → CANCELLED (huỷ trước giờ bắt đầu).
        US-12: tới giờ kết thúc CONFIRMED → AWAITING_ATTENDANCE; trong 48 giờ hai bên POST /attendance; kết luận →
        COMPLETED | NO_SHOW_MENTEE | NO_SHOW_MENTOR | DISPUTED | CANCELLED (huỷ trong buổi gọi). Chỉ COMPLETED được đánh giá.
    AttendanceAnswer:
      type: string
      enum: [HELD, MENTOR_NO_SHOW, MENTEE_NO_SHOW, CANCELLED_ON_CALL]
      description: "Mentee: HELD | MENTOR_NO_SHOW | CANCELLED_ON_CALL. Mentor: HELD | MENTEE_NO_SHOW | CANCELLED_ON_CALL."
    SessionType:
      type: string
      nullable: true
      enum: [CAREER_ADVICE, CODE_REVIEW, MOCK_INTERVIEW, PROJECT_GUIDANCE]
    AvailableSlots:
      type: object
      properties:
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        durationMinutes: { type: integer }
        price: { type: number, description: "Giá phiên với thời lượng này" }
        slots:
          type: array
          items:
            type: object
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
    MessageView:
      type: object
      description: US-33 — một tin nhắn. body đã che SĐT/email khi cặp chưa có phiên trả phí được xác nhận.
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderRole: { type: string, enum: [MENTEE, MENTOR] }
        body: { type: string, maxLength: 2000 }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
    ConversationSummary:
      type: object
      description: US-33 — một cuộc trò chuyện trong hộp thư (id = id yêu cầu mentoring).
      properties:
        id: { type: string, format: uuid }
        counterpartId: { type: string, format: uuid }
        counterpartName: { type: string }
        counterpartRole: { type: string, enum: [MENTEE, MENTOR] }
        requestStatus: { type: string }
        lastMessage: { type: string, nullable: true }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        lastFromMe: { type: boolean }
        unread: { type: integer }
        writable: { type: boolean, description: "PENDING/ACCEPTED, hoặc ≤ 30 ngày sau ENDED/REJECTED/EXPIRED" }
    MessageReport:
      type: object
      description: US-33 (PRD-MSG-4) — hồ sơ kiểm duyệt tin nhắn.
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        reporterName: { type: string, nullable: true }
        reason: { type: string, enum: [SPAM, HARASSMENT, OFF_PLATFORM_PAYMENT, OTHER] }
        note: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, RESOLVED] }
        outcome: { type: string, enum: [DISMISSED, WARNED], nullable: true }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        reportedMessage: { $ref: "#/components/schemas/MessageView" }
        senderName: { type: string, nullable: true }
        thread:
          type: array
          nullable: true
          description: Toàn bộ cuộc trò chuyện (nguyên văn) — chỉ ở GET chi tiết khi hồ sơ còn OPEN; ngược lại null.
          items: { $ref: "#/components/schemas/MessageView" }
    ActionItem:
      type: object
      description: US-40 — việc cần làm của cặp mentor–mentee (tạo trong một phiên, việc còn mở mang sang phiên sau).
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, description: Phiên tạo ra việc này }
        text: { type: string, minLength: 2, maxLength: 300 }
        owner: { type: string, enum: [MENTEE, MENTOR] }
        dueDate: { type: string, format: date, nullable: true }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        carriedOver: { type: boolean, description: Việc còn mở từ phiên trước của cặp }
        overdue: { type: boolean }
    SharedNote:
      type: object
      properties:
        content: { type: string, maxLength: 20000, description: Markdown }
        version: { type: integer, description: "0 = chưa ai lưu; gửi lại làm baseVersion" }
        updatedBy: { type: string, format: uuid, nullable: true }
        updatedByName: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }

  # ---------------- Mentoring requests ----------------
  /api/mentoring/requests:
    get:
      summary: Yêu cầu của tôi (mentee = đã gửi, mentor = đã nhận)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Request" } }
    post:
      summary: >
        FR-5.2 / US-14 (MENTEE) Gửi yêu cầu theo form tới mentor đã được xác thực. goal bắt buộc 50–1000 ký tự (sau trim),
        sessionType, frequency, expectedDurationMonths ∈ {1, 3, 6}, message tuỳ chọn. Mỗi mentee tối đa 3 yêu cầu PENDING
        (app.requests.max-pending) → 409 TOO_MANY_PENDING_REQUESTS; vẫn chỉ 1 yêu cầu đang mở (PENDING/ACCEPTED) với mỗi mentor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mentorId, goal, sessionType, frequency, expectedDurationMonths]
              properties:
                mentorId: { type: string, format: uuid }
                goal: { type: string, minLength: 50, maxLength: 1000 }
                sessionType: { type: string, enum: [CAREER_ADVICE, CODE_REVIEW, MOCK_INTERVIEW, PROJECT_GUIDANCE] }
                frequency: { $ref: "#/components/schemas/RequestFrequency" }
                expectedDurationMonths: { type: integer, enum: [1, 3, 6] }
                message: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Đã gửi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { description: "VALIDATION_ERROR / INVALID_GOAL / INVALID_EXPECTED_DURATION / MENTOR_NOT_VERIFIED / MENTOR_UNAVAILABLE (isAvailable=false hoặc status PAUSED/ON_LEAVE/SUSPENDED)" }
        "409": { description: REQUEST_ALREADY_EXISTS / TOO_MANY_PENDING_REQUESTS }
  /api/mentoring/requests/{id}/respond:
    post:
      summary: FR-5.3 / US-14 (MENTOR) Chấp nhận / từ chối — chấp nhận chỉ khi còn sức chứa; từ chối bắt buộc rejectReason
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPT, REJECT] }
                rejectReason: { $ref: "#/components/schemas/RejectReason" }
                note: { type: string, maxLength: 500, description: Ghi chú tuỳ chọn (mentee thấy) }
      responses:
        "200": { description: Request }
        "400": { description: REJECT_REASON_REQUIRED / VALIDATION_ERROR }
        "409": { description: REQUEST_NOT_PENDING / CAPACITY_FULL }
  /api/mentoring/requests/{id}/cancel:
    post:
      summary: (MENTEE) Huỷ yêu cầu đang chờ
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Request }
  /api/mentoring/requests/{id}/end:
    post:
      summary: >
        US-31 (PRD-REQ-6) — mentee hoặc mentor (hoặc ADMIN) kết thúc quan hệ ACCEPTED → ENDED (endedBy, endReason, endedAt),
        giải phóng 1 slot sức chứa (active-mentee sync chỉ đếm ACCEPTED). Các phiên sắp tới PENDING/CONFIRMED của cặp bị huỷ
        theo chính sách huỷ như thể người kết thúc huỷ (mentee < 72 giờ → hoàn 0%, ≥ 72 giờ → 100%; mentor → hoàn 100% +
        20 điểm xin lỗi + strike; admin → SYSTEM hoàn 100%). Báo bên còn lại. Job: ACCEPTED không có phiên (đã lên lịch hoặc
        đã diễn ra) 30 ngày → nhắc hai bên; thêm 7 ngày không có phiên mới → ENDED reason INACTIVE, endedBy SYSTEM. Chưa có
        nhắn tin nên điều kiện "không có tin nhắn" của PRD chưa áp dụng.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [GOAL_REACHED, NO_LONGER_NEEDED, NOT_A_FIT, OTHER] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Request (status ENDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { description: INVALID_END_REASON (INACTIVE chỉ hệ thống dùng) | VALIDATION_ERROR }
        "403": { description: Không thuộc quan hệ này }
        "409": { description: REQUEST_NOT_ACTIVE }
        "502": { description: REFUND_FAILED khi huỷ phiên đã thanh toán — quan hệ vẫn ACCEPTED, gọi lại an toàn }
  /api/mentoring/requests/{id}/complete:
    post:
      deprecated: true
      summary: "Giữ cho client cũ — = POST /requests/{id}/end với reason OTHER (US-31)"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Request (status ENDED) }

  # ---------------- Sessions ----------------
  /api/mentoring/sessions:
    get:
      summary: FR-5.7 Lịch sử phiên của tôi
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SessionStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      summary: >
        FR-5.4 / PRD-SES-1 (MENTEE) Đặt lịch — yêu cầu đã ACCEPTED; trạng thái mentor không phải
        ON_LEAVE (tới hết onLeaveUntil) / SUSPENDED (PAUSED vẫn cho mentee đã được nhận); đặt trước
        ≥ max(1 giờ, minNoticeHours của mentor — mặc định 12) và trong 60 ngày; nằm trọn trong lịch rảnh
        hằng tuần (giờ Asia/Ho_Chi_Minh) và không rơi vào ngoại lệ (nghỉ cả ngày / bận một khoảng giờ);
        không trùng phiên PENDING/CONFIRMED của mentor tính cả bufferMinutes trước và sau (mặc định 15 —
        phiên 10:00–11:00 chặn tới 11:15) hoặc của mentee. Kiểm tra trùng + tạo phiên chạy dưới advisory
        lock theo mentor. Dữ kiện mentor lấy từ profile-service GET /internal/mentor/{id} (status,
        onLeaveUntil, bufferMinutes, minNoticeHours, exceptions — thiếu thì dùng mặc định).
        Phiên có phí → PENDING (chờ thanh toán, quá 30 phút → EXPIRED); phiên miễn phí → CONFIRMED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menteeId, mentorId, scheduledAt, sessionType, agenda]
              properties:
                menteeId: { type: string, format: uuid }
                mentorId: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
                durationMinutes: { type: integer, enum: [30, 45, 60, 90, 120], default: 60 }
                sessionType: { type: string, enum: [CAREER_ADVICE, CODE_REVIEW, MOCK_INTERVIEW, PROJECT_GUIDANCE] }
                agenda: { type: string, minLength: 20, maxLength: 500, description: "Bắt buộc, 20–500 ký tự sau khi trim" }
                preReadLink: { type: string, maxLength: 500, nullable: true, description: "Tuỳ chọn, URL http(s)" }
                topic: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Session đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: NOT_ACCEPTED / TOO_SOON / TOO_FAR / INVALID_DURATION / INVALID_AGENDA / INVALID_PRE_READ_LINK / VALIDATION_ERROR }
        "409": { description: MENTOR_NOT_AVAILABLE / MENTEE_SCHEDULE_CONFLICT / MENTOR_ON_LEAVE / MENTOR_SUSPENDED / FREE_BOOKING_BLOCKED }
  /api/mentoring/sessions/{id}:
    get:
      summary: Chi tiết phiên (người tham gia / admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Session }
  /api/mentoring/sessions/{id}/cancel-preview:
    get:
      summary: >
        US-01 (người tham gia / admin) Xem trước kết quả nếu huỷ phiên ngay bây giờ theo chính sách:
        mentee huỷ ≥ 72 giờ trước → hoàn 100%, < 72 giờ → 0%; mentor huỷ → hoàn 100% + 20 điểm cho mentee +
        1 strike; admin/hệ thống → 100%. Phiên chưa thanh toán / miễn phí → 0đ. Ngưỡng cấu hình app.cancellation.*.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelledBy: { type: string, enum: [MENTEE, MENTOR, SYSTEM] }
                  refundPercent: { type: integer }
                  refundAmount: { type: number, description: "VND, 0 nếu chưa thanh toán" }
                  policyText: { type: string }
                  rewardPoints: { type: integer, description: "Điểm xin lỗi mentee được cộng (mentor huỷ)" }
                  lateFreeCancel: { type: boolean, description: "Huỷ phiên miễn phí < 2 giờ trước giờ bắt đầu → ghi nhận huỷ muộn" }
        "409": { description: SESSION_NOT_CANCELLABLE / SESSION_ALREADY_STARTED }
  # US-02: mentor huỷ phiên → bảng mentor_strikes; strike thứ 3 trong 30 ngày (app.strikes.*) → gọi
  # profile-service PUT /internal/mentor/{id}/status {"status":"PAUSED","reason":"STRIKES"} (best-effort,
  # 404 được bỏ qua) + thông báo cho toàn bộ ADMIN (type MENTOR_PAUSED_STRIKES) và cho mentor.
  /api/mentoring/sessions/{id}/cancel:
    post:
      summary: >
        Huỷ phiên chưa bắt đầu theo chính sách US-01 (xem cancel-preview). Phiên đã thanh toán và được hoàn > 0%
        → gọi payment-service hoàn tiền TRƯỚC (lỗi → 502 REFUND_FAILED, phiên không bị huỷ). Lưu cancelledBy,
        cancelReason, refundPercent. Mentor huỷ → điểm xin lỗi (POST /internal/rewards qua outbox) + strike.
        Mentee huỷ phiên miễn phí < 2 giờ trước → ghi nhận huỷ muộn; 3 lần trong 30 ngày → đặt phiên miễn phí
        bị chặn 14 ngày (409 FREE_BOOKING_BLOCKED ở POST /api/mentoring/sessions).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { description: Session }
  /api/mentoring/sessions/{id}/reschedule:
    post:
      summary: >
        US-06 (MENTEE/MENTOR của phiên) Đề xuất dời phiên CONFIRMED sang giờ mới, trước giờ bắt đầu ≥ 2 giờ.
        Tối đa 2 lần dời / phiên, 1 đề xuất mở / phiên. Giờ mới phải qua cùng kiểm tra như đặt lịch (trạng thái mentor,
        minNoticeHours, lịch rảnh, ngoại lệ, trùng lịch có buffer — bỏ qua chính phiên này). Khi PENDING, khung giờ
        đề xuất được tính là bận (cả ở đặt lịch và available-slots). Hết hạn lúc min(tạo + 24h, giờ gốc − 1h),
        job mỗi phút chuyển EXPIRED. Ngưỡng cấu hình app.reschedule.*.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStart]
              properties:
                newStart: { type: string, format: date-time }
      responses:
        "201":
          description: Đề xuất đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescheduleProposal" }
        "400": { description: TOO_SOON / TOO_FAR / SAME_START }
        "409": { description: SESSION_NOT_CONFIRMED / RESCHEDULE_TOO_LATE / RESCHEDULE_LIMIT / RESCHEDULE_PENDING / MENTOR_NOT_AVAILABLE / MENTEE_SCHEDULE_CONFLICT / MENTOR_ON_LEAVE / MENTOR_SUSPENDED }
  /api/mentoring/reschedules/{id}/accept:
    post:
      summary: >
        US-06 Bên còn lại chấp nhận → phiên chuyển sang giờ mới (giữ thời lượng, giá, thanh toán), rescheduleCount + 1,
        nhắc lịch được gửi lại. Kiểm tra trùng lịch lại dưới advisory lock.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Phiên sau khi dời
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { description: Người đề xuất không tự chấp nhận }
        "409": { description: RESCHEDULE_NOT_PENDING / RESCHEDULE_EXPIRED / SESSION_NOT_CONFIRMED / MENTOR_NOT_AVAILABLE / MENTEE_SCHEDULE_CONFLICT }
  /api/mentoring/reschedules/{id}/decline:
    post:
      summary: US-06 Bên còn lại từ chối, hoặc người đề xuất rút lại → DECLINED; phiên giữ giờ cũ
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescheduleProposal" }
        "409": { description: RESCHEDULE_NOT_PENDING / RESCHEDULE_EXPIRED }
  /api/mentoring/sessions/{id}/meeting-link:
    put:
      summary: >
        US-04 (MENTOR của phiên / ADMIN) Đổi link phòng họp cho 1 phiên PENDING/CONFIRMED chưa kết thúc.
        Chỉ chấp nhận https trên meet.google.com, zoom.us, *.zoom.us, teams.microsoft.com.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meetingLink]
              properties:
                meetingLink: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Phiên sau cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: INVALID_MEETING_LINK }
        "403": { description: Không phải mentor của phiên }
        "409": { description: SESSION_NOT_EDITABLE }
  /api/mentoring/sessions/{id}/complete:
    post:
      summary: >
        (MENTOR của phiên / ADMIN thay mentor) Giữ từ Sprint 1 — từ US-12 tương đương mentor trả lời HELD ở
        POST /attendance (cùng điều kiện cửa sổ 48 giờ). Không còn chuyển thẳng sang COMPLETED.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Session }
        "409": { description: ATTENDANCE_NOT_OPEN / ATTENDANCE_WINDOW_CLOSED / ATTENDANCE_ALREADY_ANSWERED / ATTENDANCE_CLOSED }
  /api/mentoring/sessions/{id}/attendance:
    post:
      summary: >
        US-12 (MENTEE / MENTOR của phiên) Xác nhận tham dự, 1 lần mỗi bên, từ giờ kết thúc tới giờ kết thúc + 48 giờ
        (app.attendance.window). Kết luận: cả hai HELD → COMPLETED; trả lời khác nhau → DISPUTED ngay (giao dịch ON_HOLD
        qua POST /internal/payments/hold — chờ xử lý tranh chấp US-32); một bên trả lời, bên kia im lặng 48 giờ → theo
        câu đó (HELD → COMPLETED; mentor báo MENTEE_NO_SHOW → NO_SHOW_MENTEE, không hoàn; mentee báo MENTOR_NO_SHOW →
        NO_SHOW_MENTOR, hoàn 100% + 1 strike MENTOR_NO_SHOW); không ai trả lời → COMPLETED. CANCELLED_ON_CALL (cả hai,
        hoặc một bên + bên kia im lặng) → CANCELLED, cancelledBy SYSTEM, cancelReason CANCELLED_ON_CALL, hoàn 100%,
        không strike. Hoàn tiền / tạm giữ đi qua outbox (gửi ngay sau commit, job mỗi phút gửi lại).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: "#/components/schemas/AttendanceAnswer" }
      responses:
        "200":
          description: Phiên sau khi ghi câu trả lời (có thể đã được kết luận)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: "INVALID_ATTENDANCE_ANSWER (tự báo mình vắng mặt) / VALIDATION_ERROR" }
        "403": { description: Không tham gia phiên }
        "409": { description: "ATTENDANCE_NOT_OPEN (chưa tới giờ kết thúc) / ATTENDANCE_WINDOW_CLOSED (quá 48 giờ) / ATTENDANCE_ALREADY_ANSWERED / ATTENDANCE_CLOSED (đã kết luận)" }
  /api/mentoring/sessions/{id}/disputes:
    post:
      summary: >
        (MENTEE/MENTOR của phiên) US-32 "Báo cáo sự cố" — phiên COMPLETED / NO_SHOW_MENTEE / NO_SHOW_MENTOR /
        AWAITING_ATTENDANCE, trong 7 ngày sau giờ kết thúc (app.disputes.open-window). Phiên có phí → giao dịch ON_HOLD.
        Báo cho hai bên và admin.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: { type: string, enum: [NO_SHOW, QUALITY, BEHAVIOR, PAYMENT, OTHER] }
                description: { type: string, minLength: 20, maxLength: 2000 }
                evidenceLinks: { type: array, maxItems: 5, items: { type: string, description: "URL https" } }
      responses:
        "201":
          description: Tranh chấp (status OPEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { description: INVALID_DESCRIPTION | TOO_MANY_EVIDENCE_LINKS | INVALID_EVIDENCE_LINK | VALIDATION_ERROR }
        "403": { description: Không phải mentee/mentor của phiên }
        "409": { description: DISPUTE_ALREADY_OPEN (1 tranh chấp đang mở / phiên) | DISPUTE_WINDOW_CLOSED (> 7 ngày) | DISPUTE_NOT_ALLOWED (trạng thái phiên) }
    get:
      summary: (người tham gia phiên / ADMIN) US-32 — các tranh chấp của phiên, mới nhất trước
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dispute" } }
  /api/mentoring/sessions/{id}/review:
    post:
      summary: FR-5.6 (MENTEE) Đánh giá sau phiên COMPLETED (không đánh giá được NO_SHOW_*/DISPUTED/CANCELLED) — rating trung bình đồng bộ sang profile-service
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Review }
        "409": { description: SESSION_NOT_COMPLETED / ALREADY_REVIEWED }
  /api/mentoring/mentors/{id}/reviews:
    get:
      summary: Các đánh giá của 1 mentor
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "Review[]" }
  /api/mentoring/mentors/{id}/available-slots:
    get:
      summary: >
        FR-5.4 Các thời điểm có thể đặt lịch với mentor — bước 30 phút, nằm trọn trong lịch rảnh
        hằng tuần trừ ngoại lệ, không trùng phiên PENDING/CONFIRMED của mentor (tính buffer) hoặc của
        người gọi, bỏ ngày mentor ON_LEAVE/SUSPENDED, tuân thủ max(min-lead-time, minNoticeHours) và
        max-advance — cùng quy tắc với POST /api/mentoring/sessions. Chỉ trả thời điểm, không lộ thông tin
        phiên của người khác.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: durationMinutes, in: query, schema: { type: integer, enum: [30, 45, 60, 90, 120], default: 60 } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 28, default: 14 } }
        - { name: excludeSessionId, in: query, required: false, schema: { type: string, format: uuid }, description: "US-06 — khi dời lịch: bỏ qua khoảng bận của phiên này (chỉ khi người gọi tham gia phiên)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableSlots" }
        "404": { description: MENTOR_NOT_FOUND }

  # ---------------- Notifications ----------------
  /api/mentoring/notifications:
    get:
      summary: FR-5.5 Thông báo của tôi (kèm số chưa đọc)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200": { description: "{ unreadCount, items: [{ id, type, title, message, link, read, createdAt }] }" }
  /api/mentoring/notifications/{id}/read:
    post:
      summary: Đánh dấu đã đọc
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: OK }
  /api/mentoring/notifications/read-all:
    post:
      summary: Đánh dấu tất cả đã đọc
      responses:
        "204": { description: OK }

  # ---------------- Admin ----------------
  /api/mentoring/admin/stats:
    get:
      summary: (ADMIN) Thống kê phiên mentoring (số liệu AI Interview ở GET /api/ai/admin/stats)
      responses:
        "200": { description: "{ pendingSessions, confirmedSessions, completedSessions, cancelledSessions, awaitingAttendanceSessions, expiredSessions, noShowMenteeSessions, noShowMentorSessions, disputedSessions }" }

  /api/mentoring/admin/disputes:
    get:
      summary: (ADMIN) US-32 — danh sách tranh chấp kèm SLA (firstResponseDueAt, overdue)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, ACTIVE] }, description: "ACTIVE = OPEN + IN_REVIEW (cũ nhất trước); trống = tất cả (mới nhất trước)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dispute" } }
  /api/mentoring/admin/disputes/{id}:
    get:
      summary: (ADMIN) US-32 — chi tiết tranh chấp
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "404": { description: DISPUTE_NOT_FOUND }
  /api/mentoring/admin/disputes/{id}/start-review:
    post:
      summary: (ADMIN) US-32 — OPEN → IN_REVIEW, ghi firstResponseAt; báo hai bên. Ghi audit DISPUTE_REVIEW_STARTED.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "409": { description: DISPUTE_NOT_OPEN }
  /api/mentoring/admin/disputes/{id}/resolve:
    post:
      summary: >
        (ADMIN) US-32 — kết luận (từ OPEN hoặc IN_REVIEW). Tiền qua outbox theo thứ tự: giải phóng ON_HOLD → hoàn % →
        final-state DISPUTE_RESOLVED releaseNow (trừ FULL_REFUND / SUSPEND). SUSPEND: mentor SUSPENDED + huỷ & hoàn các phiên
        sắp tới. Báo hai bên; ghi audit DISPUTE_RESOLVED (+ MENTOR_SUSPENDED).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: { type: string, enum: [FULL_REFUND, PARTIAL_REFUND, NO_REFUND, WARNING, SUSPEND] }
                refundPercent: { type: integer, minimum: 1, maximum: 99, description: "Bắt buộc với PARTIAL_REFUND, không gửi với kết luận khác" }
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Tranh chấp (status RESOLVED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "400": { description: INVALID_REFUND_PERCENT | NOTE_REQUIRED | VALIDATION_ERROR }
        "409": { description: DISPUTE_ALREADY_RESOLVED }

  # ---------------- Internal (payment-service, ai-service) ----------------
  /internal/sessions/{id}:
    get:
      summary: Nội bộ — thông tin phiên để payment-service tính tiền
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "{ id, menteeId, mentorId, scheduledAt, durationMinutes, price, status }" }
  /internal/sessions/{id}/payment-succeeded:
    post:
      summary: Nội bộ — FR-6.2 xác nhận phiên sau thanh toán thành công (phiên đã CANCELLED / EXPIRED → tự hoàn tiền)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string, format: uuid }
      responses:
        "200": { description: Phiên sau cập nhật }
  /internal/notifications:
    post:
      summary: Nội bộ — tạo thông báo trong ứng dụng (ai-service dùng để báo kết quả AI Interview / enrichment)
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, message]
              properties:
                recipientId: { type: string, format: uuid, nullable: true, description: Gửi cho 1 người dùng }
                recipientRole: { type: string, nullable: true, description: "Gửi cho toàn bộ role (ví dụ ADMIN) khi recipientId trống" }
                type: { type: string }
                title: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 2000 }
                link: { type: string, maxLength: 500, nullable: true }
      responses:
        "204": { description: OK }
        "400": { description: RECIPIENT_REQUIRED }
  /internal/relationships:
    get:
      summary: Nội bộ — mentor và mentee có yêu cầu mentoring đang mở (PENDING hoặc ACCEPTED) hay không
      description: >-
        ai-service dùng để kiểm tra quyền mentor tải CV của mentee: chỉ mentor đang xét yêu cầu (PENDING)
        hoặc đang hướng dẫn (ACCEPTED) mentee đó mới được tải. Yêu cầu REJECTED/CANCELLED/COMPLETED không tính.
      security: [{ internalToken: [] }]
      parameters:
        - { name: mentorId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: menteeId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentorId: { type: string, format: uuid }
                  menteeId: { type: string, format: uuid }
                  related: { type: boolean, description: "true khi có yêu cầu PENDING hoặc ACCEPTED giữa hai người" }
        "400": { description: BAD_REQUEST (thiếu hoặc sai định dạng mentorId/menteeId) }

  # ---------------- Dev only (không tồn tại ở profile prod) ----------------
  /internal/mentors/{mentorId}/suspend:
    post:
      summary: >
        Nội bộ — US-27 (profile-service / Team B gọi sau khi admin chuyển mentor sang SUSPENDED; tranh chấp SUSPEND của
        US-32 gọi logic này trực tiếp): huỷ mọi phiên sắp tới PENDING/CONFIRMED của mentor với cancelledBy = SYSTEM,
        hoàn 100% (chính sách huỷ SYSTEM), báo mentee (và mentor). Idempotent — lần sau trả cancelledSessions 0.
        Lỗi hoàn tiền của một phiên → các phiên khác vẫn được huỷ, trả 502 SUSPEND_INCOMPLETE để gọi lại.
      security: [{ internalToken: [] }]
      parameters:
        - { name: mentorId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                actorId: { type: string, format: uuid, nullable: true, description: "Admin thực hiện (audit)" }
      responses:
        "200": { description: "{ mentorId, cancelledSessions }" }
        "502": { description: SUSPEND_INCOMPLETE }
  /internal/dev/sessions/{id}/shift:
    post:
      summary: >
        DEV/E2E — dời giờ phiên để phiên đã kết thúc endedMinutesAgo phút trước (kiểm thử US-12 không phải chờ).
        Chỉ X-Internal-Token; bean bị tắt ở profile prod (giống auth-service /internal/dev/emails).
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endedMinutesAgo: { type: integer, default: 0 }
      responses:
        "200": { description: "{ id, scheduledAt, endsAt, status }" }
  /internal/dev/requests/{id}/shift:
    post:
      summary: "DEV/E2E — lùi created_at của yêu cầu về createdHoursAgo giờ trước (kiểm thử US-15). Không có ở profile prod."
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                createdHoursAgo: { type: integer, default: 0 }
      responses:
        "200": { description: "{ id, createdAt, status }" }
        "404": { description: REQUEST_NOT_FOUND }
  /internal/dev/requests/{id}/inactivity:
    post:
      summary: "DEV/E2E — US-31: lùi lúc tạo/chấp nhận về lastActivityDaysAgo ngày trước và đặt inactivity_warned_at = warnedDaysAgo ngày trước (null = chưa nhắc). Không có ở profile prod."
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lastActivityDaysAgo: { type: integer }
                warnedDaysAgo: { type: integer, nullable: true }
      responses:
        "200": { description: "{ id, lastActivity, inactivityWarnedAt }" }
  /internal/dev/jobs/{job}:
    post:
      summary: "DEV/E2E — chạy ngay job nền: attendance (US-12) | payment-outbox | unpaid-expiry | request-expiry (US-15) | inactivity (US-31). Không có ở profile prod."
      security: [{ internalToken: [] }]
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, enum: [attendance, payment-outbox, unpaid-expiry, request-expiry, inactivity] } }
      responses:
        "200": { description: "{ job, status: DONE }" }
        "404": { description: JOB_NOT_FOUND }

  # =====================================================================================================
  # Relationship workspace (US-28, PRD-REQ-5) — Team B. Quan hệ = yêu cầu mentoring đã được chấp nhận
  # (relationshipId = id yêu cầu). Bảng relationship_goals (migration V13). Xem: hai bên tham gia + ADMIN;
  # sửa: chỉ hai bên tham gia khi yêu cầu còn ACCEPTED (mọi trạng thái khác — ENDED, COMPLETED... — chỉ đọc).
  # Yêu cầu chưa từng được chấp nhận (PENDING/REJECTED/CANCELLED/EXPIRED) → 404 RELATIONSHIP_NOT_FOUND.
  # Schema khai báo inline để không đụng components của Team A.
  # =====================================================================================================
  /api/mentoring/relationships/{relationshipId}:
    get:
      summary: >
        US-28 — không gian mentoring: tóm tắt quan hệ, mục tiêu (1–5) và các phiên của cặp mentor–mentee (mới nhất
        trước; phiên gắn yêu cầu này hoặc phiên cũ không gắn yêu cầu). Lần mở đầu tiên tự tạo mục tiêu đầu từ goal
        của yêu cầu (cắt ≤ 300 ký tự, createdBy = null).
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      mentorId: { type: string, format: uuid }
                      mentorName: { type: string }
                      menteeId: { type: string, format: uuid }
                      menteeName: { type: string }
                      goal: { type: string, description: Goal gốc của yêu cầu }
                      sessionType: { type: string, enum: [CAREER_ADVICE, CODE_REVIEW, MOCK_INTERVIEW, PROJECT_GUIDANCE] }
                      frequency: { type: string, enum: [WEEKLY, BIWEEKLY, MONTHLY, ONE_OFF] }
                      expectedDurationMonths: { type: integer }
                      status: { type: string, description: "Trạng thái yêu cầu: ACCEPTED, COMPLETED, ENDED (US-31)..." }
                      createdAt: { type: string, format: date-time }
                      respondedAt: { type: string, format: date-time, nullable: true }
                  goals:
                    type: array
                    description: "Theo position tăng dần; mỗi phần tử giống response 201 của POST .../goals"
                    items: { type: object }
                  openActionItems:
                    type: array
                    description: US-40 — việc còn mở của cặp (mọi phiên), sắp theo hạn; ADMIN nhận mảng rỗng
                    items: { $ref: "#/components/schemas/ActionItem" }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        scheduledAt: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time }
                        durationMinutes: { type: integer }
                        status: { type: string }
                        sessionType: { type: string, nullable: true }
                        topic: { type: string, nullable: true }
                  readOnly: { type: boolean, description: "true khi yêu cầu không còn ACCEPTED" }
                  canEdit: { type: boolean, description: "Người xem là một bên tham gia và readOnly = false (ADMIN luôn false)" }
                  maxGoals: { type: integer, example: 5 }
        "403": { description: FORBIDDEN — không phải hai bên tham gia / ADMIN }
        "404": { description: RELATIONSHIP_NOT_FOUND }

  /api/mentoring/relationships/{relationshipId}/goals:
    post:
      summary: US-28 — thêm mục tiêu (cuối danh sách, TODO). Tối đa 5.
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 5, maxLength: 300, description: "Đếm sau khi trim/gộp khoảng trắng" }
      responses:
        "201":
          description: Mục tiêu đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  text: { type: string }
                  status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
                  position: { type: integer, description: "0-based, liền mạch" }
                  createdBy: { type: string, format: uuid, nullable: true, description: "null = tạo tự động từ yêu cầu" }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        "400": { description: INVALID_GOAL · VALIDATION_ERROR }
        "403": { description: FORBIDDEN — không phải hai bên tham gia (ADMIN chỉ đọc) }
        "404": { description: RELATIONSHIP_NOT_FOUND }
        "409": { description: GOAL_LIMIT_REACHED (đã có 5) · RELATIONSHIP_READ_ONLY }

  /api/mentoring/relationships/{relationshipId}/goals/order:
    put:
      summary: US-28 — sắp xếp lại; goalIds phải là hoán vị của đúng các mục tiêu hiện có. Trả về danh sách mới.
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalIds]
              properties:
                goalIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: Danh sách mục tiêu theo thứ tự mới }
        "400": { description: INVALID_GOAL_ORDER }
        "403": { description: FORBIDDEN }
        "409": { description: RELATIONSHIP_READ_ONLY }

  /api/mentoring/relationships/{relationshipId}/goals/{goalId}:
    put:
      summary: US-28 — sửa nội dung và/hoặc trạng thái (cần ít nhất một trường).
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 5, maxLength: 300 }
                status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
      responses:
        "200": { description: Mục tiêu sau khi sửa }
        "400": { description: INVALID_GOAL · VALIDATION_ERROR }
        "403": { description: FORBIDDEN }
        "404": { description: RELATIONSHIP_NOT_FOUND · GOAL_NOT_FOUND }
        "409": { description: RELATIONSHIP_READ_ONLY }
    delete:
      summary: US-28 — xoá mục tiêu; không bao giờ xuống dưới 1 mục tiêu. Vị trí còn lại được dồn về 0..n-1.
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Đã xoá }
        "403": { description: FORBIDDEN }
        "404": { description: RELATIONSHIP_NOT_FOUND · GOAL_NOT_FOUND }
        "409": { description: LAST_GOAL · RELATIONSHIP_READ_ONLY }
  /api/mentoring/conversations:
    get:
      summary: >
        US-33 — hộp thư: các cuộc trò chuyện của người dùng (mới nhất trước). Mỗi yêu cầu mentoring có đúng 1 cuộc trò
        chuyện, mở ngay khi yêu cầu được gửi; yêu cầu đã đóng mà không có tin nào thì không hiện.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
  /api/mentoring/conversations/unread-count:
    get:
      summary: US-33 — tổng số tin chưa đọc (badge trên thanh điều hướng).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { unread: { type: integer } } }
  /api/mentoring/conversations/{id}:
    get:
      summary: >
        US-33 — luồng tin nhắn (cũ → mới, tối đa 200 tin mới nhất). Chỉ hai bên tham gia (ADMIN → 403, xem qua hồ sơ
        kiểm duyệt). Frontend polling mỗi pollIntervalSeconds giây với `after` = createdAt của tin cuối. Gọi endpoint
        này = đánh dấu đã đọc.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: id yêu cầu mentoring }
        - { name: after, in: query, required: false, schema: { type: string, format: date-time }, description: Chỉ trả tin mới hơn mốc này }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/ConversationSummary" }
                  messages: { type: array, items: { $ref: "#/components/schemas/MessageView" } }
                  contactsMasked: { type: boolean, description: SĐT/email đang bị che (chưa có phiên trả phí được xác nhận) }
                  remainingBeforeAccept: { type: integer, nullable: true, description: "Số tin mentee còn gửi được trước khi được chấp nhận; null = không giới hạn" }
                  readOnlyAt: { type: string, format: date-time, nullable: true }
                  pollIntervalSeconds: { type: integer, example: 10 }
        "403": { description: FORBIDDEN }
        "404": { description: CONVERSATION_NOT_FOUND }
  /api/mentoring/conversations/{id}/messages:
    post:
      summary: >
        US-33 — gửi tin (chỉ văn bản, 1–2000 ký tự sau khi trim, cho phép link). Trước khi yêu cầu được chấp nhận mentee
        gửi tối đa 3 tin. Bên nhận có thông báo MESSAGE_RECEIVED cho tin chưa đọc đầu tiên của mỗi đợt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Đã gửi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageView" }
        "400": { description: INVALID_MESSAGE }
        "403": { description: FORBIDDEN }
        "404": { description: CONVERSATION_NOT_FOUND }
        "409": { description: "CONVERSATION_READ_ONLY — yêu cầu đã huỷ, hoặc đã quá 30 ngày sau ENDED/REJECTED/EXPIRED" }
        "429": { description: MESSAGE_LIMIT_BEFORE_ACCEPT }
  /api/mentoring/messages/{messageId}/report:
    post:
      summary: >
        US-33 (PRD-MSG-4) — báo cáo tin nhắn của bên kia → hồ sơ kiểm duyệt OPEN, thông báo cho ADMIN.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [SPAM, HARASSMENT, OFF_PLATFORM_PAYMENT, OTHER] }
                note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Đã tạo hồ sơ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReport" }
        "400": { description: CANNOT_REPORT_OWN_MESSAGE }
        "403": { description: FORBIDDEN }
        "404": { description: MESSAGE_NOT_FOUND }
        "409": { description: ALREADY_REPORTED }
  /api/mentoring/admin/message-reports:
    get:
      summary: US-33 — hàng đợi kiểm duyệt tin nhắn (ADMIN). status = OPEN (cũ nhất trước) | RESOLVED; trống = tất cả (mới nhất trước).
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, RESOLVED] } }
      responses:
        "200":
          description: OK (thread luôn null ở danh sách)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MessageReport" } }
  /api/mentoring/admin/message-reports/{id}:
    get:
      summary: US-33 — chi tiết hồ sơ; kèm toàn bộ cuộc trò chuyện nguyên văn CHỈ khi hồ sơ còn OPEN (ghi audit MESSAGE_THREAD_VIEWED).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReport" }
        "404": { description: REPORT_NOT_FOUND }
  /api/mentoring/admin/message-reports/{id}/resolve:
    post:
      summary: >
        US-33 — đóng hồ sơ: DISMISSED (không vi phạm) | WARNED (gửi cảnh cáo cho người gửi tin). Thông báo người báo cáo;
        ghi audit MESSAGE_REPORT_RESOLVED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [DISMISSED, WARNED] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageReport" }
        "404": { description: REPORT_NOT_FOUND }
        "409": { description: REPORT_ALREADY_RESOLVED }
  /api/mentoring/sessions/{id}/notes:
    get:
      summary: >
        US-40 — ghi chú phiên: ghi chú chung (markdown), action item của phiên + việc còn mở mang sang từ phiên trước của
        cặp, và ghi chú riêng (chỉ khi người xem là mentor). Chỉ mentor/mentee của phiên (ADMIN → 403).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  shared: { $ref: "#/components/schemas/SharedNote" }
                  actionItems: { type: array, items: { $ref: "#/components/schemas/ActionItem" } }
                  privateNote:
                    type: object
                    nullable: true
                    description: Chỉ mentor; mentee luôn null
                    properties:
                      content: { type: string, maxLength: 10000 }
                      updatedAt: { type: string, format: date-time, nullable: true }
                  editable: { type: boolean, description: false khi phiên CANCELLED / EXPIRED }
                  viewerRole: { type: string, enum: [MENTEE, MENTOR] }
                  maxActionItems: { type: integer, example: 20 }
        "403": { description: FORBIDDEN }
        "404": { description: SESSION_NOT_FOUND }
    put:
      summary: >
        US-40 — lưu ghi chú chung (autosave). baseVersion = version đã đọc; lệch (người kia vừa lưu) → 409 NOTES_CONFLICT,
        tải lại rồi sửa tiếp. Nội dung không đổi thì version giữ nguyên.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, baseVersion]
              properties:
                content: { type: string, maxLength: 20000 }
                baseVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedNote" }
        "403": { description: FORBIDDEN }
        "409": { description: NOTES_CONFLICT · SESSION_NOTES_READ_ONLY }
  /api/mentoring/sessions/{id}/private-note:
    put:
      summary: US-40 — ghi chú riêng của mentor (mentee → 403).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 10000 }
      responses:
        "200": { description: "OK — { content, updatedAt }" }
        "403": { description: FORBIDDEN }
  /api/mentoring/sessions/{id}/action-items:
    post:
      summary: >
        US-40 — thêm việc cần làm (tối đa 20 mỗi phiên). Giao cho bên kia → bên đó nhận thông báo ACTION_ITEM_ASSIGNED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, owner]
              properties:
                text: { type: string, minLength: 2, maxLength: 300 }
                owner: { type: string, enum: [MENTEE, MENTOR] }
                dueDate: { type: string, format: date, description: Không được ở quá khứ }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
        "400": { description: INVALID_ACTION_ITEM · INVALID_DUE_DATE }
        "403": { description: FORBIDDEN }
        "409": { description: ACTION_ITEM_LIMIT · SESSION_NOTES_READ_ONLY }
  /api/mentoring/action-items/{itemId}:
    patch:
      summary: US-40 — sửa một phần (text, owner, dueDate, clearDueDate, done). Hai bên của cặp đều sửa được.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 300 }
                owner: { type: string, enum: [MENTEE, MENTOR] }
                dueDate: { type: string, format: date }
                clearDueDate: { type: boolean }
                done: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionItem" }
        "403": { description: FORBIDDEN }
        "404": { description: ACTION_ITEM_NOT_FOUND }
    delete:
      summary: US-40 — xoá việc cần làm.
