openapi: 3.0.3
info:
  title: ai-service
  version: 2.0.0
  description: >
    Service AI (Python/FastAPI) sở hữu trọn vẹn 3 tính năng AI: AI Interview (Thắng),
    CV Parsing + Chatbot enrichment (Quang) — cả luồng nghiệp vụ lẫn dữ liệu (CSDL riêng `ai_db`,
    file CV trên volume). Không service Java nào còn giữ logic AI.

    Engine: DEEPSEEK (khi có DEEPSEEK_API_KEY, gọi DeepSeek Chat Completions ở JSON Output mode) hoặc
    RULE_BASED (thuật toán luật, tất định, chạy offline). Nếu lời gọi DeepSeek lỗi, lượt đó tự dùng
    RULE_BASED; engine chọn ở lượt đầu được lưu lại để cả buổi dùng nhất quán một engine.

    ai-service gọi profile-service (`/internal/mentor/{id}`, `/internal/mentor/{id}/verification`,
    `/api/profile/mentee/{id}`, `/api/profile/mentee/{id}/enrichment-chat`) và mentoring-service
    (`/internal/notifications`) bằng header X-Internal-Token.

    Phỏng vấn giọng nói (v2.1 — FR-7.7 mentor, FR-10.x mentee luyện phỏng vấn): ai-service gọi OpenAI
    `POST /v1/realtime/client_secrets` (OPENAI_API_KEY) để cấp client secret ngắn hạn; trình duyệt nói chuyện trực tiếp với
    OpenAI Realtime qua WebRTC rồi gửi bản ghi về ai-service để chấm. Không có OPENAI_API_KEY: APP_ENV=prod => 503
    VOICE_UNAVAILABLE; ngoài prod buổi vẫn được tạo với `voice: null`.
servers:
  - url: http://localhost:8091
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: CV_NO_TEXT }
            message: { type: string }
    InterviewTurn:
      type: object
      properties:
        turnNo: { type: integer }
        topic: { type: string }
        strategy: { type: string, enum: [OPENING, DEEPEN, PIVOT] }
        question: { type: string }
        answer: { type: string, nullable: true }
        score:
          type: number
          nullable: true
          description: >
            Điểm câu 0-10 = 0.4·technical + 0.3·depth + 0.15·communication + 0.15·mentoring (US-23; lượt trước Sprint 3
            giữ điểm cũ). null với mentor khi buổi phỏng vấn chưa kết thúc.
        feedback: { type: string, nullable: true }
        rubric:
          allOf: [{ $ref: "#/components/schemas/RubricScores" }]
          nullable: true
          description: US-23 — null với lượt trước Sprint 3 hoặc khi điểm đang ẩn với mentor
        flags:
          type: array
          items: { type: string, enum: [PROMPT_INJECTION, COPIED_ANSWER] }
          description: Chỉ trả cho admin
        engine: { type: string, nullable: true, enum: [DEEPSEEK, RULE_BASED], description: "PRD-AIV-7 (chỉ admin): engine thực sự chấm lượt này" }
        model: { type: string, nullable: true, description: Model LLM (null với rule-based) — chỉ admin }
        promptVersion: { type: string, nullable: true, description: "vd. deepseek-interview-rubric-v1 | rule-based-rubric-v1 — chỉ admin" }
        fallbackUsed: { type: boolean, nullable: true, description: Lượt của buổi DeepSeek được chấm bằng rule-based — chỉ admin }
        durationSeconds: { type: integer, nullable: true, description: "PRD-AIV-2: thời gian từ lúc hỏi tới lúc trả lời" }
        askedAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
    Interview:
      type: object
      properties:
        id: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        mentorName: { type: string, nullable: true, description: Chỉ trả về cho admin }
        domain: { type: string }
        skills: { type: array, items: { type: string } }
        status: { type: string, enum: [IN_PROGRESS, PENDING_REVIEW, APPROVED, REJECTED, RETAKE_REQUESTED, ABANDONED] }
        mode:
          type: string
          enum: [VOICE]
          description: "FR-7.7 — luôn VOICE (OpenAI Realtime; mỗi chủ đề đã hỏi là một lượt, maxTurns = số chủ đề kế hoạch). Luồng chat đã bỏ (D1)"
        consentExternalAi: { type: boolean, description: "FR-7.7 — mentor đồng ý âm thanh được OpenAI (Mỹ) xử lý (true với VOICE)" }
        plan:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/PlanTopic" }
          description: "v2.1 — kế hoạch câu hỏi buổi giọng nói (AI soạn, dự phòng ngân hàng câu hỏi). Chỉ admin; chat / buổi trước 011 => null"
        engine: { type: string, enum: [DEEPSEEK, RULE_BASED] }
        maxTurns: { type: integer }
        currentTurn: { type: integer }
        currentQuestion: { $ref: "#/components/schemas/InterviewTurn" }
        turns: { type: array, items: { $ref: "#/components/schemas/InterviewTurn" } }
        overallScore: { type: number, nullable: true, description: 0-100 }
        summary: { type: string, nullable: true }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        recommendation:
          type: string
          nullable: true
          enum: [APPROVE, REJECT, NEEDS_REVIEW]
          description: "US-23: overallScore ≥ 70 APPROVE, 50–69.9 NEEDS_REVIEW, < 50 REJECT; có lượt bị gắn cờ => NEEDS_REVIEW"
        flagged: { type: boolean, description: Có lượt bị gắn cờ — chỉ admin }
        reviewNote: { type: string, nullable: true }
        selfAnswerAcknowledged: { type: boolean, description: "US-22: mentor đã xác nhận tự trả lời (false với buổi trước Sprint 3)" }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        resumeDeadline:
          type: string
          format: date-time
          nullable: true
          description: >-
            IN_PROGRESS kết nối lại được tới bắt đầu + VOICE_SESSION_MINUTES (30 phút). Quá hạn → ABANDONED (tính là 1 lần)
        feedbackVisible:
          type: boolean
          description: "US-43 (PRD-AIV-5) — mentor chỉ thấy score / feedback / rubric từng câu khi APPROVED / REJECTED / RETAKE_REQUESTED; admin luôn thấy"
    RubricScores:
      type: object
      description: "US-23 (PRD 6.1) — mỗi tiêu chí 0-10. Trọng số 40/30/15/15."
      required: [technical, depth, communication, mentoring]
      properties:
        technical: { type: number, minimum: 0, maximum: 10, description: "Độ chính xác kỹ thuật (40%)" }
        depth: { type: number, minimum: 0, maximum: 10, description: "Chiều sâu / kinh nghiệm (30%)" }
        communication: { type: number, minimum: 0, maximum: 10, description: "Giao tiếp (15%)" }
        mentoring: { type: number, minimum: 0, maximum: 10, description: "Năng lực hướng dẫn (15%)" }
    InterviewEligibility:
      type: object
      description: >
        US-22 (PRD-AIV-4). Một lần = buổi đã có kết quả (PENDING_REVIEW/APPROVED/REJECTED); IN_PROGRESS và
        RETAKE_REQUESTED không tính. Bị từ chối INTERVIEW_MAX_ATTEMPTS (3) lần => locked cho tới khi admin mở khoá
        (chỉ tính các buổi sau lần mở khoá gần nhất). Buổi gần nhất REJECTED => chờ INTERVIEW_COOLDOWN_DAYS (7) ngày.
      properties:
        attemptsUsed: { type: integer }
        attemptsLeft: { type: integer }
        maxAttempts: { type: integer }
        cooldownUntil: { type: string, format: date-time, nullable: true }
        locked: { type: boolean }
        canStart: { type: boolean, description: true khi được bắt đầu buổi mới hoặc đang có buổi dở }
        reason: { type: string, nullable: true, enum: [IN_PROGRESS, PENDING_REVIEW, ALREADY_APPROVED, LOCKED, COOLDOWN] }
        voiceAvailable: { type: boolean, description: "FR-7.7 — server có OPENAI_API_KEY (lựa chọn Giọng nói dùng được)" }
    VoiceSession:
      type: object
      description: >
        Client secret ngắn hạn của OpenAI Realtime (POST /v1/realtime/client_secrets, hết hạn sau 10 phút nếu chưa kết nối).
        Trình duyệt gửi SDP tới https://api.openai.com/v1/realtime/calls với Authorization Bearer clientSecret, kênh dữ liệu
        `oai-events`. Model gọi tool begin_topic(topic_no) trước mỗi chủ đề và end_interview khi kết thúc. API key thật không
        bao giờ tới trình duyệt.
      required: [clientSecret, expiresAt, model, topics]
      properties:
        clientSecret: { type: string }
        expiresAt: { type: integer, description: Unix time (giây) }
        model: { type: string, example: gpt-realtime }
        topics: { type: array, items: { type: string }, description: Tên các chủ đề theo thứ tự topicNo 1..n }
    TranscriptItem:
      type: object
      description: "marker = model gọi begin_topic(topicNo); assistant / user = một lượt nói đã chép lời"
      required: [role]
      properties:
        role: { type: string, enum: [marker, assistant, user] }
        text: { type: string, maxLength: 5000, nullable: true }
        topicNo: { type: integer, nullable: true }
    TranscriptInput:
      type: object
      required: [items]
      description: >
        Bản ghi theo thứ tự hội thoại. Mọi lời nói sau marker chủ đề n (tới marker kế tiếp) thuộc chủ đề n; lời chào trước
        marker đầu tiên bị bỏ; chủ đề trùng số được gộp; chủ đề ngoài kế hoạch bị bỏ. Không còn chủ đề nào => 400 EMPTY_TRANSCRIPT.
      properties:
        items: { type: array, maxItems: 400, items: { $ref: "#/components/schemas/TranscriptItem" } }
    VoiceInterviewStart:
      type: object
      properties:
        interview: { $ref: "#/components/schemas/Interview" }
        voice:
          allOf: [{ $ref: "#/components/schemas/VoiceSession" }]
          nullable: true
          description: null khi chưa cấu hình OPENAI_API_KEY (chỉ ngoài prod) — dev/e2e gửi bản ghi giả lập
    PracticeRubric:
      type: object
      description: "FR-10.x — mỗi tiêu chí 0-10. Trọng số 35/25/25/15. Điểm câu = tổng có trọng số; điểm tổng = trung bình × 10."
      required: [technical, problemSolving, communication, structure]
      properties:
        technical: { type: number, minimum: 0, maximum: 10, description: "Kiến thức kỹ thuật (35%)" }
        problemSolving: { type: number, minimum: 0, maximum: 10, description: "Giải quyết vấn đề & chiều sâu (25%)" }
        communication: { type: number, minimum: 0, maximum: 10, description: "Trình bày rõ ràng khi nói (25%)" }
        structure: { type: number, minimum: 0, maximum: 10, description: "Cấu trúc: STAR (BEHAVIORAL) / cách tiếp cận (15%)" }
    PracticeTurn:
      type: object
      properties:
        topicNo: { type: integer }
        topic: { type: string }
        question: { type: string, description: Lời người phỏng vấn trong chủ đề, nối bằng " / " }
        answer: { type: string, description: "Lời mentee; không trả lời => \"(Bạn không trả lời câu hỏi này.)\"" }
        score: { type: number, description: 0-10 }
        rubric: { $ref: "#/components/schemas/PracticeRubric" }
        feedback: { type: string }
        flags: { type: array, items: { type: string, enum: [PROMPT_INJECTION] } }
    SpeakingReport:
      type: object
      properties:
        fillerCount: { type: integer, description: "Tổng số từ đệm: ừm, à, ờ, uh, um, kiểu như, thì là" }
        fillers: { type: object, additionalProperties: { type: integer }, example: { "ừm": 2, "kiểu như": 1 } }
        answerCount: { type: integer, description: Số chủ đề mentee có trả lời }
        avgWordsPerAnswer: { type: number }
        shortAnswers: { type: integer, description: Số câu trả lời dưới 20 từ }
        unanswered: { type: integer }
    PracticeResult:
      type: object
      properties:
        overallScore: { type: number, description: 0-100 }
        summary: { type: string }
        strengths: { type: array, items: { type: string }, minItems: 3, maxItems: 3 }
        improvements: { type: array, items: { type: string }, minItems: 3, maxItems: 3, description: Danh sách hành động của mentee (chỉ là văn bản) }
        turns: { type: array, items: { $ref: "#/components/schemas/PracticeTurn" } }
        speaking: { $ref: "#/components/schemas/SpeakingReport" }
        engine: { type: string, enum: [DEEPSEEK, RULE_BASED] }
        model: { type: string, nullable: true }
        promptVersion: { type: string, example: practice-v1, description: "practice-v1 (DeepSeek) | rule-based-practice-v1" }
        fallbackUsed: { type: boolean }
    PlanTopic:
      type: object
      description: >
        v2.1 phương án A — một chủ đề trong kế hoạch câu hỏi soạn MỘT lần lúc bắt đầu buổi giọng nói (DeepSeek, prompt plan-v1)
        từ hồ sơ, mục tiêu và CV đã xác nhận (chỉ CV đồng ý gửi AI bên ngoài). Không có DeepSeek / JSON sai => ngân hàng câu hỏi.
      properties:
        name: { type: string }
        question: { type: string }
        source: { type: string, enum: [BANK, CV, GOAL, AI] }
    Practice:
      type: object
      properties:
        id: { type: string, format: uuid }
        menteeId: { type: string, format: uuid }
        interviewType: { type: string, enum: [BACKEND, FRONTEND, SYSTEM_DESIGN, BEHAVIORAL] }
        level: { type: string, enum: [INTERN, FRESHER, JUNIOR] }
        targetRole: { type: string }
        targetCompany: { type: string, nullable: true }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, ABANDONED] }
        topics: { type: array, items: { type: string } }
        plan:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/PlanTopic" }
          description: "v2.1 — kế hoạch câu hỏi + nguồn; null khi IN_PROGRESS (không lộ câu hỏi trước)"
        engine: { type: string, enum: [DEEPSEEK, RULE_BASED] }
        consentExternalAi: { type: boolean }
        overallScore: { type: number, nullable: true }
        result:
          allOf: [{ $ref: "#/components/schemas/PracticeResult" }]
          nullable: true
          description: Có khi COMPLETED — hiện ngay cho mentee, không qua admin
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        resumeDeadline: { type: string, format: date-time, nullable: true, description: "IN_PROGRESS: bắt đầu + VOICE_SESSION_MINUTES (30 phút)" }
    PracticeEligibility:
      type: object
      properties:
        freeLimit: { type: integer, example: 1, description: PRACTICE_FREE_LIMIT }
        used: { type: integer, description: Số buổi COMPLETED / ABANDONED (tối đa freeLimit) }
        canStart: { type: boolean }
        reason: { type: string, nullable: true, enum: [PRACTICE_FREE_USED, IN_PROGRESS], description: "IN_PROGRESS => bắt đầu = kết nối lại buổi đang dở" }
        inProgressId: { type: string, format: uuid, nullable: true }
        voiceAvailable: { type: boolean }
    PracticeStart:
      type: object
      properties:
        practice: { $ref: "#/components/schemas/Practice" }
        voice:
          allOf: [{ $ref: "#/components/schemas/VoiceSession" }]
          nullable: true
          description: null khi chưa cấu hình OPENAI_API_KEY (chỉ ngoài prod)
    InterviewStats:
      type: object
      properties:
        interviewsInProgress: { type: integer }
        interviewsPendingReview: { type: integer }
        mentorsApproved: { type: integer }
        mentorsRejected: { type: integer }
        retakesRequested: { type: integer }
        decisionsTotal: { type: integer, description: "US-24: số buổi admin đã quyết định (APPROVED/REJECTED/RETAKE_REQUESTED)" }
        decisionsComparable: { type: integer, description: Trong đó AI khuyến nghị APPROVE hoặc REJECT }
        decisionsAgreeing: { type: integer, description: "APPROVE↔APPROVE hoặc REJECT↔REJECT (REQUEST_RETAKE = không đồng thuận)" }
        decisionsOnNeedsReview: { type: integer, description: AI khuyến nghị NEEDS_REVIEW / không có — không tính vào tỉ lệ }
        agreementRate: { type: number, nullable: true, description: "decisionsAgreeing / decisionsComparable (0..1); mục tiêu ≥ 0.8" }
    ParsedCv:
      type: object
      properties:
        currentRole: { type: string, nullable: true }
        skills: { type: array, items: { type: string } }
        yearsExperience: { type: integer, nullable: true }
        projects:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              technologies: { type: array, items: { type: string } }
        education: { type: array, items: { type: string } }
        summary: { type: string, nullable: true }
    Cv:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        engine: { type: string }
        parsed: { $ref: "#/components/schemas/ParsedCv" }
        consentExternalAi:
          type: boolean
          description: >-
            US-19 — người dùng đồng ý gửi CV này tới AI bên ngoài (DeepSeek). false => parse và mọi lượt chatbot
            enrichment của CV này chỉ dùng engine RULE_BASED. CV tải lên trước Sprint 2 = false.
        confirmedFields:
          allOf: [{ $ref: "#/components/schemas/ConfirmedFields" }]
          nullable: true
          description: US-20 — null = người dùng chưa duyệt kết quả parse (chatbot chưa bắt đầu)
        confirmedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ConfirmedFields:
      type: object
      description: >-
        US-20 — thông tin CV sau khi người dùng xem lại, sửa hoặc bỏ từng mục. Chatbot dùng các trường này làm
        ngữ cảnh (không dùng `parsed`), và chỉ `skills` ở đây được gửi sang hồ sơ khi người dùng xác nhận mục
        tiêu. Chuỗi được cắt khoảng trắng; phần tử rỗng bị bỏ; skills/technologies/education bỏ trùng không
        phân biệt hoa thường. Sai ràng buộc => 400 VALIDATION_ERROR.
      properties:
        role: { type: string, nullable: true, maxLength: 120, description: "Chuỗi rỗng => null" }
        skills: { type: array, maxItems: 30, items: { type: string, maxLength: 60 } }
        yearsExperience: { type: integer, nullable: true, minimum: 0, maximum: 45 }
        projects:
          type: array
          maxItems: 8
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 400 }
              technologies: { type: array, maxItems: 15, items: { type: string, maxLength: 60 } }
        education: { type: array, maxItems: 6, items: { type: string, maxLength: 200 } }
    CvSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        uploadedAt: { type: string, format: date-time }
        fileUrl: { type: string, description: "Đường dẫn tải file, dạng /api/ai/cv/{id}/file" }
        consentExternalAi: { type: boolean }
        purgedAt: { type: string, format: date-time, nullable: true, description: "US-45 (PRD-CV-6) — file + văn bản gốc đã bị xoá theo chính sách lưu giữ 12 tháng" }
        deleteAfter: { type: string, format: date-time, description: "US-45 — uploadedAt + 365 ngày" }
        addedSkills: { type: array, items: { type: string }, description: "US-45 — kỹ năng đã thêm vào hồ sơ từ CV này" }
    EnrichmentMessage:
      type: object
      properties:
        turnNo: { type: integer }
        slot: { type: string, enum: [TARGET_ROLE, FOCUS_AREAS, PROJECT_EXPERIENCE, CURRENT_GAPS, TIMELINE, MENTORING_PREFERENCE, FREE_FORM] }
        slotLabel: { type: string }
        question: { type: string }
        answer: { type: string, nullable: true, description: "Chuỗi rỗng khi skipped" }
        skipped: { type: boolean, description: "US-45 (PRD-CV-3) — mentee bấm “Bỏ qua”" }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        menteeId: { type: string, format: uuid }
        cvId: { type: string, format: uuid }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        engine: { type: string }
        maxTurns: { type: integer }
        currentTurn: { type: integer }
        currentQuestion: { $ref: "#/components/schemas/EnrichmentMessage" }
        messages: { type: array, items: { $ref: "#/components/schemas/EnrichmentMessage" } }
        enrichedGoal: { type: string, nullable: true, description: "Goal NHÁP do chatbot tổng hợp khi hội thoại xong (không tự ghi vào hồ sơ)" }
        goalStatus:
          type: string
          enum: [NONE, DRAFT, CONFIRMED, DISCARDED]
          description: >-
            US-21 — NONE: hội thoại chưa xong; DRAFT: chờ người dùng "Dùng mục tiêu này" / "Bỏ qua";
            CONFIRMED: confirmedGoal được đồng bộ sang hồ sơ (profileSynced theo dõi việc gửi, lỗi thì job
            thử lại); DISCARDED: không gửi gì.
        confirmedGoal: { type: string, nullable: true, description: Goal người dùng đã chọn dùng (có thể đã sửa) }
        goalDecidedAt: { type: string, format: date-time, nullable: true }
        profileSynced: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        suggestedSkills: { type: array, items: { type: string }, description: "US-45 (PRD-CV-5) — kỹ năng đã duyệt từ CV, hiển thị dạng chip để chọn" }
        addedSkills: { type: array, items: { type: string }, description: "US-45 — kỹ năng mentee đã chọn thêm vào hồ sơ khi xác nhận mục tiêu" }
    CvUploadResult:
      type: object
      properties:
        cv: { $ref: "#/components/schemas/Cv" }
        conversation:
          allOf: [{ $ref: "#/components/schemas/Conversation" }]
          nullable: true
          description: US-20 — null cho tới khi người dùng duyệt thông tin CV và bắt đầu chatbot
    CvUploadForm:
      type: object
      required: [file, consentExternalAi]
      properties:
        file: { type: string, format: binary }
        consentExternalAi:
          type: boolean
          description: >-
            US-19 (bắt buộc; "true"/"false") — đồng ý gửi CV tới DeepSeek khi engine AI bật. Thiếu => 400
            CONSENT_REQUIRED, không lưu gì. false => chỉ engine RULE_BASED cho CV này (parse + mọi lượt chatbot),
            kiểm tra lại ở mỗi lượt; không request nào tới DeepSeek.
    GoalInput:
      type: object
      required: [goal]
      properties:
        goal: { type: string, minLength: 10, maxLength: 3000, description: "Cắt khoảng trắng hai đầu trước khi kiểm tra độ dài" }
        skills:
          type: array
          nullable: true
          maxItems: 30
          items: { type: string }
          description: >-
            US-45 (PRD-CV-5) — kỹ năng gợi ý (suggestedSkills) mentee chọn thêm vào hồ sơ; không phân biệt hoa thường,
            ngoài danh sách gợi ý => 400 INVALID_SKILLS. null/không gửi = mọi kỹ năng gợi ý; [] = không thêm kỹ năng nào.
    EnrichmentAnswerInput:
      type: object
      properties:
        answer: { type: string, maxLength: 5000, description: "Bắt buộc (không rỗng) trừ khi skipped = true — 400 ANSWER_REQUIRED" }
        skipped: { type: boolean, default: false, description: "US-45 (PRD-CV-3) — “Bỏ qua”: câu được lưu answer rỗng, skipped = true; vẫn sinh goal khi hết câu" }
security:
  - bearerAuth: []
paths:
  /metrics:
    get:
      summary: US-46 (NFR-17) — số liệu Prometheus (text/plain; version=0.0.4), không cần xác thực
      description: >-
        http_requests_total, http_request_duration_seconds (method, route, status). Mọi response của service có header X-Request-Id (nhận từ request nếu hợp lệ [A-Za-z0-9._:-]{1,64}, ngược
        lại sinh UUID); id được ghi trong mọi dòng log JSON ("requestId") và chuyển tiếp sang các service được gọi.
      security: []
      responses:
        "200": { description: OK }
  /health:
    get:
      security: []
      summary: Health check (kèm trạng thái CSDL và engine LLM)
      responses:
        "200": { description: "{ status, service, dbConnected, llmEnabled, llmProvider, model }" }

  # ---------------- AI Interview (FR-7.x) ----------------
  /api/ai/interviews/eligibility:
    get:
      summary: US-22 (MENTOR) Số lần phỏng vấn đã dùng / còn lại, thời gian chờ, bị khoá
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewEligibility" }
  /api/ai/interviews/me:
    get:
      summary: (MENTOR) Buổi phỏng vấn gần nhất của tôi
      responses:
        "200": { description: Interview }
        "204": { description: Chưa có buổi phỏng vấn nào }
  /api/ai/interviews/{id}:
    get:
      summary: Chi tiết buổi phỏng vấn (chủ buổi hoặc admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Interview }
        "404": { description: INTERVIEW_NOT_FOUND }
  /api/ai/interviews/voice:
    post:
      summary: >
        FR-7.7 (MENTOR) Bắt đầu AI Interview bằng giọng nói — cách duy nhất (luồng chat đã bỏ). Điều kiện: số lần, chờ 7 ngày,
        khoá, chờ duyệt. Tạo buổi IN_PROGRESS mode VOICE (maxTurns = số chủ đề, VOICE_INTERVIEW_TOPICS)
        và trả client secret. Gọi lại khi đang có buổi giọng nói chưa quá 30 phút => cùng buổi, client secret mới (kết nối lại).
        Quá 30 phút chưa gửi bản ghi => ABANDONED (tính là 1 lần).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selfAnswerAcknowledged, consentExternalAi]
              properties:
                selfAnswerAcknowledged: { type: boolean, description: Phải là true }
                consentExternalAi: { type: boolean, description: "Phải là true — âm thanh được OpenAI (Mỹ) xử lý" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceInterviewStart" }
        "400": { description: VOICE_CONSENT_REQUIRED | SELF_ANSWER_ACK_REQUIRED | PROFILE_REQUIRED }
        "409":
          description: >
            INTERVIEW_PENDING_REVIEW | ALREADY_APPROVED | INTERVIEW_LOCKED (bị từ chối 3 lần, chờ admin mở khoá) |
            INTERVIEW_COOLDOWN — có thêm `retryAfter` (date-time)
        "502": { description: VOICE_UNAVAILABLE — OpenAI lỗi / từ chối tạo phiên (không tạo buổi) }
        "503": { description: "VOICE_UNAVAILABLE — APP_ENV=prod và chưa có OPENAI_API_KEY (không tạo buổi)" }
  /api/ai/interviews/{id}/voice-transcript:
    post:
      summary: >
        FR-7.7 (MENTOR, chủ buổi) Gửi bản ghi buổi giọng nói đang IN_PROGRESS: mỗi chủ đề đã hỏi thành một lượt
        (question = lời người phỏng vấn nối " / ", answer = lời mentor; không trả lời => "(Mentor không trả lời câu hỏi này.)"),
        chấm bằng engine + rubric, rồi PENDING_REVIEW, đồng bộ PENDING_REVIEW sang
        profile-service, thông báo admin + mentor. Điểm từng câu ẩn với mentor tới khi admin quyết định.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscriptInput" }
      responses:
        "200": { description: Interview (PENDING_REVIEW) }
        "400": { description: EMPTY_TRANSCRIPT | VALIDATION_ERROR }
        "403": { description: FORBIDDEN — không phải buổi của mentor }
        "404": { description: INTERVIEW_NOT_FOUND }
        "409": { description: INTERVIEW_NOT_VOICE | INTERVIEW_ABANDONED | INTERVIEW_NOT_IN_PROGRESS (đã gửi rồi) }

  # ---------------- Luyện phỏng vấn với AI — mentee (FR-10.x) ----------------
  /api/ai/practice-interviews/eligibility:
    get:
      summary: (MENTEE) Lượt luyện miễn phí đã dùng / còn, buổi đang dở
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeEligibility" }
  /api/ai/practice-interviews:
    post:
      summary: >
        (MENTEE) Bắt đầu buổi luyện phỏng vấn giọng nói với AI (vai nhà tuyển dụng cho vị trí / cấp độ mentee nhắm tới).
        PRACTICE_FREE_LIMIT (1) buổi miễn phí trọn đời — COMPLETED hoặc ABANDONED là đã dùng. Đang có buổi IN_PROGRESS
        chưa quá 30 phút => trả lại buổi đó (giữ intake cũ) với client secret mới; quá 30 phút => ABANDONED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interviewType, level, targetRole, consentExternalAi]
              properties:
                interviewType: { type: string, enum: [BACKEND, FRONTEND, SYSTEM_DESIGN, BEHAVIORAL] }
                level: { type: string, enum: [INTERN, FRESHER, JUNIOR] }
                targetRole: { type: string, minLength: 2, maxLength: 120, description: Đã trim }
                targetCompany: { type: string, maxLength: 120, nullable: true, description: Đã trim; rỗng => null }
                consentExternalAi: { type: boolean, description: Phải là true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeStart" }
        "400": { description: VOICE_CONSENT_REQUIRED | VALIDATION_ERROR }
        "403": { description: FORBIDDEN — không phải MENTEE }
        "409":
          description: >
            PRACTICE_FREE_USED — đã dùng lượt miễn phí; kèm CTA đặt phỏng vấn thử với mentor (US-58), vd.
            {"error":{"code":"PRACTICE_FREE_USED","message":"...","ctaLabel":"Đặt phỏng vấn thử với mentor","ctaHref":"/matching"}}
        "502": { description: VOICE_UNAVAILABLE — OpenAI lỗi (không tạo buổi, không tính lượt) }
        "503": { description: "VOICE_UNAVAILABLE — APP_ENV=prod và chưa có OPENAI_API_KEY (không tạo buổi)" }
  /api/ai/practice-interviews/me:
    get:
      summary: (MENTEE) Lịch sử luyện phỏng vấn, mới nhất trước
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Practice" } }
  /api/ai/practice-interviews/{id}:
    get:
      summary: Chi tiết một buổi luyện (chủ buổi hoặc admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Practice" }
        "403": { description: FORBIDDEN }
        "404": { description: PRACTICE_NOT_FOUND }
  /api/ai/practice-interviews/{id}/complete:
    post:
      summary: >
        (MENTEE, chủ buổi) Gửi bản ghi buổi luyện IN_PROGRESS → chấm (DeepSeek prompt practice-v1 khi có DEEPSEEK_API_KEY,
        ngược lại / khi lỗi rule-based) → COMPLETED, kết quả hiện ngay. Câu trả lời chứa mệnh lệnh cho người chấm không
        được gửi tới LLM, chấm rule-based và gắn cờ PROMPT_INJECTION.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscriptInput" }
      responses:
        "200":
          description: Practice (COMPLETED, có result)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Practice" }
        "400": { description: EMPTY_TRANSCRIPT | VALIDATION_ERROR }
        "403": { description: FORBIDDEN }
        "404": { description: PRACTICE_NOT_FOUND }
        "409": { description: PRACTICE_NOT_IN_PROGRESS (đã nộp hoặc đã bị huỷ do quá 30 phút) }
  /api/ai/admin/interviews:
    get:
      summary: (ADMIN) Danh sách buổi phỏng vấn
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [IN_PROGRESS, PENDING_REVIEW, APPROVED, REJECTED, RETAKE_REQUESTED, ABANDONED] } }
      responses:
        "200": { description: "Interview[]" }
  /api/ai/admin/interviews/{id}/review:
    post:
      summary: >
        FR-7.5 / US-23 (ADMIN) Quyết định cuối cùng; đồng bộ trạng thái xác thực sang profile-service
        (APPROVE → APPROVED, REJECT → REJECTED, REQUEST_RETAKE → PENDING_INTERVIEW) và ghi audit log
        INTERVIEW_APPROVED | INTERVIEW_REJECTED | INTERVIEW_RETAKE_REQUESTED (targetType INTERVIEW).
        REQUEST_RETAKE: buổi chuyển RETAKE_REQUESTED, không tính vào số lần, mentor bắt đầu lại được ngay.
        Bắt buộc note ≥ 10 ký tự khi quyết định ngược khuyến nghị AI: APPROVE khi AI = REJECT, REJECT khi AI = APPROVE,
        REQUEST_RETAKE khi AI = APPROVE/REJECT. AI = NEEDS_REVIEW (hoặc buổi cũ không có khuyến nghị) => không bắt buộc.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT, REQUEST_RETAKE] }
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Interview }
        "400": { description: REVIEW_NOTE_REQUIRED | VALIDATION_ERROR }
        "409": { description: INTERVIEW_NOT_PENDING_REVIEW }
  /api/ai/admin/interviews/mentors/{mentorId}/eligibility:
    get:
      summary: US-22 (ADMIN) Quy tắc số lần phỏng vấn của một mentor
      parameters: [{ name: mentorId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewEligibility" }
  /api/ai/admin/interviews/mentors/{mentorId}/unlock:
    post:
      summary: >
        US-22 (ADMIN) Mở khoá mentor bị từ chối đủ số lần tối đa: số lần đã dùng tính lại từ 0, không còn thời gian chờ.
        Ghi audit log INTERVIEW_ATTEMPTS_UNLOCKED (targetType MENTOR).
      parameters: [{ name: mentorId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Quy tắc sau khi mở khoá
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewEligibility" }
        "409": { description: INTERVIEW_NOT_LOCKED }
  /api/ai/admin/stats:
    get:
      summary: (ADMIN) Thống kê AI Interview cho bảng điều khiển quản trị
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewStats" }

  # ---------------- CV + Chatbot enrichment (FR-8.x) ----------------
  /api/ai/mentee/{id}/cv-upload:
    post:
      summary: >
        FR-8.1 + FR-8.2 (MENTEE) Upload CV PDF (≤ 5MB, có lớp text) → parse có cấu trúc. Yêu cầu đã có hồ sơ
        mentee. Sprint 2 (US-20): KHÔNG mở hội thoại và KHÔNG ghi gì vào hồ sơ — trả `conversation: null`;
        người dùng duyệt thông tin (PUT /api/ai/cv/{id}/confirmed-fields) rồi mới bắt đầu chatbot
        (POST /api/ai/cv/{id}/enrichment-conversation).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CvUploadForm" }
      responses:
        "200":
          description: CV đã parse + hội thoại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvUploadResult" }
        "400": { description: CONSENT_REQUIRED | VALIDATION_ERROR | PROFILE_REQUIRED | FILE_REQUIRED | INVALID_FILE_TYPE | CV_NO_TEXT }
        "413": { description: FILE_TOO_LARGE }
        "429": { description: "RATE_LIMITED — US-46 (NFR-10) quá 5 CV / giờ / người dùng (cv-upload + cv/parse cộng chung; form thiếu consent không bị đếm); header Retry-After (giây)" }
  /api/ai/mentee/{id}/enrichment/latest:
    get:
      summary: CV mới nhất của mentee + hội thoại của CV đó (`conversation` null nếu chưa duyệt / chưa bắt đầu)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: CvUploadResult }
        "204": { description: Chưa tải CV lần nào }
  /api/ai/enrichment/conversations/{id}:
    get:
      summary: Chi tiết hội thoại (chủ hội thoại hoặc admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Conversation }
        "404": { description: CONVERSATION_NOT_FOUND }
  /api/ai/enrichment/conversations/{id}/answers:
    post:
      summary: >
        FR-8.3 → FR-8.4 (MENTEE) Trả lời câu hỏi chatbot. Sau lượt cuối, goal được tổng hợp thành BẢN NHÁP
        (goalStatus = DRAFT) — Sprint 2 (US-21): KHÔNG còn tự đẩy sang profile-service; xem confirm-goal.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichmentAnswerInput" }
      responses:
        "200": { description: Conversation sau lượt trả lời }
        "409": { description: CONVERSATION_COMPLETED | NO_OPEN_QUESTION | ALREADY_ANSWERED }
  /api/ai/enrichment/conversations/{id}/confirm-goal:
    post:
      summary: >
        US-21 / FR-8.5 (MENTEE, chủ hội thoại) "Dùng mục tiêu này": goal (bản nháp hoặc bản người dùng sửa) được
        lưu vào confirmedGoal rồi gửi sang profile-service POST /api/profile/mentee/{id}/enrichment-chat
        {enrichedGoalText = confirmedGoal, cvSkills = chỉ confirmedFields.skills của CV (chưa duyệt => []),
        cvFileUrl}; profile-service lỗi => profileSynced = false và job nền thử lại. Idempotent: goal đã
        CONFIRMED thì trả 200 với trạng thái hiện tại, không gửi lại (kể cả khi body khác).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalInput" }
      responses:
        "200": { description: Conversation (goalStatus = CONFIRMED) }
        "400": { description: VALIDATION_ERROR — goal thiếu, < 10 hoặc > 3000 ký tự }
        "403": { description: FORBIDDEN — không phải chủ hội thoại }
        "404": { description: CONVERSATION_NOT_FOUND }
        "409": { description: CONVERSATION_NOT_COMPLETED | GOAL_DISCARDED }
  /api/ai/enrichment/conversations/{id}/discard-goal:
    post:
      summary: >
        US-21 (MENTEE, chủ hội thoại) "Bỏ qua": bỏ bản nháp, hồ sơ không đổi. Gọi lại khi đã bỏ: 200.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Conversation (goalStatus = DISCARDED) }
        "403": { description: FORBIDDEN — không phải chủ hội thoại }
        "404": { description: CONVERSATION_NOT_FOUND }
        "409": { description: CONVERSATION_NOT_COMPLETED | GOAL_ALREADY_CONFIRMED }
  /api/ai/cv/parse:
    post:
      summary: FR-8.2 Parse CV không kèm chatbot — mentor dùng để điền nhanh hồ sơ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CvUploadForm" }
      responses:
        "200":
          description: CV đã parse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cv" }
        "400": { description: CONSENT_REQUIRED | VALIDATION_ERROR | INVALID_FILE_TYPE | CV_NO_TEXT }
        "413": { description: FILE_TOO_LARGE }
        "429": { description: "RATE_LIMITED — US-46 (NFR-10) quá 5 CV / giờ / người dùng; header Retry-After (giây)" }
  /api/ai/cv/{id}/confirmed-fields:
    put:
      summary: >
        US-20 (PRD-CV-2) Lưu thông tin CV người dùng đã xem lại/sửa/bỏ (chỉ chủ CV — ADMIN và mentor cũng 403).
        Gọi lại được nhiều lần (ghi đè). Không ghi gì vào hồ sơ.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmedFields" }
      responses:
        "200":
          description: CV kèm confirmedFields đã chuẩn hoá
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cv" }
        "400": { description: VALIDATION_ERROR }
        "403": { description: FORBIDDEN — không phải chủ CV }
        "404": { description: CV_NOT_FOUND }
  /api/ai/cv/{id}/enrichment-conversation:
    post:
      summary: >
        US-20 / FR-8.3 (MENTEE, chủ CV) Bắt đầu chatbot enrichment cho CV đã duyệt; câu hỏi dựa trên
        confirmedFields, engine theo consentExternalAi của CV. Mỗi CV tối đa một hội thoại: gọi lại trả về
        hội thoại đã có (200).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: CV + hội thoại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvUploadResult" }
        "400": { description: PROFILE_REQUIRED }
        "403": { description: FORBIDDEN — không phải chủ CV }
        "404": { description: CV_NOT_FOUND }
        "409": { description: CV_NOT_REVIEWED — chưa PUT confirmed-fields }
  /api/ai/cv/mine:
    get:
      summary: Danh sách CV của chính người gọi (mới nhất trước) — để giao diện cho phép xoá
      responses:
        "200":
          description: OK (mảng rỗng nếu chưa có CV)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CvSummary" }
  /api/ai/cv/{id}:
    delete:
      summary: Xoá CV (chủ CV hoặc ADMIN) — xoá hội thoại enrichment liên quan, dòng cv_documents rồi file
      description: >-
        Hội thoại enrichment (kèm tin nhắn, ON DELETE CASCADE) và dòng cv_documents bị xoá trong một
        transaction; sau đó xoá file trên đĩa (file đã mất thì bỏ qua). Nếu hồ sơ của chủ CV đang trỏ tới
        file này (cvFileUrl), ai-service gỡ tham chiếu qua DELETE /internal/profile/{userId}/cv-file của
        profile-service — best-effort, lỗi chỉ ghi log. US-45 (PRD-CV-6): removeSkills=true gỡ thêm các kỹ năng đã
        thêm vào hồ sơ từ CV này (addedSkills) qua POST /internal/mentee/{menteeId}/skills/remove — best-effort.
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: removeSkills, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Đã xoá }
        "403": { description: FORBIDDEN — không phải chủ CV và không phải ADMIN (kể cả mentor) }
        "404": { description: CV_NOT_FOUND }
  /api/ai/cv/{id}/file:
    get:
      summary: Tải file CV gốc (chủ CV, admin; mentor chỉ khi mentee có yêu cầu mentoring PENDING/ACCEPTED với mình)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: PDF
          content:
            application/pdf: {}
        "403": { description: "FORBIDDEN — không phải chủ CV/admin, hoặc mentor không có yêu cầu mentoring đang mở với mentee (kể cả khi mentoring-service không phản hồi)" }
        "404": { description: CV_NOT_FOUND | CV_FILE_NOT_FOUND }
        "410": { description: "CV_PURGED — US-45: file đã bị xoá sau 12 tháng (job chạy mỗi 6 giờ; kết quả parse chỉ giữ nếu đã được người dùng xác nhận)" }
