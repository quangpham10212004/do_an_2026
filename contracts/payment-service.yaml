openapi: 3.0.3
info:
  title: payment-service
  version: 1.0.0
  description: >
    Thanh toán phiên mentoring và gói buổi qua cổng sandbox (hỗ trợ hoàn tiền một phần) + Referral/Affiliate. Sở hữu bởi Thắng.
    Thẻ test: 4242 4242 4242 4242 (thành công), 4000 0000 0000 0002 (CARD_DECLINED),
    4000 0000 0000 9995 (INSUFFICIENT_FUNDS).
servers:
  - url: http://localhost:8084
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  schemas:
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true, description: Giao dịch thanh toán 1 phiên lẻ (chính xác một trong sessionId/packageId) }
        packageId: { type: string, format: uuid, nullable: true, description: Giao dịch thanh toán 1 gói buổi }
        payerId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        amount: { type: number }
        refundedAmount: { type: number, description: Tổng số tiền đã hoàn (hoàn một phần khi gói còn buổi chưa dùng) }
        currency: { type: string, example: VND }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, PARTIALLY_REFUNDED, REFUNDED]
          description: PARTIALLY_REFUNDED = đã thu và đã hoàn một phần; vẫn tính là đã thanh toán
        provider: { type: string, example: SANDBOX }
        providerReference: { type: string, nullable: true }
        failureReason: { type: string, nullable: true, example: CARD_DECLINED }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Referral:
      type: object
      properties:
        id: { type: string, format: uuid }
        referrerId: { type: string, format: uuid }
        refereeId: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, QUALIFIED, REJECTED] }
        rejectReason: { type: string, nullable: true, enum: [REFERRER_IS_SESSION_MENTOR, DAILY_LIMIT_EXCEEDED] }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: string, format: date-time, nullable: true }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }

  /api/payment/charge:
    post:
      summary: >
        FR-6.1 → FR-6.3 Thanh toán 1 phiên PENDING hoặc 1 gói buổi PENDING_PAYMENT (MENTEE chủ phiên/gói) — chọn đúng một
        trong sessionId / packageId. Số tiền lấy từ mentoring-service; nếu client gửi amount khác giá → AMOUNT_MISMATCH.
        SUCCESS → xử lý referral + báo mentoring-service xác nhận phiên / kích hoạt gói (FR-6.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card]
              properties:
                sessionId: { type: string, format: uuid, description: Thanh toán 1 phiên lẻ }
                packageId: { type: string, format: uuid, description: Thanh toán 1 gói buổi (loại trừ với sessionId) }
                amount: { type: number, description: Tuỳ chọn, dùng để đối chiếu }
                card:
                  type: object
                  required: [cardNumber, expiry, cvv]
                  properties:
                    cardNumber: { type: string }
                    cardHolder: { type: string }
                    expiry: { type: string, example: "12/28" }
                    cvv: { type: string }
      responses:
        "200":
          description: Kết quả giao dịch (SUCCESS hoặc FAILED kèm failureReason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: INVALID_TARGET / AMOUNT_MISMATCH / FREE_SESSION / FREE_PACKAGE }
        "403": { description: Không phải mentee của phiên / gói }
        "409": { description: ALREADY_PAID / SESSION_NOT_PAYABLE / PACKAGE_NOT_PAYABLE }

  /api/payment/transactions:
    get:
      summary: FR-6.3 Giao dịch của tôi (mentee = đã trả, mentor = đã nhận)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
  /api/payment/transactions/{id}:
    get:
      summary: Chi tiết giao dịch (người trả / mentor / admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /api/payment/sessions/{sessionId}/transactions:
    get:
      summary: Lịch sử giao dịch của 1 phiên
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }

  /api/payment/packages/{packageId}/transactions:
    get:
      summary: Lịch sử giao dịch của 1 gói buổi
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }

  /api/payment/referrals/me:
    get:
      summary: FR-6.4 → FR-6.6 Mã giới thiệu (tạo lần đầu), danh sách người đã giới thiệu, số dư điểm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: K7QM2ZPA }
                  shareUrl: { type: string }
                  totalReferrals: { type: integer }
                  qualifiedReferrals: { type: integer }
                  pointsBalance: { type: integer }
                  rewardPointsPerReferral: { type: integer }
                  minQualifyingAmount: { type: number }
                  referrals: { type: array, items: { $ref: "#/components/schemas/Referral" } }
                  rewards:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        points: { type: integer }
                        reason: { type: string }
                        createdAt: { type: string, format: date-time }

  /api/payment/admin/transactions:
    get:
      summary: (ADMIN) Giám sát giao dịch
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SUCCESS, FAILED, PARTIALLY_REFUNDED, REFUNDED] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: "{ items: Transaction[], page, size, totalItems, totalPages }" }
  /api/payment/admin/stats:
    get:
      summary: (ADMIN) Thống kê giao dịch — successCount gồm cả PARTIALLY_REFUNDED; totalRevenue là doanh thu ròng (đã thu trừ đã hoàn)
      responses:
        "200": { description: "{ successCount, failedCount, refundedCount, totalRevenue }" }
  /api/payment/admin/referrals:
    get:
      summary: (ADMIN) Giám sát referral
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Referral" } }

  /internal/referrals:
    post:
      summary: Nội bộ — auth-service ghi nhận người dùng mới đăng ký bằng mã giới thiệu (FR-6.5)
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, refereeId]
              properties:
                code: { type: string }
                refereeId: { type: string, format: uuid }
      responses:
        "201":
          description: Đã ghi nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }
        "400": { description: SELF_REFERRAL }
        "404": { description: REFERRAL_CODE_NOT_FOUND }
        "409": { description: ALREADY_REFERRED }
  /internal/payments/refund:
    post:
      summary: >
        Nội bộ — mentoring-service yêu cầu hoàn tiền: toàn bộ khi phiên lẻ đã thanh toán bị huỷ (sessionId), hoặc các buổi chưa
        dùng khi gói hết hạn/bị huỷ (packageId + refundedTotal). Chọn đúng một trong sessionId / packageId.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, format: uuid }
                packageId: { type: string, format: uuid }
                refundedTotal:
                  type: number
                  description: >
                    Chỉ với packageId: TỔNG số tiền đã hoàn tính luỹ kế mong muốn. Idempotent: chỉ hoàn phần chênh so với số đã hoàn,
                    nên gọi lại cùng giá trị (thử lại sau lỗi mạng) không hoàn trùng. Bỏ trống = hoàn hết phần còn lại.
                reason: { type: string }
      responses:
        "200":
          description: Giao dịch sau khi hoàn (REFUNDED, hoặc PARTIALLY_REFUNDED với gói)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: INVALID_TARGET / INVALID_REFUND_AMOUNT }
        "404": { description: NO_SUCCESS_TRANSACTION }
        "502": { description: REFUND_FAILED (cổng thanh toán từ chối) }
