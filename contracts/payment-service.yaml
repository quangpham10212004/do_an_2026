openapi: 3.0.3
info:
  title: payment-service
  version: 1.0.0
  description: >
    Thanh toán phiên mentoring qua cổng sandbox + Referral/Affiliate + sổ thu nhập mentor (US-25). Sở hữu bởi Thắng.
    Mọi biến động tiền (charge, refund, hold, release, earning pending/available/reversal) được ghi nhật ký kiểm toán qua
    auth-service POST /internal/audit (bắn-rồi-quên, US-30).
    Thẻ test: 4242 4242 4242 4242 (thành công), 4000 0000 0000 0002 (CARD_DECLINED),
    4000 0000 0000 9995 (INSUFFICIENT_FUNDS).
servers:
  - url: http://localhost:8084
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  schemas:
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        amount: { type: number, description: "Giá phiên (VND) mentee trả" }
        fee: { type: number, example: 45000, description: "US-13 — phí nền tảng = round(amount × feeRate), chốt lúc charge" }
        mentorEarning: { type: number, example: 255000, description: "US-13 — amount − fee, chốt lúc charge (đổi cấu hình phí về sau không đổi giá trị này)" }
        feeRate: { type: number, example: 0.15, description: "US-13 — tỉ lệ phí áp dụng (app.payment.platform-fee-rate lúc charge)" }
        refundedAmount: { type: number, description: "US-13 — tổng các lần hoàn (bảng refunds); ≤ amount" }
        currency: { type: string, example: VND }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED, PARTIALLY_REFUNDED, ON_HOLD]
          description: >
            PENDING → SUCCESS | FAILED; SUCCESS → PARTIALLY_REFUNDED → REFUNDED; SUCCESS → REFUNDED;
            SUCCESS → ON_HOLD → SUCCESS (US-12: phiên DISPUTED — chưa trả mentor, chưa hoàn mentee).
        provider: { type: string, example: SANDBOX }
        providerReference: { type: string, nullable: true }
        failureReason: { type: string, nullable: true, example: CARD_DECLINED, description: "Chỉ lý do charge thất bại (hoàn tiền không còn ghi đè trường này)" }
        holdReason: { type: string, nullable: true, example: SESSION_DISPUTED }
        kind: { type: string, enum: [SESSION, TOPUP], description: "Bản chốt v2.0 — SESSION = trả học phí; TOPUP = nạp ví qua cổng" }
        paidPromo: { type: number, description: "Phần học phí lấy từ tiền khuyến mãi (provider = WALLET)" }
        paidCash: { type: number, description: "Phần học phí lấy từ tiền nạp (provider = WALLET)" }
        refunds: { type: array, items: { $ref: "#/components/schemas/Refund" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Wallet:
      type: object
      description: "Bản chốt v2.0 §8 — ví VND. cash = tiền nạp khả dụng; promo = khuyến mãi còn hạn; held = học phí đang tạm giữ."
      properties:
        status: { type: string, enum: [ACTIVE, DORMANT, FROZEN] }
        cash: { type: number }
        promo: { type: number }
        held: { type: number }
        nextPromoExpiry: { type: string, format: date-time, nullable: true }
        topupMin: { type: number, example: 50000 }
        topupMax: { type: number, example: 5000000 }
        cashCap: { type: number, example: 20000000 }
        refund: { $ref: "#/components/schemas/RefundEligibility" }
    RefundEligibility:
      type: object
      properties:
        windowOpen: { type: boolean }
        windowEndsAt: { type: string, format: date-time, nullable: true }
        maxAmount: { type: number, description: "min(tiền nạp khả dụng, tiền nạp còn hoàn được trong 7 ngày)" }
        remainingRequests: { type: integer }
    WalletEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [TOPUP, HOLD, REFUND_TO_WALLET, TOPUP_REFUND, PROMO_GRANT, PROMO_EXPIRE, ADJUST] }
        bucket: { type: string, enum: [CASH, PROMO] }
        amount: { type: number, description: "Có dấu: + cộng vào khả dụng, − trừ" }
        sessionId: { type: string, format: uuid, nullable: true }
        transactionId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    TopupRefundRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [PENDING, DONE, REJECTED] }
        kind: { type: string, enum: [AUTO, EXCEPTION] }
        userReason: { type: string, nullable: true }
        adminReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    Refund:
      type: object
      description: US-13 — một lần hoàn tiền (bảng refunds); SUM(amount) ≤ Transaction.amount
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        reason: { type: string, nullable: true }
        actorId: { type: string, format: uuid, nullable: true, description: "null = hệ thống / service nội bộ" }
        createdAt: { type: string, format: date-time }
    EarningSummary:
      type: object
      description: >
        US-25 — tổng thu nhập của mentor (VND) tính từ sổ mentor_ledger (append-only). pending = chưa giải phóng
        (phiên chưa xong / chưa đủ 48 giờ / đang tranh chấp); available = đã giải phóng chưa chi trả; paidOut = đã chi trả;
        reversed = đã thu hồi do hoàn tiền; earned = tổng EARNING_PENDING.
      properties:
        pending: { type: number, example: 255000 }
        available: { type: number, example: 127500 }
        paidOut: { type: number, example: 0 }
        reversed: { type: number, example: 127500 }
        earned: { type: number, example: 510000 }
        currency: { type: string, example: VND }
        releaseDelayHours: { type: integer, example: 48, description: "app.earnings.release-delay" }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [EARNING_PENDING, EARNING_AVAILABLE, REVERSAL, PAYOUT] }
        amount: { type: number, description: "Luôn dương; kiểu dòng quyết định chiều" }
        refundId: { type: string, format: uuid, nullable: true, description: "REVERSAL — lần hoàn gây ra" }
        createdAt: { type: string, format: date-time }
    EarningRow:
      type: object
      description: US-25 — thu nhập của 1 phiên có phí (giao dịch đã thu tiền)
      properties:
        sessionId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        amount: { type: number }
        mentorEarning: { type: number }
        transactionStatus: { type: string, enum: [SUCCESS, ON_HOLD, PARTIALLY_REFUNDED, REFUNDED] }
        pending: { type: number }
        available: { type: number }
        paidOut: { type: number }
        reversed: { type: number }
        finalState: { type: string, nullable: true, example: COMPLETED, description: "Trạng thái cuối mentoring báo (null = phiên chưa kết thúc)" }
        endedAt: { type: string, format: date-time, nullable: true }
        releaseAt: { type: string, format: date-time, nullable: true, description: "endedAt + 48h (hoặc lúc giải quyết tranh chấp)" }
        releasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
    Referral:
      type: object
      properties:
        id: { type: string, format: uuid }
        referrerId: { type: string, format: uuid }
        refereeId: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, QUALIFIED, REJECTED] }
        rejectReason: { type: string, nullable: true, enum: [REFERRER_IS_SESSION_MENTOR, DAILY_LIMIT_EXCEEDED] }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: string, format: date-time, nullable: true }
    Payout:
      type: object
      description: US-42 (PRD-PAY-5) — yêu cầu rút tiền REQUESTED → PAID | REJECTED
      properties:
        id: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        mentorName: { type: string, nullable: true, description: Chỉ ở API admin }
        amount: { type: number }
        status: { type: string, enum: [REQUESTED, PAID, REJECTED] }
        bankName: { type: string }
        accountNumberMasked: { type: string, example: "••••5678" }
        accountNumber: { type: string, nullable: true, description: Chỉ admin (để chuyển khoản); mentor nhận null }
        holderName: { type: string }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true, description: Ghi chú khi PAID / lý do khi REJECTED }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    BankAccount:
      type: object
      properties:
        bankName: { type: string }
        accountNumberMasked: { type: string }
        holderName: { type: string }
        updatedAt: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /metrics:
    get:
      summary: US-46 (NFR-17) — số liệu Prometheus (text/plain; version=0.0.4), không cần xác thực
      description: >-
        Micrometer: http_server_requests_seconds, JVM, Hikari.... Mọi response của service có header X-Request-Id (nhận từ request nếu hợp lệ [A-Za-z0-9._:-]{1,64}, ngược
        lại sinh UUID); id được ghi trong mọi dòng log JSON ("requestId") và chuyển tiếp sang các service được gọi.
      security: []
      responses:
        "200": { description: OK }
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }

  /api/payment/wallet:
    get:
      summary: Bản chốt v2.0 §8 (MENTEE) Số dư ví — tiền nạp khả dụng, khuyến mãi còn hạn, học phí đang tạm giữ, điều kiện hoàn tiền nạp
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /api/payment/wallet/entries:
    get:
      summary: Bản chốt v2.0 §8 Lịch sử bút toán ví (append-only), mới nhất trước
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WalletEntry" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
  /api/payment/wallet/topups:
    post:
      summary: >
        Bản chốt v2.0 §8.2 (MENTEE) Nạp ví 50.000–5.000.000đ mỗi lần (số nguyên); tiền nạp khả dụng sau khi nạp ≤ 20.000.000đ
        (409 CASH_CAP_EXCEEDED). provider trống / SANDBOX + card → kết quả ngay (Transaction kind = TOPUP, SUCCESS | FAILED; lỗi không
        đổi số dư). provider MOMO / VNPAY → trả link chuyển hướng (CheckoutResponse), ví được cộng khi cổng xác nhận (IPN / return /
        đối soát). Ví FROZEN → 403 WALLET_FROZEN; DORMANT → 409 WALLET_DORMANT (kích hoạt lại trước).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, example: 500000 }
                provider: { type: string, enum: [SANDBOX, MOMO, VNPAY] }
                card:
                  type: object
                  properties:
                    cardNumber: { type: string }
                    cardHolder: { type: string }
                    expiry: { type: string }
                    cvv: { type: string }
      responses:
        "200":
          description: Transaction (sandbox) hoặc { transactionId, provider, paymentUrl } (cổng chuyển hướng)
        "400": { description: INVALID_TOPUP_AMOUNT / CARD_REQUIRED }
        "409": { description: CASH_CAP_EXCEEDED / WALLET_DORMANT }
  /api/payment/wallet/pay:
    post:
      summary: >
        Bản chốt v2.0 §5/§8 (MENTEE chủ phiên) Trả học phí của phiên PENDING từ ví: trừ khuyến mãi (lô sắp hết hạn trước) rồi tiền nạp;
        ghi giao dịch provider = WALLET, SUCCESS, với phí nền tảng chốt lúc này; báo mentoring-service chuyển phiên sang AWAITING_MENTOR.
        Không đủ tiền → 402 INSUFFICIENT_FUNDS (không ghi gì). Thay cho POST /api/payment/charge (mặc định tắt: 409 USE_WALLET).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                amount: { type: number, description: Tuỳ chọn, dùng để đối chiếu }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "402": { description: INSUFFICIENT_FUNDS }
        "403": { description: WALLET_FROZEN / không phải mentee của phiên }
        "409": { description: ALREADY_PAID / SESSION_NOT_PAYABLE / WALLET_DORMANT }
  /api/payment/wallet/reactivate:
    post:
      summary: Bản chốt v2.0 §8.5 (MENTEE) Kích hoạt lại ví DORMANT (12 tháng không giao dịch) — tiền nạp được giữ nguyên
      responses:
        "204": { description: OK }
        "403": { description: Ví đang bị đóng băng }
  /api/payment/wallet/topup-refund/eligibility:
    get:
      summary: Bản chốt v2.0 §8.4 (MENTEE) Điều kiện hoàn tiền nạp hiện tại
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundEligibility" }
  /api/payment/wallet/topup-refund:
    get:
      summary: Yêu cầu hoàn tiền nạp của tôi (50 gần nhất)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TopupRefundRequest" } }
    post:
      summary: >
        Bản chốt v2.0 §8.4 (MENTEE) Hoàn tiền nạp về nguồn thanh toán: chỉ tiền nạp khả dụng (không gồm khuyến mãi / tiền đang tạm
        giữ), trong 7 ngày kể từ lần nạp gần nhất, tối đa min(tiền nạp khả dụng, tiền nạp còn hoàn được trong 7 ngày), tối đa 2 yêu
        cầu / tháng. Hợp lệ → xử lý ngay (DONE). Ngoài quy định → 409 (REFUND_WINDOW_CLOSED / REFUND_LIMIT_REACHED /
        REFUND_AMOUNT_EXCEEDED) trừ khi gửi exceptionReason → tạo yêu cầu ngoại lệ PENDING cho admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                exceptionReason: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: TopupRefundRequest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopupRefundRequest" }
        "409": { description: REFUND_WINDOW_CLOSED / REFUND_LIMIT_REACHED / REFUND_AMOUNT_EXCEEDED }
        "502": { description: REFUND_FAILED }
  /api/payment/wallet/admin/topup-refunds:
    get:
      summary: Bản chốt v2.0 §8.4 (ADMIN) Hàng chờ yêu cầu hoàn tiền nạp ngoại lệ
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, DONE, REJECTED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TopupRefundRequest" } }
  /api/payment/wallet/admin/topup-refunds/{id}/decide:
    post:
      summary: Bản chốt v2.0 §8.4 (ADMIN) Duyệt (hoàn ngay, tối đa tiền nạp khả dụng) hoặc từ chối yêu cầu ngoại lệ — bắt buộc lý do
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: TopupRefundRequest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopupRefundRequest" }
        "409": { description: REQUEST_NOT_PENDING / REFUND_AMOUNT_EXCEEDS_CASH }
  /api/payment/wallet/admin/{userId}/promo:
    post:
      summary: Bản chốt v2.0 §8 (ADMIN) Cấp tiền khuyến mãi cho người dùng (lô hết hạn sau 12 tháng)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number }
                reason: { type: string, maxLength: 200 }
      responses:
        "201": { description: "{ lotId }" }
  /internal/wallet/pay:
    post:
      summary: >
        Bản chốt v2.0 §5 (nội bộ — mentoring-service) Tạm giữ học phí của phiên từ ví của mentee ngay sau khi đặt lịch. Giá lấy từ
        mentoring-service. 402 INSUFFICIENT_FUNDS khi ví thiếu (phiên giữ PENDING).
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, sessionId]
              properties:
                userId: { type: string, format: uuid }
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "402": { description: INSUFFICIENT_FUNDS }
  /internal/wallet/freeze:
    post:
      summary: Bản chốt v2.0 §2.1 (nội bộ) Admin khoá / mở khoá tài khoản → đóng băng / mở ví. Idempotent.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, frozen]
              properties:
                userId: { type: string, format: uuid }
                frozen: { type: boolean }
      responses:
        "200": { description: "{ userId, frozen }" }
  /api/payment/charge:
    post:
      summary: >
        FR-6.1 → FR-6.3 [v2.0: mặc định TẮT → 409 USE_WALLET; chỉ bật bằng app.payment.direct-session-payment cho dev] Thanh toán 1 phiên PENDING (MENTEE chủ phiên). Số tiền lấy từ
        mentoring-service; nếu client gửi amount khác giá phiên → AMOUNT_MISMATCH.
        SUCCESS → xử lý referral + báo mentoring-service xác nhận phiên (FR-6.2).
        US-13: phí nền tảng (app.payment.platform-fee-rate, mặc định 15%) chốt vào fee / mentorEarning lúc tạo giao dịch.
        Bắt buộc header Idempotency-Key (frontend sinh 1 UUID cho mỗi lần checkout): cùng người gọi + cùng key trong
        24 giờ → trả lại giao dịch của lần gọi đầu (kể cả FAILED), không charge lần 2. Lỗi kiểm tra xảy ra trước khi
        tạo giao dịch (SESSION_NOT_PAYABLE, AMOUNT_MISMATCH...) không "tiêu" key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255, example: 3f1c2a7e-0d4b-4c55-9a8e-1b2c3d4e5f60 }
          description: "Phạm vi: (userId của JWT, key). 1–255 ký tự ASCII in được."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, card]
              properties:
                sessionId: { type: string, format: uuid }
                amount: { type: number, description: Tuỳ chọn, dùng để đối chiếu }
                card:
                  type: object
                  required: [cardNumber, expiry, cvv]
                  properties:
                    cardNumber: { type: string }
                    cardHolder: { type: string }
                    expiry: { type: string, example: "12/28" }
                    cvv: { type: string }
      responses:
        "200":
          description: Kết quả giao dịch (SUCCESS hoặc FAILED kèm failureReason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED / INVALID_IDEMPOTENCY_KEY / AMOUNT_MISMATCH / FREE_SESSION }
        "403": { description: "EMAIL_NOT_VERIFIED (US-39) — người thanh toán chưa xác thực email (claim ev = false)" }
        "403": { description: Không phải mentee của phiên }
        "409": { description: "ALREADY_PAID / SESSION_NOT_PAYABLE / IDEMPOTENCY_KEY_REUSED (key đã dùng cho phiên khác) / IDEMPOTENCY_IN_PROGRESS (lần gọi đầu chưa xong)" }

  /api/payment/transactions:
    get:
      summary: FR-6.3 Giao dịch của tôi (mentee = đã trả, mentor = đã nhận)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
  /api/payment/transactions/{id}:
    get:
      summary: Chi tiết giao dịch (người trả / mentor / admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /api/payment/sessions/{sessionId}/transactions:
    get:
      summary: Lịch sử giao dịch của 1 phiên
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }

  /api/payment/referrals/me:
    get:
      summary: FR-6.4 → FR-6.6 Mã giới thiệu (tạo lần đầu), danh sách người đã giới thiệu, số dư điểm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: K7QM2ZPA }
                  shareUrl: { type: string }
                  totalReferrals: { type: integer }
                  qualifiedReferrals: { type: integer }
                  pointsBalance: { type: integer }
                  rewardPointsPerReferral: { type: integer }
                  minQualifyingAmount: { type: number }
                  referrals: { type: array, items: { $ref: "#/components/schemas/Referral" } }
                  rewards:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        points: { type: integer }
                        reason: { type: string }
                        createdAt: { type: string, format: date-time }

  /api/payment/earnings/summary:
    get:
      summary: (MENTOR) US-25 — tổng thu nhập pending / available / paidOut của mentor đang đăng nhập
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningSummary" }
        "403": { description: Không phải MENTOR }
  /api/payment/earnings:
    get:
      summary: (MENTOR) US-25 — thu nhập theo từng phiên có phí (mới nhất trước), kèm các dòng sổ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EarningRow" } }
  /api/payment/admin/transactions:
    get:
      summary: (ADMIN) Giám sát giao dịch
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED, PARTIALLY_REFUNDED, ON_HOLD] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: "{ items: Transaction[], page, size, totalItems, totalPages }" }
  /api/payment/admin/stats:
    get:
      summary: (ADMIN) Thống kê giao dịch
      responses:
        "200": { description: "{ successCount, failedCount, refundedCount, totalRevenue, partiallyRefundedCount, onHoldCount, totalPlatformFee }" }
  /api/payment/admin/referrals:
    get:
      summary: (ADMIN) Giám sát referral
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Referral" } }

  /internal/referrals:
    post:
      summary: Nội bộ — auth-service ghi nhận người dùng mới đăng ký bằng mã giới thiệu (FR-6.5)
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, refereeId]
              properties:
                code: { type: string }
                refereeId: { type: string, format: uuid }
      responses:
        "201":
          description: Đã ghi nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }
        "400": { description: SELF_REFERRAL }
        "404": { description: REFERRAL_CODE_NOT_FOUND }
        "409": { description: ALREADY_REFERRED }
  /internal/payments/refund:
    post:
      summary: >
        Nội bộ — mentoring-service yêu cầu hoàn tiền phiên (huỷ phiên đã thanh toán US-01, mentor vắng mặt US-12).
        US-13: hoàn theo amount (VND) HOẶC percent (% giá gốc; cả hai trống = 100%). Mỗi lần ghi 1 dòng refunds,
        tổng ≤ giá gốc; giao dịch → PARTIALLY_REFUNDED hoặc REFUNDED (khi đã hoàn đủ). Không ghi đè giao dịch.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300 }
                percent: { type: integer, minimum: 1, maximum: 100, description: "% giá gốc của giao dịch" }
                amount: { type: number, minimum: 1, description: "Số tiền VND (không gửi cùng percent)" }
                actorId: { type: string, format: uuid, nullable: true, description: "Người thực hiện (admin); trống = hệ thống" }
      responses:
        "200":
          description: Giao dịch sau khi hoàn tiền (PARTIALLY_REFUNDED / REFUNDED, kèm refunds)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: INVALID_REFUND_AMOUNT / VALIDATION_ERROR }
        "404": { description: NO_SUCCESS_TRANSACTION (chưa thanh toán / đã hoàn đủ) }
        "409": { description: REFUND_EXCEEDS_AMOUNT / TRANSACTION_ON_HOLD }
  /internal/payments/hold:
    post:
      summary: >
        Nội bộ — US-12 phiên DISPUTED: tạm giữ giao dịch SUCCESS → ON_HOLD (không trả mentor, không hoàn mentee cho tới
        khi xử lý tranh chấp — US-32). Gọi lại khi đã ON_HOLD → 200 như cũ.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300, example: SESSION_DISPUTED }
      responses:
        "200":
          description: Giao dịch (status = ON_HOLD)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: NO_SUCCESS_TRANSACTION (phiên miễn phí / chưa thanh toán) }
        "409": { description: TRANSACTION_NOT_HOLDABLE (đã hoàn tiền) }
  /internal/payments/release:
    post:
      summary: Nội bộ — US-12/US-32 giải phóng giao dịch tạm giữ ON_HOLD → SUCCESS. Gọi lại khi đã SUCCESS → 200 như cũ.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: Giao dịch (status = SUCCESS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: NO_SUCCESS_TRANSACTION }
        "409": { description: TRANSACTION_NOT_ON_HOLD }
  /internal/payments/sessions/{sessionId}/final-state:
    post:
      summary: >
        Nội bộ — US-25 mentoring-service báo trạng thái cuối của phiên có phí. payment-service giữ đồng hồ giải phóng:
        COMPLETED / NO_SHOW_MENTEE / CANCELLED (mentee huỷ muộn, hoàn 0%) → release_at = endedAt + 48h
        (app.earnings.release-delay); releaseNow=true (tranh chấp đã giải quyết) → giải phóng ngay. Trạng thái khác
        (NO_SHOW_MENTOR, DISPUTED…) chỉ được ghi nhận. Job giải phóng ghi EARNING_AVAILABLE = phần pending còn lại, bỏ qua
        giao dịch ON_HOLD (tranh chấp đang mở). Idempotent — gọi lại ghi đè lịch, không ghi trùng sổ.
      security: [{ internalToken: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, endedAt]
              properties:
                state: { type: string, example: COMPLETED }
                endedAt: { type: string, format: date-time }
                releaseNow: { type: boolean, default: false }
      responses:
        "200":
          description: "{ sessionId, transactionId, finalState, endedAt, releaseAt, settledAt, pending, available }"
        "404": { description: NO_SUCCESS_TRANSACTION (phiên miễn phí / chưa thanh toán) }
  /internal/rewards:
    post:
      summary: >
        Nội bộ — US-01 mentoring-service cộng điểm thưởng gắn với 1 phiên (MENTOR_CANCEL_APOLOGY, 20 điểm khi mentor
        huỷ). Idempotent theo (userId, reason, sessionId): gửi lại trả bản ghi đã có, không cộng trùng.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, points, reason, sessionId]
              properties:
                userId: { type: string, format: uuid }
                points: { type: integer, minimum: 1, maximum: 10000 }
                reason: { type: string, example: MENTOR_CANCEL_APOLOGY }
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: "Bản ghi reward_ledger { id, points, reason, createdAt }"
  /api/payment/payouts/overview:
    get:
      summary: US-42 (MENTOR) — số dư khả dụng, yêu cầu đang mở, tài khoản (che số), lịch sử rút; canRequest khi không có yêu cầu mở, đã có tài khoản và khả dụng ≥ 200.000đ.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: number }
                  requested: { type: number }
                  minimum: { type: number, example: 200000 }
                  canRequest: { type: boolean }
                  bankAccount: { allOf: [{ $ref: "#/components/schemas/BankAccount" }], nullable: true }
                  openPayout: { allOf: [{ $ref: "#/components/schemas/Payout" }], nullable: true }
                  history: { type: array, items: { $ref: "#/components/schemas/Payout" } }
  /api/payment/bank-account:
    put:
      summary: US-42 (MENTOR) — lưu tài khoản nhận tiền; số tài khoản 6–20 chữ số, API chỉ trả 4 số cuối.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankName, accountNumber, holderName]
              properties:
                bankName: { type: string }
                accountNumber: { type: string }
                holderName: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "400": { description: INVALID_BANK_ACCOUNT }
  /api/payment/payouts:
    post:
      summary: US-42 (MENTOR) — yêu cầu rút TOÀN BỘ số dư khả dụng; admin nhận thông báo PAYOUT_REQUESTED.
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { description: PAYOUT_BELOW_MINIMUM (< 200.000đ) / BANK_ACCOUNT_REQUIRED }
        "409": { description: PAYOUT_ALREADY_OPEN }
  /api/payment/transactions/{id}/receipt:
    get:
      summary: >
        US-42 (PRD-PAY-6) — biên lai giao dịch đã thanh toán (SUCCESS / ON_HOLD / PARTIALLY_REFUNDED / REFUNDED) kèm biên
        lai từng lần hoàn tiền. Người trả, mentor của giao dịch hoặc admin. Frontend in / lưu PDF bằng trình duyệt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Receipt { receiptNumber (RC-xxxxxxxx), transactionId, paidAt, session, payerName, mentorName, amount, fee, mentorEarning, refunded, netPaid, refunds[{receiptNumber (RF-…), amount, reason, createdAt}] }" }
        "403": { description: FORBIDDEN }
        "404": { description: TRANSACTION_NOT_FOUND }
        "409": { description: RECEIPT_NOT_AVAILABLE }
  /api/payment/earnings/export:
    get:
      summary: US-42 (PRD-PAY-4, MENTOR) — CSV thu nhập theo tháng (yyyy-MM, theo ngày thu tiền giờ Việt Nam), UTF-8 có BOM.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-11" } }
      responses:
        "200":
          description: text/csv — date, session_id, transaction_id, session_price, mentor_earning, pending, available, paid_out, reversed, status
          content:
            text/csv: { schema: { type: string } }
        "400": { description: INVALID_MONTH }
  /api/payment/admin/payouts:
    get:
      summary: US-42 (ADMIN) — status = REQUESTED (cũ nhất trước) | PAID | REJECTED; trống = tất cả.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [REQUESTED, PAID, REJECTED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Payout" } }
  /api/payment/admin/payouts/{id}/paid:
    post:
      summary: >
        US-42 (ADMIN) — đã chuyển khoản: ghi dòng PAYOUT vào sổ thu nhập phân bổ FIFO theo giao dịch, mentor nhận thông báo
        + email PAYOUT_PAID, audit PAYOUT_PAID. Số dư khả dụng giảm dưới số tiền yêu cầu (bị thu hồi sau khi yêu cầu) → 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference: { type: string, maxLength: 100 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "404": { description: PAYOUT_NOT_FOUND }
        "409": { description: PAYOUT_NOT_OPEN / PAYOUT_EXCEEDS_AVAILABLE }
  /api/payment/admin/payouts/{id}/reject:
    post:
      summary: US-42 (ADMIN) — từ chối kèm lý do; mentor nhận thông báo PAYOUT_REJECTED.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "409": { description: PAYOUT_NOT_OPEN }
