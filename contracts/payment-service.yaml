openapi: 3.0.3
info:
  title: payment-service
  version: 1.0.0
  description: >
    Thanh toán phiên mentoring qua cổng sandbox + Referral/Affiliate + sổ thu nhập mentor (US-25). Sở hữu bởi Thắng.
    Mọi biến động tiền (charge, refund, hold, release, earning pending/available/reversal) được ghi nhật ký kiểm toán qua
    auth-service POST /internal/audit (bắn-rồi-quên, US-30).
    Thẻ test: 4242 4242 4242 4242 (thành công), 4000 0000 0000 0002 (CARD_DECLINED),
    4000 0000 0000 9995 (INSUFFICIENT_FUNDS).
servers:
  - url: http://localhost:8084
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  schemas:
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        mentorId: { type: string, format: uuid }
        amount: { type: number, description: "Giá phiên (VND) mentee trả" }
        fee: { type: number, example: 45000, description: "US-13 — phí nền tảng = round(amount × feeRate), chốt lúc charge" }
        mentorEarning: { type: number, example: 255000, description: "US-13 — amount − fee, chốt lúc charge (đổi cấu hình phí về sau không đổi giá trị này)" }
        feeRate: { type: number, example: 0.15, description: "US-13 — tỉ lệ phí áp dụng (app.payment.platform-fee-rate lúc charge)" }
        refundedAmount: { type: number, description: "US-13 — tổng các lần hoàn (bảng refunds); ≤ amount" }
        currency: { type: string, example: VND }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED, PARTIALLY_REFUNDED, ON_HOLD]
          description: >
            PENDING → SUCCESS | FAILED; SUCCESS → PARTIALLY_REFUNDED → REFUNDED; SUCCESS → REFUNDED;
            SUCCESS → ON_HOLD → SUCCESS (US-12: phiên DISPUTED — chưa trả mentor, chưa hoàn mentee).
        provider: { type: string, example: SANDBOX }
        providerReference: { type: string, nullable: true }
        failureReason: { type: string, nullable: true, example: CARD_DECLINED, description: "Chỉ lý do charge thất bại (hoàn tiền không còn ghi đè trường này)" }
        holdReason: { type: string, nullable: true, example: SESSION_DISPUTED }
        refunds: { type: array, items: { $ref: "#/components/schemas/Refund" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Refund:
      type: object
      description: US-13 — một lần hoàn tiền (bảng refunds); SUM(amount) ≤ Transaction.amount
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        reason: { type: string, nullable: true }
        actorId: { type: string, format: uuid, nullable: true, description: "null = hệ thống / service nội bộ" }
        createdAt: { type: string, format: date-time }
    EarningSummary:
      type: object
      description: >
        US-25 — tổng thu nhập của mentor (VND) tính từ sổ mentor_ledger (append-only). pending = chưa giải phóng
        (phiên chưa xong / chưa đủ 48 giờ / đang tranh chấp); available = đã giải phóng chưa chi trả; paidOut = đã chi trả;
        reversed = đã thu hồi do hoàn tiền; earned = tổng EARNING_PENDING.
      properties:
        pending: { type: number, example: 255000 }
        available: { type: number, example: 127500 }
        paidOut: { type: number, example: 0 }
        reversed: { type: number, example: 127500 }
        earned: { type: number, example: 510000 }
        currency: { type: string, example: VND }
        releaseDelayHours: { type: integer, example: 48, description: "app.earnings.release-delay" }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [EARNING_PENDING, EARNING_AVAILABLE, REVERSAL, PAYOUT] }
        amount: { type: number, description: "Luôn dương; kiểu dòng quyết định chiều" }
        refundId: { type: string, format: uuid, nullable: true, description: "REVERSAL — lần hoàn gây ra" }
        createdAt: { type: string, format: date-time }
    EarningRow:
      type: object
      description: US-25 — thu nhập của 1 phiên có phí (giao dịch đã thu tiền)
      properties:
        sessionId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        amount: { type: number }
        mentorEarning: { type: number }
        transactionStatus: { type: string, enum: [SUCCESS, ON_HOLD, PARTIALLY_REFUNDED, REFUNDED] }
        pending: { type: number }
        available: { type: number }
        paidOut: { type: number }
        reversed: { type: number }
        finalState: { type: string, nullable: true, example: COMPLETED, description: "Trạng thái cuối mentoring báo (null = phiên chưa kết thúc)" }
        endedAt: { type: string, format: date-time, nullable: true }
        releaseAt: { type: string, format: date-time, nullable: true, description: "endedAt + 48h (hoặc lúc giải quyết tranh chấp)" }
        releasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
    Referral:
      type: object
      properties:
        id: { type: string, format: uuid }
        referrerId: { type: string, format: uuid }
        refereeId: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, QUALIFIED, REJECTED] }
        rejectReason: { type: string, nullable: true, enum: [REFERRER_IS_SESSION_MENTOR, DAILY_LIMIT_EXCEEDED] }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: string, format: date-time, nullable: true }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }

  /api/payment/charge:
    post:
      summary: >
        FR-6.1 → FR-6.3 Thanh toán 1 phiên PENDING (MENTEE chủ phiên). Số tiền lấy từ
        mentoring-service; nếu client gửi amount khác giá phiên → AMOUNT_MISMATCH.
        SUCCESS → xử lý referral + báo mentoring-service xác nhận phiên (FR-6.2).
        US-13: phí nền tảng (app.payment.platform-fee-rate, mặc định 15%) chốt vào fee / mentorEarning lúc tạo giao dịch.
        Bắt buộc header Idempotency-Key (frontend sinh 1 UUID cho mỗi lần checkout): cùng người gọi + cùng key trong
        24 giờ → trả lại giao dịch của lần gọi đầu (kể cả FAILED), không charge lần 2. Lỗi kiểm tra xảy ra trước khi
        tạo giao dịch (SESSION_NOT_PAYABLE, AMOUNT_MISMATCH...) không "tiêu" key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255, example: 3f1c2a7e-0d4b-4c55-9a8e-1b2c3d4e5f60 }
          description: "Phạm vi: (userId của JWT, key). 1–255 ký tự ASCII in được."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, card]
              properties:
                sessionId: { type: string, format: uuid }
                amount: { type: number, description: Tuỳ chọn, dùng để đối chiếu }
                card:
                  type: object
                  required: [cardNumber, expiry, cvv]
                  properties:
                    cardNumber: { type: string }
                    cardHolder: { type: string }
                    expiry: { type: string, example: "12/28" }
                    cvv: { type: string }
      responses:
        "200":
          description: Kết quả giao dịch (SUCCESS hoặc FAILED kèm failureReason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED / INVALID_IDEMPOTENCY_KEY / AMOUNT_MISMATCH / FREE_SESSION }
        "403": { description: "EMAIL_NOT_VERIFIED (US-39) — người thanh toán chưa xác thực email (claim ev = false)" }
        "403": { description: Không phải mentee của phiên }
        "409": { description: "ALREADY_PAID / SESSION_NOT_PAYABLE / IDEMPOTENCY_KEY_REUSED (key đã dùng cho phiên khác) / IDEMPOTENCY_IN_PROGRESS (lần gọi đầu chưa xong)" }

  /api/payment/transactions:
    get:
      summary: FR-6.3 Giao dịch của tôi (mentee = đã trả, mentor = đã nhận)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
  /api/payment/transactions/{id}:
    get:
      summary: Chi tiết giao dịch (người trả / mentor / admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /api/payment/sessions/{sessionId}/transactions:
    get:
      summary: Lịch sử giao dịch của 1 phiên
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }

  /api/payment/referrals/me:
    get:
      summary: FR-6.4 → FR-6.6 Mã giới thiệu (tạo lần đầu), danh sách người đã giới thiệu, số dư điểm
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: K7QM2ZPA }
                  shareUrl: { type: string }
                  totalReferrals: { type: integer }
                  qualifiedReferrals: { type: integer }
                  pointsBalance: { type: integer }
                  rewardPointsPerReferral: { type: integer }
                  minQualifyingAmount: { type: number }
                  referrals: { type: array, items: { $ref: "#/components/schemas/Referral" } }
                  rewards:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        points: { type: integer }
                        reason: { type: string }
                        createdAt: { type: string, format: date-time }

  /api/payment/earnings/summary:
    get:
      summary: (MENTOR) US-25 — tổng thu nhập pending / available / paidOut của mentor đang đăng nhập
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningSummary" }
        "403": { description: Không phải MENTOR }
  /api/payment/earnings:
    get:
      summary: (MENTOR) US-25 — thu nhập theo từng phiên có phí (mới nhất trước), kèm các dòng sổ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EarningRow" } }
  /api/payment/admin/transactions:
    get:
      summary: (ADMIN) Giám sát giao dịch
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED, PARTIALLY_REFUNDED, ON_HOLD] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: "{ items: Transaction[], page, size, totalItems, totalPages }" }
  /api/payment/admin/stats:
    get:
      summary: (ADMIN) Thống kê giao dịch
      responses:
        "200": { description: "{ successCount, failedCount, refundedCount, totalRevenue, partiallyRefundedCount, onHoldCount, totalPlatformFee }" }
  /api/payment/admin/referrals:
    get:
      summary: (ADMIN) Giám sát referral
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Referral" } }

  /internal/referrals:
    post:
      summary: Nội bộ — auth-service ghi nhận người dùng mới đăng ký bằng mã giới thiệu (FR-6.5)
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, refereeId]
              properties:
                code: { type: string }
                refereeId: { type: string, format: uuid }
      responses:
        "201":
          description: Đã ghi nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Referral" }
        "400": { description: SELF_REFERRAL }
        "404": { description: REFERRAL_CODE_NOT_FOUND }
        "409": { description: ALREADY_REFERRED }
  /internal/payments/refund:
    post:
      summary: >
        Nội bộ — mentoring-service yêu cầu hoàn tiền phiên (huỷ phiên đã thanh toán US-01, mentor vắng mặt US-12).
        US-13: hoàn theo amount (VND) HOẶC percent (% giá gốc; cả hai trống = 100%). Mỗi lần ghi 1 dòng refunds,
        tổng ≤ giá gốc; giao dịch → PARTIALLY_REFUNDED hoặc REFUNDED (khi đã hoàn đủ). Không ghi đè giao dịch.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300 }
                percent: { type: integer, minimum: 1, maximum: 100, description: "% giá gốc của giao dịch" }
                amount: { type: number, minimum: 1, description: "Số tiền VND (không gửi cùng percent)" }
                actorId: { type: string, format: uuid, nullable: true, description: "Người thực hiện (admin); trống = hệ thống" }
      responses:
        "200":
          description: Giao dịch sau khi hoàn tiền (PARTIALLY_REFUNDED / REFUNDED, kèm refunds)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: INVALID_REFUND_AMOUNT / VALIDATION_ERROR }
        "404": { description: NO_SUCCESS_TRANSACTION (chưa thanh toán / đã hoàn đủ) }
        "409": { description: REFUND_EXCEEDS_AMOUNT / TRANSACTION_ON_HOLD }
  /internal/payments/hold:
    post:
      summary: >
        Nội bộ — US-12 phiên DISPUTED: tạm giữ giao dịch SUCCESS → ON_HOLD (không trả mentor, không hoàn mentee cho tới
        khi xử lý tranh chấp — US-32). Gọi lại khi đã ON_HOLD → 200 như cũ.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300, example: SESSION_DISPUTED }
      responses:
        "200":
          description: Giao dịch (status = ON_HOLD)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: NO_SUCCESS_TRANSACTION (phiên miễn phí / chưa thanh toán) }
        "409": { description: TRANSACTION_NOT_HOLDABLE (đã hoàn tiền) }
  /internal/payments/release:
    post:
      summary: Nội bộ — US-12/US-32 giải phóng giao dịch tạm giữ ON_HOLD → SUCCESS. Gọi lại khi đã SUCCESS → 200 như cũ.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: Giao dịch (status = SUCCESS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: NO_SUCCESS_TRANSACTION }
        "409": { description: TRANSACTION_NOT_ON_HOLD }
  /internal/payments/sessions/{sessionId}/final-state:
    post:
      summary: >
        Nội bộ — US-25 mentoring-service báo trạng thái cuối của phiên có phí. payment-service giữ đồng hồ giải phóng:
        COMPLETED / NO_SHOW_MENTEE / CANCELLED (mentee huỷ muộn, hoàn 0%) → release_at = endedAt + 48h
        (app.earnings.release-delay); releaseNow=true (tranh chấp đã giải quyết) → giải phóng ngay. Trạng thái khác
        (NO_SHOW_MENTOR, DISPUTED…) chỉ được ghi nhận. Job giải phóng ghi EARNING_AVAILABLE = phần pending còn lại, bỏ qua
        giao dịch ON_HOLD (tranh chấp đang mở). Idempotent — gọi lại ghi đè lịch, không ghi trùng sổ.
      security: [{ internalToken: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, endedAt]
              properties:
                state: { type: string, example: COMPLETED }
                endedAt: { type: string, format: date-time }
                releaseNow: { type: boolean, default: false }
      responses:
        "200":
          description: "{ sessionId, transactionId, finalState, endedAt, releaseAt, settledAt, pending, available }"
        "404": { description: NO_SUCCESS_TRANSACTION (phiên miễn phí / chưa thanh toán) }
  /internal/rewards:
    post:
      summary: >
        Nội bộ — US-01 mentoring-service cộng điểm thưởng gắn với 1 phiên (MENTOR_CANCEL_APOLOGY, 20 điểm khi mentor
        huỷ). Idempotent theo (userId, reason, sessionId): gửi lại trả bản ghi đã có, không cộng trùng.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, points, reason, sessionId]
              properties:
                userId: { type: string, format: uuid }
                points: { type: integer, minimum: 1, maximum: 10000 }
                reason: { type: string, example: MENTOR_CANCEL_APOLOGY }
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: "Bản ghi reward_ledger { id, points, reason, createdAt }"
