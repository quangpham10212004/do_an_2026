openapi: 3.0.3
info:
  title: auth-service
  version: 1.0.0
  description: >
    Đăng ký, đăng nhập, JWT (access + refresh token), quản lý tài khoản và phân quyền.
    Sở hữu bởi Quang. Access token là JWT HS256 (secret dùng chung JWT_SECRET) chứa
    claim sub=userId, email, role, typ=access — các service khác tự xác minh cục bộ.
servers:
  - url: http://localhost:8081
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: EMAIL_ALREADY_EXISTS }
            message: { type: string }
    AuthResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string, nullable: true }
        role: { type: string, enum: [MENTOR, MENTEE, ADMIN] }
        emailVerified: { type: boolean }
        accessToken:
          type: string
          description: >
            JWT HS256, claims sub, email, role, typ=access và (US-39) ev = email đã xác thực. Các service chặn gửi yêu cầu,
            đặt lịch, thanh toán khi ev = false (403 EMAIL_NOT_VERIFIED); token thiếu ev (cấp trước US-39) coi như true.
            Sau khi xác thực email frontend gọi /api/auth/refresh để nhận token có ev = true.
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Số giây access token còn hiệu lực }
        referralApplied: { type: boolean, nullable: true, description: Chỉ có khi đăng ký kèm referralCode }
        emailVerificationToken: { type: string, nullable: true, description: Chỉ trả về khi EXPOSE_VERIFICATION_TOKEN=true (demo không có SMTP) }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string, nullable: true }
        role: { type: string, enum: [MENTOR, MENTEE, ADMIN] }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
  responses:
    AuditRequest:
      type: object
      description: US-30 (PRD-ADM-5) — interface chung Sprint 3; mọi service gọi kiểu bắn-rồi-quên.
      required: [actorRole, action, targetType, targetId]
      properties:
        actorId: { type: string, format: uuid, nullable: true, description: null khi actorRole = SYSTEM }
        actorRole: { type: string, enum: [ADMIN, MENTOR, MENTEE, SYSTEM] }
        action: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", maxLength: 100, example: REFUND_CREATED }
        targetType: { type: string, maxLength: 50, example: SESSION }
        targetId: { type: string, maxLength: 100 }
        before: { type: object, nullable: true, description: Trạng thái trước (object JSON tuỳ ý) }
        after: { type: object, nullable: true, description: Trạng thái sau }
    AuditEntry:
      allOf:
        - $ref: "#/components/schemas/AuditRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            actorEmail: { type: string, nullable: true, description: Email của actor nếu là tài khoản trong auth_db }
            createdAt: { type: string, format: date-time }
    Error:
      description: Lỗi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
paths:
  /metrics:
    get:
      summary: US-46 (NFR-17) — số liệu Prometheus (text/plain; version=0.0.4), không cần xác thực
      description: >-
        Micrometer: http_server_requests_seconds, JVM, Hikari.... Mọi response của service có header X-Request-Id (nhận từ request nếu hợp lệ [A-Za-z0-9._:-]{1,64}, ngược
        lại sinh UUID); id được ghi trong mọi dòng log JSON ("requestId") và chuyển tiếp sang các service được gọi.
      security: []
      responses:
        "200": { description: OK }
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: "{ status: UP }" }

  /api/auth/register:
    post:
      summary: FR-1.1 Đăng ký tài khoản (MENTOR hoặc MENTEE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                role: { type: string, enum: [MENTOR, MENTEE] }
                fullName: { type: string, maxLength: 100 }
                referralCode: { type: string, maxLength: 32, description: Mã giới thiệu (tuỳ chọn) }
      responses:
        "201":
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/auth/login:
    post:
      summary: FR-1.2 Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { description: INVALID_CREDENTIALS }
        "403": { description: ACCOUNT_LOCKED }
        "429": { description: "RATE_LIMITED — US-46 (NFR-10) quá 5 lần gọi / phút / IP (IP = phần tử đầu X-Forwarded-For khi TRUST_FORWARDED_FOR=true, mặc định có — frontend BFF đặt header này); header Retry-After (giây)" }
        "429": { description: TOO_MANY_ATTEMPTS — sai mật khẩu 5 lần, chặn 15 phút }

  /api/auth/refresh:
    post:
      summary: Đổi refresh token lấy cặp token mới (token cũ bị thu hồi — rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Cặp token mới
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { description: Refresh token không hợp lệ / hết hạn / đã dùng }

  /api/auth/logout:
    post:
      summary: Thu hồi refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Đã đăng xuất }

  /api/auth/verify-email:
    get:
      summary: FR-1.1 Xác thực email bằng token trong email
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Đã xác thực
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: INVALID_VERIFICATION_TOKEN }

  /api/auth/forgot-password:
    post:
      summary: >
        US-09 (PRD-AUTH-1) Yêu cầu link đặt lại mật khẩu. LUÔN trả 202 dù email có tồn tại hay không
        (chống dò email). Tối đa 3 yêu cầu / email / giờ (Redis) — vượt quá vẫn 202 nhưng không gửi email.
        Email đi qua interface EmailSender (mặc định ghi log, link dạng {FRONTEND_URL}/reset-password?token=...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: Đã tiếp nhận (không có body) }
        "400": { description: VALIDATION_ERROR — email sai định dạng }

  /api/auth/reset-password:
    post:
      summary: >
        US-09 Đặt mật khẩu mới bằng token trong email (token 32 byte ngẫu nhiên, DB lưu SHA-256, hạn 30 phút,
        dùng một lần; yêu cầu mới làm token cũ hết hiệu lực). Thành công thì thu hồi mọi refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 200 }
                newPassword: { type: string, minLength: 8, maxLength: 72, description: Cùng quy tắc với đăng ký }
      responses:
        "204": { description: Đã đổi mật khẩu }
        "400":
          description: RESET_TOKEN_INVALID (token sai / hết hạn / đã dùng) | VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /internal/dev/emails:
    get:
      summary: >
        (Chỉ dev/demo/e2e, KHÔNG tồn tại ở Spring profile prod; X-Internal-Token) Email mà LoggingEmailSender
        đã "gửi" tới địa chỉ `to` (tối đa 100 email gần nhất trong bộ nhớ), mới nhất trước.
      parameters:
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    to: { type: string }
                    subject: { type: string }
                    body: { type: string }
                    sentAt: { type: string, format: date-time }
        "403": { description: Thiếu / sai X-Internal-Token }

  /api/auth/verify-token:
    post:
      summary: Xác thực JWT và kiểm tra tài khoản còn ACTIVE (dành cho service cần kiểm tra thu hồi)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Kết quả xác thực
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  userId: { type: string, format: uuid, nullable: true }
                  role: { type: string, enum: [MENTOR, MENTEE, ADMIN], nullable: true }

  /api/auth/me:
    get:
      summary: FR-1.4 Thông tin tài khoản hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    put:
      summary: FR-1.4 Cập nhật thông tin cá nhân
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/auth/me/change-password:
    post:
      summary: FR-1.4 Đổi mật khẩu (thu hồi mọi refresh token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Đã đổi mật khẩu }
        "400": { description: WRONG_PASSWORD }

  /api/auth/admin/users:
    get:
      summary: FR-1.5 (ADMIN) Danh sách người dùng có lọc & phân trang
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [MENTOR, MENTEE, ADMIN] } }
        - { name: q, in: query, schema: { type: string }, description: Tìm theo email/tên }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
        "403": { description: Không phải ADMIN }

  /api/auth/admin/users/stats:
    get:
      summary: (ADMIN) Thống kê số người dùng
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ total, mentors, mentees }" }

  /api/auth/admin/users/{userId}/status:
    patch:
      summary: FR-1.5 (ADMIN) Khoá / mở khoá tài khoản — ghi audit log USER_LOCKED / USER_UNLOCKED (targetType USER) khi trạng thái đổi
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, LOCKED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: CANNOT_LOCK_SELF / CANNOT_LOCK_ADMIN }

  # ---------------- US-30 (PRD-ADM-5): nhật ký kiểm toán ----------------
  /internal/audit:
    post:
      summary: >
        (nội bộ, X-Internal-Token) Ghi một dòng nhật ký kiểm toán. Append-only: không có endpoint sửa/xoá, trigger DB
        chặn UPDATE/DELETE/TRUNCATE; job hằng ngày xoá dòng cũ hơn app.audit.retention (mặc định P730D = 2 năm).
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditRequest" }
      responses:
        "202": { description: Đã ghi }
        "400": { description: VALIDATION_ERROR (actorRole/action sai định dạng, before/after không phải object) }
        "401": { description: Thiếu / sai X-Internal-Token }

  /api/auth/admin/audit:
    get:
      summary: >
        US-30 (ADMIN) Tra cứu nhật ký kiểm toán, mới nhất trước. Alias /api/admin/audit (gọi thẳng service);
        frontend dùng /api/auth/admin/audit qua proxy.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string }, description: Khớp chính xác (không phân biệt hoa thường) }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "yyyy-MM-dd (giờ VN) hoặc ISO date-time; created_at >= from" }
        - { name: to, in: query, schema: { type: string }, description: "yyyy-MM-dd = hết ngày đó; hoặc ISO date-time (loại trừ)" }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
        "400": { description: INVALID_DATE }
        "403": { description: Không phải ADMIN }
  /api/auth/me/resend-verification:
    post:
      summary: >
        US-39 (PRD-AUTH-3) — gửi lại email xác thực (banner "Email chưa xác thực"), tối đa 3 lần / giờ / tài khoản. Mỗi lần
        tạo token mới (link cũ hết hiệu lực). emailVerificationToken chỉ trả ở môi trường demo (EXPOSE_VERIFICATION_TOKEN).
      responses:
        "200":
          description: Đã gửi
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  emailVerificationToken: { type: string, nullable: true }
        "409": { description: EMAIL_ALREADY_VERIFIED }
        "429": { description: RESEND_LIMIT }
  /api/auth/me/notification-preferences:
    get:
      summary: >
        US-38 (PRD-NOTI-1, NOTI-4) — tuỳ chọn email theo nhóm (marketing tắt mặc định) và giờ yên tĩnh 22:00–07:00 (theo
        múi giờ trong hồ sơ). Email bảo mật và kết quả xét duyệt mentor không tắt được.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    put:
      summary: US-38 — lưu tuỳ chọn (thay toàn bộ).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests, sessions, messages, reviews, marketing, quietHours]
              properties:
                requests: { type: boolean }
                sessions: { type: boolean }
                messages: { type: boolean }
                reviews: { type: boolean }
                marketing: { type: boolean }
                quietHours: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
  /internal/notifications/email:
    post:
      summary: >
        US-38 (PRD-AUTH-2, NOTI-2) — nội bộ (X-Internal-Token): mentoring-service gửi các sự kiện có ✉ (yêu cầu mới / được
        chấp nhận / hết hạn; phiên xác nhận / huỷ / đề xuất dời lịch / nhắc 24 h và 1 h / xác nhận tham dự; tin nhắn chưa đọc
        gộp sau 30 phút; kết quả xét duyệt mentor). auth-service áp tuỳ chọn nhóm (tắt → SKIPPED) và giờ yên tĩnh (hoãn
        tới 07:00, trừ nhắc lịch của phiên bắt đầu trong khung giờ đó), ghi email_outbox; job 30 giây gửi qua EmailSender
        (log, hoặc SMTP/Mailpit khi EMAIL_MODE=smtp), lỗi thử lại tối đa 5 lần.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, category, type, title]
              properties:
                userId: { type: string, format: uuid }
                category: { type: string, enum: [REQUESTS, SESSIONS, MESSAGES, REVIEWS, MARKETING, ACCOUNT, SECURITY] }
                type: { type: string, example: SESSION_REMINDER_24H }
                title: { type: string }
                message: { type: string }
                link: { type: string, description: Đường dẫn tương đối của frontend }
                sessionStartAt: { type: string, format: date-time, nullable: true, description: Chỉ nhắc lịch }
                dedupeKey: { type: string, nullable: true, description: Cùng khoá → không xếp email lần nữa }
      responses:
        "202":
          description: Đã nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid, nullable: true }
                  status: { type: string, enum: [PENDING, SKIPPED, DUPLICATE] }
                  sendAfter: { type: string, format: date-time, nullable: true }
                  skipReason: { type: string, nullable: true, enum: [PREFERENCE_OFF, ACCOUNT_LOCKED] }
        "404": { description: USER_NOT_FOUND }
  /internal/dev/email-outbox:
    get:
      summary: (Chỉ dev/e2e, không có ở profile prod) US-38 — 50 email thông báo gần nhất của một người trong hàng đợi.
      security: [{ internalToken: [] }]
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "[{ id, category, type, subject, status, skipReason, sendAfter, sentAt, createdAt }]" }
  /internal/dev/jobs/email-outbox:
    post:
      summary: (Chỉ dev/e2e) US-38 — gửi ngay các email tới hạn.
      security: [{ internalToken: [] }]
      responses:
        "200": { description: "{ sent }" }
