openapi: 3.0.3
info:
  title: auth-service
  version: 0.1.0
  description: Đăng ký, đăng nhập, quản lý session/JWT. Sở hữu bởi Quang.
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }

  /api/auth/register:
    post:
      summary: Đăng ký tài khoản (mentor hoặc mentee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [MENTOR, MENTEE] }
      responses:
        "201":
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/verify-token:
    post:
      summary: >
        Xác thực JWT — được các service khác gọi nội bộ để xác minh
        request có hợp lệ không (ví dụ profile-service, mentoring-service).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Token hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  userId: { type: string, format: uuid }
                  role: { type: string, enum: [MENTOR, MENTEE, ADMIN] }

components:
  schemas:
    AuthResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [MENTOR, MENTEE] }
        accessToken: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
