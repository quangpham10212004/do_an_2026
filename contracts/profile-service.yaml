openapi: 3.0.3
info:
  title: profile-service
  version: 1.0.0
  description: >
    Career profile của mentor/mentee, lịch rảnh và trạng thái xác thực mentor. Sở hữu bởi Thảo.
    Service này KHÔNG sở hữu embedding: vector, hash text nguồn và trạng thái chỉ mục thuộc về
    matching-service (matching_db). Sau khi lưu hồ sơ, profile-service chỉ báo
    POST /internal/embeddings/reindex sang matching-service theo kiểu bắn-rồi-quên và không chờ
    kết quả; trạng thái chỉ mục tra ở GET /api/matching/index-status.
    Endpoint /internal/* yêu cầu header X-Internal-Token; còn lại yêu cầu JWT.
servers:
  - url: http://localhost:8082
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AvailabilitySlot:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: "ISO-8601: 1 = Thứ Hai … 7 = Chủ Nhật" }
        startTime: { type: string, example: "19:00" }
        endTime: { type: string, example: "21:00" }
    AvailabilityException:
      type: object
      description: >
        US-07 (PRD-PROF-4) — ngoại lệ lịch rảnh trong một ngày cụ thể, giờ theo múi giờ của mentor.
        startTime = endTime = null nghĩa là nghỉ cả ngày.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        date: { type: string, format: date, example: "2026-10-20" }
        startTime: { type: string, nullable: true, example: "09:00", description: "HH:mm; null = cả ngày" }
        endTime: { type: string, nullable: true, example: "12:00", description: "HH:mm; null = cả ngày" }
        reason: { type: string, nullable: true, maxLength: 300 }
    AvailabilityExceptionInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date, description: "Từ hôm nay (giờ mentor) tới tối đa 365 ngày tới" }
        startTime: { type: string, nullable: true, example: "09:00", description: "Nhập cả hai giờ, hoặc bỏ trống cả hai (cả ngày)" }
        endTime: { type: string, nullable: true, example: "12:00" }
        reason: { type: string, nullable: true, maxLength: 300 }
    AvailabilityExceptionResult:
      type: object
      properties:
        exception: { $ref: "#/components/schemas/AvailabilityException" }
        warning:
          type: string
          nullable: true
          description: >
            Lưu thành công nhưng mentor cần tự kiểm tra. Hiện LUÔN có giá trị: profile-service không
            xem được phiên của mentoring-service nên không kiểm tra trùng với phiên CONFIRMED; phiên đã
            xác nhận không bị tự huỷ. mentoring-service tôn trọng ngoại lệ cho các lần đặt lịch MỚI.
    SessionType:
      type: string
      enum: [CAREER_ADVICE, CODE_REVIEW, MOCK_INTERVIEW, PROJECT_GUIDANCE]
    BookingSettingsInput:
      type: object
      required: [bufferMinutes, minNoticeHours, languages, sessionTypes]
      description: US-04 — thay toàn bộ cài đặt đặt lịch
      properties:
        meetingLink:
          type: string
          nullable: true
          maxLength: 500
          description: "null/rỗng = xoá. Bắt buộc https, host meet.google.com | zoom.us | *.zoom.us | teams.microsoft.com, không kèm user:password"
        bufferMinutes: { type: integer, enum: [0, 15, 30] }
        minNoticeHours: { type: integer, minimum: 1, maximum: 72 }
        languages: { type: array, minItems: 1, items: { type: string, enum: [vi, en] } }
        sessionTypes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/SessionType" } }
        timezone: { type: string, nullable: true, description: "Múi giờ IANA dạng vùng; null = Asia/Ho_Chi_Minh" }
    MentorStatus:
      type: string
      enum: [ACCEPTING, PAUSED, ON_LEAVE, SUSPENDED]
      description: >
        US-08 (PRD-PROF-5). Trạng thái HIỆU LỰC: ON_LEAVE tự về ACCEPTING sau ngày onLeaveUntil (tính khi
        đọc + job ghi lại DB mỗi 10 phút). Chỉ ACCEPTING được gợi ý trong AI Matching và nhận yêu cầu mới.
        SUSPENDED chỉ đặt/gỡ bởi ADMIN (US-27) hoặc mentoring-service (PUT /internal/mentor/{id}/status).
    MentorProfileInput:
      type: object
      required: [displayName, skills, domain, bio]
      properties:
        displayName: { type: string, maxLength: 100 }
        skills: { type: array, minItems: 1, maxItems: 30, items: { type: string } }
        domain: { type: string, description: "backend | frontend | fullstack | devops | data | mobile …" }
        bio: { type: string, maxLength: 3000 }
        yearsExperience: { type: integer, minimum: 0, maximum: 60 }
        cvFileUrl: { type: string, nullable: true }
        portfolioLinks: { type: array, items: { type: string } }
        hourlyRate: { type: number, description: "VNĐ/giờ, 0 = miễn phí" }
        capacity: { type: integer, minimum: 1, maximum: 50, description: Số mentee tối đa cùng lúc }
        isAvailable:
          type: boolean
          deprecated: true
          description: >
            US-08: thay bằng PUT /api/profile/mentor/{userId}/status. Vẫn nhận để tương thích:
            true → ACCEPTING, false → PAUSED; bỏ qua nếu trùng trạng thái hiện tại hoặc mentor đang SUSPENDED.
        headline: { type: string, maxLength: 80, nullable: true, description: "US-37 — câu giới thiệu ngắn; bỏ qua/null = giữ nguyên, chuỗi rỗng = xoá" }
    Completeness:
      type: object
      description: >
        US-37 (PRD-PROF-1) — điểm hoàn thiện hồ sơ 0–100. Mentee: domain 15, level 10, ≥ 3 kỹ năng 20, goal ≥ 80 ký tự 30,
        CV hoặc portfolio 15, lịch mong muốn (preferredDays hoặc preferredTimeOfDay) 10. Mentor: bio ≥ 150 ký tự 20,
        ≥ 3 kỹ năng 15, số năm KN > 0 10, có lịch rảnh 25, hourlyRate > 0 10, portfolio 10, ảnh đại diện 10.
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: goal }
              label: { type: string }
              weight: { type: integer }
              done: { type: boolean }
    MentorProfile:
      allOf:
        - $ref: "#/components/schemas/MentorProfileInput"
        - type: object
          properties:
            userId: { type: string, format: uuid }
            activeMenteeCount: { type: integer, description: Đồng bộ từ mentoring-service }
            rating: { type: number, format: float }
            ratingCount: { type: integer }
            verificationStatus: { type: string, enum: [PENDING_INTERVIEW, PENDING_REVIEW, APPROVED, REJECTED] }
            isAvailable: { type: boolean, description: "Chỉ đọc — = (status == ACCEPTING). Giữ cho bên gọi cũ." }
            status: { $ref: "#/components/schemas/MentorStatus" }
            onLeaveUntil: { type: string, format: date, nullable: true, description: "Chỉ có khi status = ON_LEAVE (nghỉ đến hết ngày này, giờ mentor)" }
            statusReason: { type: string, nullable: true, description: Lý do của lần đổi trạng thái gần nhất (vd. lý do đình chỉ) }
            meetingLink:
              type: string
              nullable: true
              description: >
                US-04 — chỉ trả cho chủ hồ sơ, ADMIN và /internal/** (mentoring-service); người khác nhận null.
            bufferMinutes: { type: integer, enum: [0, 15, 30], description: "US-04 — nghỉ giữa 2 phiên (mặc định 15)" }
            minNoticeHours: { type: integer, minimum: 1, maximum: 72, description: "US-04 — đặt trước tối thiểu (mặc định 12)" }
            languages: { type: array, items: { type: string, enum: [vi, en] }, description: "US-04 — mặc định [vi]" }
            sessionTypes:
              type: array
              description: US-04 — mặc định cả 4 loại
              items: { $ref: "#/components/schemas/SessionType" }
            timezone: { type: string, example: Asia/Ho_Chi_Minh, description: "US-04 — múi giờ IANA; lịch rảnh, ngoại lệ, nghỉ phép tính theo múi giờ này" }
            availability: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
            exceptions:
              type: array
              description: US-07 — ngoại lệ lịch rảnh từ hôm nay (giờ mentor) tới 60 ngày tới (gồm hôm nay)
              items: { $ref: "#/components/schemas/AvailabilityException" }
            avatarUrl: { type: string, nullable: true, description: "US-37 — /api/profile/avatars/{userId}?v=<mốc cập nhật>; null = chưa có ảnh" }
            completeness:
              nullable: true
              description: US-37 — chỉ chủ hồ sơ/admin/nội bộ; người xem khác nhận null
              allOf: [{ $ref: "#/components/schemas/Completeness" }]
            medianResponseHours:
              type: number
              nullable: true
              description: "US-35 (PRD-MATCH-9) — trung vị thời gian phản hồi yêu cầu (giờ) do mentoring-service đồng bộ; 9999 = đa số không phản hồi; null = chưa có dữ liệu"
    MenteeProfileInput:
      type: object
      required: [displayName, goal, domain]
      properties:
        displayName: { type: string }
        goal: { type: string, maxLength: 3000 }
        domain: { type: string }
        currentLevel: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        skills: { type: array, items: { type: string } }
        portfolioLinks: { type: array, items: { type: string } }
        cvFileUrl: { type: string, nullable: true }
    MenteePreferences:
      type: object
      description: >
        US-16 (PRD-PROF-2) — sở thích tìm mentor. matching-service đọc thẳng các cột này (read-only) và
        dùng làm giá trị mặc định cho bộ lọc GET /api/matching/mentors khi request không truyền (US-17).
        Thay toàn bộ: trường bỏ trống/null nghĩa là "không giới hạn".
      properties:
        preferredDays:
          type: array
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
          description: "ISO-8601: 1 = Thứ Hai ... 7 = Chủ Nhật; trả về tăng dần, không trùng. Rỗng = mọi ngày"
        preferredTimeOfDay:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
          nullable: true
          description: "MORNING 06–12, AFTERNOON 12–18, EVENING 18–23; null = giờ nào cũng được"
        budgetMaxPerHour:
          type: number
          minimum: 0
          maximum: 100000000
          nullable: true
          description: "VND / giờ; null = không giới hạn; 0 = chỉ mentor miễn phí"
        languages:
          type: array
          maxItems: 5
          items: { type: string, enum: [vi, en] }
          description: Rỗng = ngôn ngữ nào cũng được
    MenteeProfile:
      allOf:
        - $ref: "#/components/schemas/MenteeProfileInput"
        - $ref: "#/components/schemas/MenteePreferences"
        - type: object
          properties:
            userId: { type: string, format: uuid }
            timezone: { type: string, example: Asia/Ho_Chi_Minh, description: "US-37 (PRD-PROF-6) — múi giờ IANA" }
            avatarUrl: { type: string, nullable: true }
            completeness: { $ref: "#/components/schemas/Completeness" }
            matchingEnabled: { type: boolean, description: "US-37 — completeness.score ≥ 50 (nút AI Matching)" }
    MentorCard:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        domain: { type: string }
        skills: { type: array, items: { type: string } }
        yearsExperience: { type: integer }
        rating: { type: number }
        ratingCount: { type: integer }
        hourlyRate: { type: number }
        isAvailable: { type: boolean, description: "= (status == ACCEPTING)" }
        hasCapacity: { type: boolean }
        verificationStatus: { type: string }
        status: { $ref: "#/components/schemas/MentorStatus" }
        onLeaveUntil: { type: string, format: date, nullable: true }
        headline: { type: string, nullable: true, description: US-37 }
        avatarUrl: { type: string, nullable: true, description: US-37 }
    AdminMentorRow:
      type: object
      description: US-27 — một dòng của trang /admin/mentors (status = trạng thái hiệu lực)
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        domain: { type: string }
        verificationStatus: { type: string, enum: [PENDING_INTERVIEW, PENDING_REVIEW, APPROVED, REJECTED] }
        status: { $ref: "#/components/schemas/MentorStatus" }
        onLeaveUntil: { type: string, format: date, nullable: true }
        suspendedReason: { type: string, nullable: true }
        suspendedAt: { type: string, format: date-time, nullable: true }
        suspendedBy: { type: string, format: uuid, nullable: true, description: "Admin thực hiện; null = hệ thống (tranh chấp)" }
        rating: { type: number }
        ratingCount: { type: integer }
        activeMenteeCount: { type: integer }
        capacity: { type: integer }
    SuspensionResult:
      type: object
      properties:
        mentor: { $ref: "#/components/schemas/AdminMentorRow" }
        mentoringNotified:
          type: boolean
          description: >
            true khi mentoring-service đã nhận POST /internal/mentors/{id}/suspend (huỷ phiên tương lai). false khi
            endpoint chưa có (404) / lỗi — đình chỉ vẫn có hiệu lực ở profile-service; luôn false với unsuspend.
        cancelledSessions: { type: integer, nullable: true, description: "Số phiên mentoring-service đã huỷ (null nếu không rõ)" }
        warning: { type: string, nullable: true }
    ProfileSummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [MENTOR, MENTEE] }
        domain: { type: string }
        timezone: { type: string, example: Asia/Ho_Chi_Minh, description: "US-37 — mentoring-service dùng cho nhắc lịch (US-34) và giờ địa phương của bên kia" }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }

  /api/profile/mentors:
    get:
      summary: Duyệt danh sách mentor đã xác thực (không dùng AI) — admin có thể xem cả mentor chưa duyệt
      parameters:
        - { name: domain, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: includeUnverified, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 12 } }
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MentorCard" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }

  /api/profile/mentor/{userId}:
    get:
      summary: Lấy hồ sơ mentor (kèm lịch rảnh)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: >
            OK. Người xem không phải chủ hồ sơ/ADMIN: không có meetingLink, và khi status = SUSPENDED thì
            statusReason = null (lý do đình chỉ US-27 không công khai).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }
        "404": { description: PROFILE_NOT_FOUND }
    put:
      summary: >
        FR-2.4/FR-2.5 Tạo/cập nhật hồ sơ mentor (chủ hồ sơ hoặc ADMIN). Sau khi lưu, báo
        matching-service lập lại chỉ mục embedding (bắn rồi quên, không ảnh hưởng phản hồi này).
        Trạng thái chỉ mục tra ở GET /api/matching/index-status.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MentorProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }
        "403": { description: Không phải chủ hồ sơ / không phải MENTOR }

  /api/profile/mentor/{userId}/booking-settings:
    put:
      summary: US-04 Cập nhật link họp + cài đặt đặt lịch (chủ hồ sơ MENTOR hoặc ADMIN)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingSettingsInput" }
      responses:
        "200":
          description: Hồ sơ sau khi lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }
        "400": { description: "INVALID_MEETING_LINK · INVALID_BOOKING_SETTINGS · INVALID_TIMEZONE · VALIDATION_ERROR" }

  /api/profile/mentor/{userId}/status:
    put:
      summary: >
        US-08 Mentor đổi trạng thái nhận mentee (chủ hồ sơ MENTOR hoặc ADMIN). Không đặt/gỡ được SUSPENDED
        qua endpoint này (dùng /api/profile/admin/mentors/{id}/suspend|unsuspend).
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTING, PAUSED, ON_LEAVE] }
                onLeaveUntil: { type: string, format: date, description: "Bắt buộc khi ON_LEAVE; từ hôm nay tới tối đa 365 ngày" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Hồ sơ sau khi đổi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }
        "400": { description: "VALIDATION_ERROR (status = SUSPENDED/khác) · INVALID_STATUS (thiếu/sai onLeaveUntil)" }
        "409": { description: MENTOR_SUSPENDED — mentor đang bị đình chỉ }

  # ---------------- US-27 (PRD-ADM-3): admin đình chỉ mentor ----------------
  /api/profile/admin/mentors:
    get:
      summary: US-27 ADMIN — danh sách mentor (mọi trạng thái xác thực) kèm trạng thái đình chỉ
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Tìm theo tên hiển thị hoặc lĩnh vực" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MentorStatus" } }
        - { name: verification, in: query, schema: { type: string, enum: [PENDING_INTERVIEW, PENDING_REVIEW, APPROVED, REJECTED] } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminMentorRow" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
        "400": { description: BAD_REQUEST (status/verification không hợp lệ) }
        "403": { description: Không phải ADMIN }

  /api/profile/admin/mentors/{userId}/suspend:
    post:
      summary: >
        US-27 ADMIN — đình chỉ mentor: status = SUSPENDED (+ suspendedReason/At/By). Tách khỏi khoá tài khoản —
        mentor vẫn đăng nhập được. Matching loại mentor khỏi gợi ý và similar-mentors; mentoring-service từ chối
        yêu cầu/đặt lịch mới. Sau khi lưu, gọi mentoring-service POST /internal/mentors/{id}/suspend (huỷ phiên
        PENDING/CONFIRMED tương lai, hoàn 100%) — lỗi/404 chỉ báo qua mentoringNotified=false + warning.
        Ghi audit MENTOR_SUSPENDED (auth-service POST /internal/audit, bắn rồi quên).
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500, description: "Đếm sau khi trim" }
      responses:
        "200":
          description: Đã đình chỉ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuspensionResult" }
        "400": { description: INVALID_SUSPEND_REASON · VALIDATION_ERROR }
        "403": { description: Không phải ADMIN }
        "404": { description: PROFILE_NOT_FOUND }
        "409": { description: MENTOR_ALREADY_SUSPENDED }

  /api/profile/admin/mentors/{userId}/unsuspend:
    post:
      summary: >
        US-27 ADMIN — gỡ đình chỉ: status = ACCEPTING, xoá suspendedReason/At/By. Không gọi mentoring-service
        (phiên đã huỷ không khôi phục). Ghi audit MENTOR_UNSUSPENDED.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Đã gỡ đình chỉ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuspensionResult" }
        "403": { description: Không phải ADMIN }
        "404": { description: PROFILE_NOT_FOUND }
        "409": { description: MENTOR_NOT_SUSPENDED }

  /api/profile/mentor/{userId}/availability:
    get:
      summary: Lịch rảnh hằng tuần của mentor
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
    put:
      summary: FR-2.4 Thay toàn bộ lịch rảnh (các khung trong cùng ngày không được chồng lấn)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
      responses:
        "200":
          description: Lịch rảnh sau khi lưu
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvailabilitySlot" } }
        "400": { description: INVALID_SLOT / OVERLAPPING_SLOTS }

  /api/profile/mentor/{userId}/exceptions:
    get:
      summary: US-07 Ngoại lệ lịch rảnh chưa qua của mentor (người dùng đã đăng nhập)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Theo ngày tăng dần; trong cùng ngày, nghỉ cả ngày đứng trước
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvailabilityException" } }
        "404": { description: PROFILE_NOT_FOUND }
    post:
      summary: US-07 Thêm ngoại lệ (chủ hồ sơ MENTOR hoặc ADMIN)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityExceptionInput" }
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityExceptionResult" }
        "400": { description: "INVALID_EXCEPTION (ngày đã qua / quá 1 năm / chỉ nhập 1 giờ) · INVALID_SLOT · TOO_MANY_EXCEPTIONS (tối đa 100 ngoại lệ sắp tới)" }
        "409": { description: OVERLAPPING_EXCEPTION — trùng ngoại lệ khác trong cùng ngày }

  /api/profile/mentor/{userId}/exceptions/{exceptionId}:
    put:
      summary: US-07 Sửa ngoại lệ (chủ hồ sơ hoặc ADMIN) — không sửa được ngoại lệ của ngày đã qua
      parameters:
        - $ref: "#/components/parameters/UserId"
        - { name: exceptionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityExceptionInput" }
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityExceptionResult" }
        "400": { description: INVALID_EXCEPTION / INVALID_SLOT }
        "404": { description: EXCEPTION_NOT_FOUND }
        "409": { description: OVERLAPPING_EXCEPTION }
    delete:
      summary: US-07 Xoá ngoại lệ (chủ hồ sơ hoặc ADMIN)
      parameters:
        - $ref: "#/components/parameters/UserId"
        - { name: exceptionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Đã xoá }
        "404": { description: EXCEPTION_NOT_FOUND }

  /api/profile/mentee/{userId}:
    get:
      summary: Lấy hồ sơ mentee (mentee chỉ xem được hồ sơ của chính mình; mentor/admin xem được)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenteeProfile" }
        "404": { description: PROFILE_NOT_FOUND }
    put:
      summary: >
        FR-2.1 → FR-2.3, FR-2.5 Tạo/cập nhật hồ sơ mentee. Sau khi lưu, báo matching-service
        lập lại chỉ mục embedding (bắn rồi quên).
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenteeProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenteeProfile" }

  /api/profile/mentee/{userId}/preferences:
    put:
      summary: >
        US-16 (PRD-PROF-2) — mentee lưu sở thích tìm mentor (ngày, buổi, ngân sách, ngôn ngữ), thay toàn bộ.
        Chỉ chính mentee (hoặc ADMIN). Không thuộc văn bản embedding nên không báo matching-service lập chỉ mục.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenteePreferences" }
      responses:
        "200":
          description: Hồ sơ mentee sau khi cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenteeProfile" }
        "400": { description: "INVALID_PREFERENCES — ngày ngoài 1–7, buổi/ngôn ngữ không hợp lệ, ngân sách âm hoặc > 100.000.000" }
        "403": { description: FORBIDDEN — không phải chính mentee }
        "404": { description: PROFILE_NOT_FOUND — mentee chưa tạo hồ sơ }

  /api/profile/mentee/{userId}/enrichment-chat:
    post:
      summary: >
        FR-8.5 Nhận goal đã được chatbot enrichment tổng hợp (mentoring-service gọi bằng
        X-Internal-Token, hoặc chính mentee), ghi đè goal và gộp kỹ năng trích từ CV; matching-service
        lập lại chỉ mục embedding sau đó.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      security: [{ bearerAuth: [] }, { internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrichedGoalText]
              properties:
                enrichedGoalText: { type: string, maxLength: 3000 }
                cvSkills: { type: array, items: { type: string } }
                cvFileUrl: { type: string }
      responses:
        "200":
          description: Hồ sơ sau khi cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenteeProfile" }

  /api/profile/{userId}/timezone:
    put:
      summary: >
        US-37 (PRD-PROF-6) — đổi múi giờ của chính mình (mentor và/hoặc mentee của userId). Mọi giờ lưu UTC, hiển thị theo
        múi giờ người xem. Với mentor, lịch rảnh/ngoại lệ/nghỉ phép cũng tính theo múi giờ này (giống booking-settings).
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string, example: Europe/Paris }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSummary" }
        "400": { description: INVALID_TIMEZONE }
        "403": { description: FORBIDDEN }
        "404": { description: PROFILE_NOT_FOUND }
  /api/profile/{userId}/avatar:
    put:
      summary: US-37 (PRD-PROF-3) — tải ảnh đại diện JPG/PNG ≤ 2 MB (kiểm tra theo chữ ký file), thay ảnh cũ.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { avatarUrl: { type: string } } }
        "400": { description: INVALID_AVATAR · AVATAR_TOO_LARGE }
        "403": { description: FORBIDDEN }
        "404": { description: PROFILE_NOT_FOUND }
    delete:
      summary: US-37 — xoá ảnh đại diện.
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "204": { description: Đã xoá }
  /api/profile/avatars/{userId}:
    get:
      summary: US-37 — ảnh đại diện (CÔNG KHAI, không cần token — dùng cho thẻ img). Cache-Control public 30 ngày (URL có ?v=).
      security: []
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: image/jpeg | image/png
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: AVATAR_NOT_FOUND }
  /internal/mentor/{userId}/response-time:
    put:
      summary: >
        US-35 — mentoring-service đồng bộ trung vị thời gian phản hồi yêu cầu (≤ 20 yêu cầu gần nhất trong 180 ngày; hết
        hạn = không phản hồi). matching-service đọc cột median_response_hours để tính responsiveness.
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleSize]
              properties:
                medianResponseHours: { type: number, nullable: true, minimum: 0 }
                sampleSize: { type: integer, minimum: 0 }
      responses:
        "204": { description: Đã cập nhật }
        "404": { description: PROFILE_NOT_FOUND }
  /internal/profile-summary/{userId}:
    get:
      summary: Nội bộ — tóm tắt hồ sơ
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSummary" }
        "404": { description: PROFILE_NOT_FOUND }

  /internal/mentee/{userId}:
    get:
      summary: Nội bộ — hồ sơ mentee cho mentoring-service (mentor xét yêu cầu, US-14)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenteeProfile" }
        "404": { description: PROFILE_NOT_FOUND }

  /internal/mentor/{userId}:
    get:
      summary: >
        Nội bộ (interface 1) — hồ sơ mentor đầy đủ cho mentoring-service. Ngoài các trường cũ (giữ nguyên) có:
        status (hiệu lực), onLeaveUntil, bufferMinutes, minNoticeHours, meetingLink, timezone, languages,
        sessionTypes và exceptions (ngoại lệ từ hôm nay tới 60 ngày tới, giờ "HH:mm" theo timezone của mentor;
        startTime/endTime null = nghỉ cả ngày). mentoring-service phải chặn đặt lịch mới rơi vào exceptions
        và chỉ nhận yêu cầu mới khi status = ACCEPTING.
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }

  /internal/mentor/{userId}/verification:
    put:
      summary: Nội bộ — cập nhật trạng thái xác thực (mentoring-service gọi sau AI Interview / admin review)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING_INTERVIEW, PENDING_REVIEW, APPROVED, REJECTED] }
      responses:
        "200": { description: Hồ sơ mentor sau cập nhật }

  /internal/mentor/{userId}/status:
    put:
      summary: >
        Nội bộ (interface 2) — mentoring-service đặt trạng thái mentor: PAUSED sau 3 lần vi phạm,
        SUSPENDED khi tranh chấp, ACCEPTING để gỡ (gỡ được cả SUSPENDED). profile-service KHÔNG gọi lại
        mentoring-service ở luồng này và không ghi audit (bên gọi tự chịu trách nhiệm).
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PAUSED, SUSPENDED, ACCEPTING] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Hồ sơ mentor sau cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorProfile" }
        "400": { description: VALIDATION_ERROR }
        "404": { description: PROFILE_NOT_FOUND }

  /internal/mentor/{userId}/rating:
    put:
      summary: Nội bộ — đồng bộ điểm đánh giá trung bình
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, ratingCount]
              properties:
                rating: { type: number, minimum: 0, maximum: 5 }
                ratingCount: { type: integer, minimum: 0 }
      responses:
        "204": { description: OK }

  /internal/mentor/{userId}/active-mentees:
    put:
      summary: Nội bộ — đồng bộ số mentee đang hướng dẫn (dùng cho lọc sức chứa)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activeMenteeCount]
              properties:
                activeMenteeCount: { type: integer, minimum: 0 }
      responses:
        "204": { description: OK }
  /internal/mentee/{menteeId}/skills/remove:
    post:
      summary: Nội bộ — US-45 (PRD-CV-6) gỡ kỹ năng đã thêm từ một CV bị xoá (ai-service gọi khi removeSkills=true)
      description: >-
        So khớp không phân biệt hoa thường; kỹ năng không có trên hồ sơ bị bỏ qua. Có thay đổi => báo matching-service
        lập lại chỉ mục mentee.
      security: [{ internalToken: [] }]
      parameters:
        - { name: menteeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              properties:
                skills: { type: array, maxItems: 30, items: { type: string, maxLength: 50 } }
      responses:
        "200": { description: Hồ sơ mentee sau khi gỡ }
        "404": { description: PROFILE_NOT_FOUND }
  /internal/profile/{userId}/cv-file:
    delete:
      summary: Nội bộ — gỡ tham chiếu CV đã bị xoá khỏi hồ sơ (ai-service gọi sau DELETE /api/ai/cv/{id})
      description: >-
        Đặt cv_file_url = NULL trên hồ sơ mentor hoặc mentee của userId, CHỈ KHI giá trị hiện tại đúng bằng
        cvFileUrl truyền vào (không ghi đè CV khác mà người dùng đã gắn sau đó). Idempotent: không có hồ sơ
        hoặc không khớp thì vẫn trả 204. cv_file_url không thuộc text embedding nên không cần lập lại chỉ mục.
      security: [{ internalToken: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - { name: cvFileUrl, in: query, required: true, schema: { type: string, example: "/api/ai/cv/3f0c.../file" } }
      responses:
        "204": { description: OK (đã gỡ hoặc không có gì để gỡ) }
        "400": { description: BAD_REQUEST (thiếu cvFileUrl) }
