openapi: 3.0.3
info:
  title: profile-service
  version: 0.1.0
  description: >
    Quản lý career profile của mentor/mentee, bao gồm việc sinh và lưu
    embedding vector (gọi sang matching-service). Sở hữu bởi Thảo.
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /api/profile/mentor/{userId}:
    get:
      summary: Lấy career profile của 1 mentor
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Profile mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
    put:
      summary: >
        Tạo/cập nhật profile mentor. Sau khi lưu, service tự động gọi
        matching-service (POST /internal/embed) để sinh embedding mới
        và lưu vào cột embedding — client không cần biết bước này.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileInput"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"

  /api/profile/mentee/{userId}:
    get:
      summary: Lấy career profile của 1 mentee
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Profile mentee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenteeProfile"
    put:
      summary: Tạo/cập nhật profile mentee (kích hoạt sinh embedding tương tự mentor)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenteeProfileInput"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenteeProfile"

  /api/profile/mentee/{userId}/enrichment-chat:
    post:
      summary: >
        [Sở hữu bởi Thắng, logic đặt ở mentoring-service, gọi API này để
        đọc/ghi profile] Nhận kết quả tổng hợp từ bước "chatbot enrichment"
        (đã hỏi thêm mentee dựa trên CV) và merge vào goal/description của
        mentee profile, sau đó kích hoạt sinh lại embedding.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrichedGoalText]
              properties:
                enrichedGoalText:
                  type: string
                  description: Đoạn text đã được chatbot tổng hợp từ hội thoại
      responses:
        "200":
          description: Đã cập nhật goal và re-embed

  /internal/profile-summary/{userId}:
    get:
      summary: >
        Nội bộ — trả về bản tóm tắt profile (KHÔNG bao gồm embedding thô)
        cho các service khác cần hiển thị thông tin cơ bản (ví dụ
        mentoring-service khi tạo session).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Tóm tắt profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    MentorProfileInput:
      type: object
      required: [skills, domain, bio]
      properties:
        skills: { type: array, items: { type: string } }
        domain: { type: string }
        bio: { type: string }
        yearsExperience: { type: integer }
        cvFileUrl: { type: string, nullable: true }

    MentorProfile:
      allOf:
        - $ref: "#/components/schemas/MentorProfileInput"
        - type: object
          properties:
            userId: { type: string, format: uuid }
            capacity: { type: integer, description: "Số slot mentee còn nhận" }
            isAvailable: { type: boolean }
            rating: { type: number, format: float }
            embeddingUpdatedAt: { type: string, format: date-time }

    MenteeProfileInput:
      type: object
      required: [goal, domain]
      properties:
        goal: { type: string }
        domain: { type: string }
        currentLevel: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        cvFileUrl: { type: string, nullable: true }

    MenteeProfile:
      allOf:
        - $ref: "#/components/schemas/MenteeProfileInput"
        - type: object
          properties:
            userId: { type: string, format: uuid }
            embeddingUpdatedAt: { type: string, format: date-time }

    ProfileSummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [MENTOR, MENTEE] }
        domain: { type: string }
