server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý (src/main/resources/db/migration), không để Hibernate tự sinh
      ddl-auto: none
  flyway:
    # V1__baseline.sql = db/init/<service>.sql. Volume tạo bằng db/init đã có bảng nhưng chưa có
    # flyway_schema_history => Flyway đánh dấu baseline V1 rồi chạy tiếp V2+ (deployment-guide.md §8).
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: /api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/verify-email,/api/auth/verify-token,/api/auth/forgot-password,/api/auth/reset-password
  jwt:
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
  login-protection:
    max-failed-attempts: 5
    block-duration: PT15M
  # Demo không có SMTP: link xác thực email được ghi log; bật cờ này để trả
  # token xác thực trong response đăng ký (chỉ dùng cho môi trường demo).
  expose-verification-token: ${EXPOSE_VERIFICATION_TOKEN:true}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@mmp.local}
    password: ${ADMIN_PASSWORD:Admin@123}
  services:
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  # US-30 (PRD-ADM-5): nhật ký kiểm toán giữ 2 năm; job xoá dòng cũ chạy 03:30 mỗi ngày (giờ Việt Nam).
  audit:
    retention: ${AUDIT_RETENTION:P730D}
    retention-cron: ${AUDIT_RETENTION_CRON:0 30 3 * * *}
