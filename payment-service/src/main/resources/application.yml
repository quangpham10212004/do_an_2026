server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  # US-11 — Flyway quản lý schema. V1__baseline.sql = db/init/<service>.sql (CSDL đã khởi tạo bằng
  # docker-entrypoint-initdb.d được baseline ở version 1); mọi thay đổi schema là V2+.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

management:
  # US-46: nhãn service trên mọi metric của GET /metrics
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
    public-paths: "/api/payment/momo/ipn,/api/payment/vnpay/ipn"   # US-56 — cổng gọi server → server, không có JWT (bảo vệ bằng chữ ký)
  services:
    mentoring-url: ${MENTORING_SERVICE_URL:http://localhost:8083}
    profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}   # US-42 — tên trên biên lai
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}     # US-30 — POST /internal/audit (bắn-rồi-quên)
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  payment:                         # US-13
    platform-fee-rate: ${PLATFORM_FEE_RATE:0.15}   # phí nền tảng chốt vào giao dịch lúc charge (fee, mentor_earning)
    idempotency-ttl: PT24H         # Idempotency-Key của /charge có hiệu lực 24 giờ / người gọi
    direct-session-payment: ${DIRECT_SESSION_PAYMENT:false}   # v2.0: học phí chỉ trả từ ví; true = bật lại /charge và /checkout (chỉ dev)
    gateway: ${PAYMENT_GATEWAY:sandbox}   # US-56 — sandbox (form thẻ test trong tiến trình) | momo | vnpay
    reconcile-after: ${PAYMENT_RECONCILE_AFTER:PT2M}   # PENDING quá mốc này → truy vấn cổng (local không nhận được IPN)
  momo:                            # US-56 — https://developers.momo.vn/v3/docs/payment/api/wallet/onetime/
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    api-url: ${MOMO_API_URL:https://test-payment.momo.vn}
    request-type: ${MOMO_REQUEST_TYPE:payWithMethod}   # trang chọn ví MoMo / thẻ ATM / Visa-Master
    ipn-url: ${MOMO_IPN_URL:}       # trống = FRONTEND_URL/api/payment/momo/ipn (cần URL công khai để MoMo gọi được)
    link-ttl: PT100M               # MoMo giữ link 100 phút (bỏ qua orderExpireTime)
  vnpay:                           # US-56 — https://sandbox.vnpayment.vn/apis/docs/thanh-toan-pay/pay.html
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    link-ttl: PT15M                # vnp_ExpireDate; ngắn hơn thời gian giữ chỗ 30 phút của phiên để kịp thử lại
  wallet:                          # Bản chốt v2.0 §8 — ví VND
    topup-min: ${WALLET_TOPUP_MIN:50000}
    topup-max: ${WALLET_TOPUP_MAX:5000000}
    cash-cap: ${WALLET_CASH_CAP:20000000}           # tiền nạp khả dụng tối đa
    refund-window: ${WALLET_REFUND_WINDOW:P7D}       # hoàn tiền nạp về nguồn trong 7 ngày kể từ lần nạp gần nhất
    refund-requests-per-month: ${WALLET_REFUND_REQUESTS_PER_MONTH:2}
    promo-expiry-months: ${WALLET_PROMO_EXPIRY_MONTHS:12}
    restored-promo-days: 30        # khuyến mãi hoàn lại sau khi lô gốc đã hết hạn → cấp lô mới hạn 30 ngày
    dormant-after-months: ${WALLET_DORMANT_AFTER_MONTHS:12}
  earnings:                        # US-25 — sổ thu nhập mentor
    release-delay: ${EARNING_RELEASE_DELAY:PT72H}   # thu nhập chuyển AVAILABLE sau trạng thái cuối COMPLETED/NO_SHOW_MENTEE (bản chốt v2.0 §9)
    release-interval: PT5M           # chu kỳ job giải phóng
  referral:
    # FR-6.6 — quy tắc cộng điểm & chống gian lận cơ bản
    reward-points: 100
    min-qualifying-amount: 50000
    max-qualified-per-referrer-per-day: 5
