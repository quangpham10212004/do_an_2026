name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  java-services:
    name: Build & unit test (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, learning-service, profile-service, mentoring-service, payment-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build & test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B package

  matching-service:
    name: Unit test (matching-service)
    runs-on: ubuntu-latest
    services:
      # Sau R-1 matching-service dùng 2 CSDL: matching_db (chỉ mục embedding, cần pgvector)
      # và profile_db (đọc read-only bằng role matching_reader). Test tests/test_index_db.py
      # tự nạp db/init/*.sql và chạy reconcile() trên Postgres thật — thiếu CSDL trên CI thì FAIL.
      matching-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: matching_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      profile-db:
        image: postgres:16
        env:
          POSTGRES_DB: profile_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (PyTorch CPU)
        working-directory: matching-service
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: matching-service
        env:
          MATCHING_DB_URL: postgresql://postgres:postgres@localhost:5439/matching_db
          PROFILE_DB_URL: postgresql://matching_reader:matching_reader@localhost:5434/profile_db
          PROFILE_DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5434/profile_db
        run: python -m pytest -q -rs tests/

  ai-service:
    name: Unit test (ai-service)
    runs-on: ubuntu-latest
    services:
      # ai-service lưu trạng thái AI Interview / CV enrichment => test chạy trên Postgres thật.
      ai-db:
        image: postgres:16
        env:
          POSTGRES_DB: ai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: ai-service
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ai-service
        env:
          AI_DB_URL: postgresql://postgres:postgres@localhost:5438/ai_db
        run: python -m pytest -q tests/

  frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end acceptance (docker compose)
    needs: [java-services, matching-service, ai-service, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start whole system
        run: docker compose up -d --build --wait
      - name: Seed demo data
        run: python3 scripts/seed_demo.py
      - name: Acceptance test (Definition of Done)
        run: python3 scripts/e2e_acceptance.py
      - name: Intro call (buổi làm quen)
        run: python3 scripts/e2e_intro.py
      - name: Session packages (gói buổi)
        run: python3 scripts/e2e_packages.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
