# Mentor-Mentee Learning Platform — toàn bộ hệ thống chạy bằng: docker compose up --build
# Biến môi trường tuỳ chỉnh đặt trong file .env (xem .env.example).

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 5s
  retries: 20

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
  TZ: Asia/Ho_Chi_Minh

# Object storage (MinIO, API chuẩn S3): service nào lưu file thì nhận biến này. Để trống S3_ENDPOINT_URL => quay về
# cách lưu cũ (đĩa/CSDL). Đổi sang AWS S3 / Cloudflare R2: đặt S3_ENDPOINT_URL (bỏ trống với AWS), khoá và bucket trong .env.
x-storage-env: &storage-env
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-mmp-files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENABLED: ${S3_ENABLED:-false}

services:
  # ---------- Databases ----------
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./db/init/auth-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  profile-db:
    image: postgres:16
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes:
      - profile-db-data:/var/lib/postgresql/data
      - ./db/init/profile-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  mentoring-db:
    image: postgres:16
    environment:
      POSTGRES_DB: mentoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    volumes:
      - mentoring-db-data:/var/lib/postgresql/data
      - ./db/init/mentoring-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5436:5432"]
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      - ./db/init/payment-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  learning-db:
    image: postgres:16
    environment:
      POSTGRES_DB: learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5437:5432"]
    volumes:
      - learning-db-data:/var/lib/postgresql/data
      - ./db/init/learning-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  matching-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5439:5432"]
    volumes:
      - matching-db-data:/var/lib/postgresql/data
      - ./db/init/matching-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  ai-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5438:5432"]
    volumes:
      - ai-db-data:/var/lib/postgresql/data
      - ./db/init/ai-service.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: *db-healthcheck

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ---------- Object storage ----------
  # Console quản trị: http://localhost:9001 (minioadmin / minioadmin). Một bucket, tách theo prefix:
  # cv/ · verification/ (video phỏng vấn, tự xoá sau 61 ngày) · avatars/ · attachments/ · blog-covers/
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-mmp-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        (mc ilm rule add --expire-days 61 --prefix verification/ "local/$$S3_BUCKET" || true)
    restart: "no"

  # ---------- Backend services ----------
  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    environment:
      <<: *common-env
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      REDIS_HOST: redis
      PAYMENT_SERVICE_URL: http://payment-service:8084
      MENTORING_SERVICE_URL: http://mentoring-service:8083
      MATCHING_SERVICE_URL: http://matching-service:8090
      JITSI_HEALTH_URL: ${JITSI_HEALTH_URL:-http://jitsi-web/external_api.js}
      # US-38 — múi giờ người nhận (giờ yên tĩnh); EMAIL_MODE=smtp + `docker compose --profile mail up` để gửi qua Mailpit.
      PROFILE_SERVICE_URL: http://profile-service:8082
      EMAIL_MODE: ${EMAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mmp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      auth-db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck: &java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # US-38 (PRD-AUTH-2) — hộp thư SMTP cho demo (giao diện http://localhost:8025). Chỉ chạy với --profile mail;
  # đặt EMAIL_MODE=smtp cho auth-service để email thật sự đi qua đây (mặc định chỉ ghi log).
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["mail"]
    ports: ["8025:8025", "1025:1025"]

  profile-service:
    build: ./profile-service
    ports: ["8082:8082"]
    environment:
      <<: [*common-env, *storage-env]
      DB_HOST: profile-db
      DB_PORT: 5432
      DB_NAME: profile_db
      AI_SERVICE_URL: http://ai-service:8091
      # Chỉ để báo matching-service lập lại chỉ mục sau khi hồ sơ đổi. Lời gọi là
      # best-effort nên profile-service không phụ thuộc matching-service lúc khởi động.
      MATCHING_SERVICE_URL: http://matching-service:8090
      # US-27 — sau khi admin đình chỉ mentor: huỷ phiên tương lai + ghi audit log (đều best-effort).
      MENTORING_SERVICE_URL: http://mentoring-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      minio-init: { condition: service_completed_successfully }
      profile-db: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]

  mentoring-service:
    build: ./mentoring-service
    ports: ["8083:8083"]
    environment:
      <<: [*common-env, *storage-env]
      DB_HOST: mentoring-db
      DB_PORT: 5432
      DB_NAME: mentoring_db
      PROFILE_SERVICE_URL: http://profile-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      MATCHING_SERVICE_URL: http://matching-service:8090
      AUTH_SERVICE_URL: http://auth-service:8081
      # Bản chốt v2.0 §6 — phòng học Jitsi (bật bằng `docker compose --profile jitsi up`)
      JITSI_PUBLIC_DOMAIN: ${JITSI_PUBLIC_DOMAIN:-localhost:8443}
      JITSI_XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      JITSI_APP_ID: ${JITSI_APP_ID:-mentorhub}
      JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:-dev-only-jitsi-secret-change-me-0123456789abcdef}
    depends_on:
      minio-init: { condition: service_completed_successfully }
      mentoring-db: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]

  payment-service:
    build: ./payment-service
    ports: ["8084:8084"]
    environment:
      <<: *common-env
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      MENTORING_SERVICE_URL: http://mentoring-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PROFILE_SERVICE_URL: http://profile-service:8082
      # US-56 — PAYMENT_GATEWAY=momo | vnpay | sandbox (mặc định, chạy offline). Khoá cổng đặt trong .env.
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-sandbox}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    depends_on:
      payment-db: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]

  learning-service:
    build: ./learning-service
    ports: ["8085:8085"]
    environment:
      <<: [*common-env, *storage-env]
      DB_HOST: learning-db
      DB_PORT: 5432
      DB_NAME: learning_db
      PROFILE_SERVICE_URL: http://profile-service:8082   # tên hiển thị tác giả blog
    depends_on:
      minio-init: { condition: service_completed_successfully }
      learning-db: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]

  matching-service:
    build:
      context: ./matching-service
      # G10/D13 — phải khớp EMBEDDING_MODEL ở environment dưới: ARG chỉ quyết định model được tải
      # SẴN vào image lúc build (Dockerfile); runtime vẫn đọc biến môi trường. Lệch hai bên thì
      # container cố tải model khác lúc khởi động, mất lợi ích "không cần Internet" của ARG.
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    ports: ["8090:8090"]
    environment:
      <<: *common-env
      # DB riêng của matching-service: chỉ mục embedding (mentor/mentee_embeddings).
      MATCHING_DB_URL: postgresql://postgres:postgres@matching-db:5432/matching_db
      # Đọc trực tiếp (read-only) DB của profile-service bằng role chỉ có quyền
      # SELECT — ngoại lệ đã được duyệt, xem CONVENTIONS.md mục 7.
      PROFILE_DB_URL: postgresql://matching_reader:matching_reader@profile-db:5432/profile_db
      INDEX_SYNC_INTERVAL: ${INDEX_SYNC_INTERVAL:-60}
      INDEX_SYNC_ENABLED: ${INDEX_SYNC_ENABLED:-true}
      INDEX_SYNC_BATCH: ${INDEX_SYNC_BATCH:-200}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-true}
    depends_on:
      matching-db: { condition: service_healthy }
      profile-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  ai-service:
    build: ./ai-service
    ports: ["8091:8091"]
    environment:
      <<: [*common-env, *storage-env]
      AI_DB_URL: postgresql://postgres:postgres@ai-db:5432/ai_db
      PROFILE_SERVICE_URL: http://profile-service:8082
      MENTORING_SERVICE_URL: http://mentoring-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
      CV_STORAGE_DIR: /data/cv
      ENRICHMENT_MAX_TURNS: ${ENRICHMENT_MAX_TURNS:-4}
      # Để trống DEEPSEEK_API_KEY => AI Interview & CV enrichment dùng engine rule-based (chạy offline)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      # Phỏng vấn giọng nói (OpenAI Realtime); để trống key => dev trả voice = null, APP_ENV=prod => 503
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      VOICE_INTERVIEW_TOPICS: ${VOICE_INTERVIEW_TOPICS:-4}
      VOICE_SESSION_MINUTES: ${VOICE_SESSION_MINUTES:-30}
      # Xác thực mentor 2 vòng: số lần làm vòng 1, chờ sau khi bị đóng đợt / từ chối, số lần admin yêu cầu làm lại
      VERIFICATION_MAX_ATTEMPTS_PER_ROUND: ${VERIFICATION_MAX_ATTEMPTS_PER_ROUND:-2}
      VERIFICATION_RETRY_DAYS: ${VERIFICATION_RETRY_DAYS:-15}
      VERIFICATION_ROUND1_MAX_RETAKE: ${VERIFICATION_ROUND1_MAX_RETAKE:-2}
      # Vòng 2 (admin phỏng vấn qua Jitsi): số khung giờ, hạn chọn, đổi giờ, trần token phòng, thời gian chờ mentor vào phòng
      VERIFICATION_ROUND2_SLOT_COUNT: ${VERIFICATION_ROUND2_SLOT_COUNT:-3}
      VERIFICATION_ROUND2_MAX_RESCHEDULE: ${VERIFICATION_ROUND2_MAX_RESCHEDULE:-2}
      VERIFICATION_ROUND2_RESCHEDULE_NOTICE_HOURS: ${VERIFICATION_ROUND2_RESCHEDULE_NOTICE_HOURS:-24}
      VERIFICATION_SLOT_CHOICE_DAYS: ${VERIFICATION_SLOT_CHOICE_DAYS:-3}
      VERIFICATION_ROOM_MAX_HOURS: ${VERIFICATION_ROOM_MAX_HOURS:-4}
      VERIFICATION_ROOM_OPENS_BEFORE_MINUTES: ${VERIFICATION_ROOM_OPENS_BEFORE_MINUTES:-10}
      VERIFICATION_ROOM_GRACE_MINUTES: ${VERIFICATION_ROOM_GRACE_MINUTES:-10}
      # Vòng 1 có camera: video + âm thanh quay theo đoạn, lưu trên volume riêng (không dùng chung với CV)
      VERIFICATION_STORAGE_DIR: /data/verification
      VIDEO_RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-60}
      VIDEO_RECONNECT_SECONDS: ${VIDEO_RECONNECT_SECONDS:-60}
      VIDEO_MAX_GAP_SECONDS: ${VIDEO_MAX_GAP_SECONDS:-10}
      TRANSCRIPT_MISMATCH_THRESHOLD: ${TRANSCRIPT_MISMATCH_THRESHOLD:-0.30}
    volumes:
      - cv-storage:/data/cv
      - verification-media:/data/verification
    depends_on:
      minio-init: { condition: service_completed_successfully }
      ai-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8085
      MATCHING_SERVICE_URL: http://matching-service:8090
      MENTORING_SERVICE_URL: http://mentoring-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      AI_SERVICE_URL: http://ai-service:8091
    depends_on:
      - auth-service
      - profile-service
      - learning-service
      - matching-service
      - mentoring-service
      - payment-service
      - ai-service

  # ---------------------------------------------------------------------------------------------------------------
  # Bản chốt v2.0 §6 — phòng học video + chat tự host (Jitsi Meet), xác thực bằng JWT do mentoring-service cấp
  # (GET /api/mentoring/sessions/{id}/room). Bật: docker compose --profile jitsi up -d ; mở https://localhost:8443
  # (chứng chỉ tự ký) một lần để trình duyệt chấp nhận. Cần UDP 10000 cho media (jitsi-jvb).
  # ---------------------------------------------------------------------------------------------------------------
  jitsi-prosody:
    image: jitsi/prosody:stable-9823
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: &jitsi-env
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "0"
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_APP_ID:-mentorhub}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET:-dev-only-jitsi-secret-change-me-0123456789abcdef}
      JWT_ACCEPTED_ISSUERS: ${JITSI_APP_ID:-mentorhub}
      JWT_ACCEPTED_AUDIENCES: jitsi
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-dev-only-jicofo-password}
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-dev-only-jvb-password}
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-dev-only-jicofo-component}
      TZ: Asia/Ho_Chi_Minh
    networks:
      default:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    image: jitsi/jicofo:stable-9823
    profiles: ["jitsi"]
    restart: unless-stopped
    environment: *jitsi-env
    depends_on: [jitsi-prosody]

  jitsi-jvb:
    image: jitsi/jvb:stable-9823
    profiles: ["jitsi"]
    restart: unless-stopped
    ports: ["10000:10000/udp"]
    environment:
      <<: *jitsi-env
      JVB_PORT: "10000"
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IP:-127.0.0.1}
    depends_on: [jitsi-prosody]

  jitsi-web:
    image: jitsi/web:stable-9823
    profiles: ["jitsi"]
    restart: unless-stopped
    ports: ["8443:443"]
    environment:
      <<: *jitsi-env
      PUBLIC_URL: https://localhost:8443
      ENABLE_LETSENCRYPT: "0"
      ENABLE_HTTP_REDIRECT: "0"
      DISABLE_HTTPS: "0"
    depends_on: [jitsi-prosody]

volumes:
  auth-db-data:
  profile-db-data:
  matching-db-data:
  mentoring-db-data:
  payment-db-data:
  learning-db-data:
  ai-db-data:
  cv-storage:
  minio-data:
  verification-media:
